name: Prod — toggle intent extractor (manual)

# Single-purpose rollout helper for the Phase 0-2 intent layer on the
# AWS production box (api.lawttorney.com). Sister workflow to
# dev-enable-intent-extractor.yml. workflow_dispatch ONLY — no auto-trigger.
#
# Idempotent: replaces an existing INTENT_EXTRACTOR_V2 line in .env,
# appends if missing. Restarts gunicorn the same way deploy-prod.yml does
# (TERM master, wait, fresh nohup) and waits for 3 consecutive healthy
# /pyapi/health responses before declaring success.
#
# Uses the same SSH secrets configured for deploy-prod.yml:
#   SSH_PRIVATE_KEY_PROD
#   SERVER_HOST_PROD
#   SERVER_USER_PROD
#
# Delete this file along with dev-enable-intent-extractor.yml once
# Phase 4 makes the flag unconditional.

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'INTENT_EXTRACTOR_V2 value to set on prod (true | false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  flip:
    name: Flip flag on prod
    runs-on: ubuntu-latest
    environment: production    # same gate as deploy-prod.yml
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Set flag + restart gunicorn + verify health
        env:
          FLAG_VALUE: ${{ inputs.value }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
            FLAG_VALUE="$FLAG_VALUE" bash <<'ENDSSH'
            set -e

            # Locate the app dir — deploy-prod.yml uses /home/ubuntu/Lawtech-AI
            # per the AWS setup. Try a couple of likely paths so this script
            # works against both naming conventions.
            for candidate in \
              /home/ubuntu/Lawtech-AI \
              /root/Lawtech-AI \
              /root/v2_multi_agent \
              /opt/Lawtech-AI; do
              if [ -d "$candidate" ] && [ -f "$candidate/.env" ]; then
                APP_DIR="$candidate"
                break
              fi
            done
            if [ -z "$APP_DIR" ]; then
              echo "ERROR: could not locate APP_DIR containing .env"
              exit 1
            fi
            echo "Using APP_DIR=$APP_DIR"
            cd "$APP_DIR"
            ENV_FILE="$APP_DIR/.env"

            echo "=== Current INTENT_EXTRACTOR_V2 state ==="
            grep -E '^INTENT_EXTRACTOR_V2=' "$ENV_FILE" || echo "(not set)"

            if grep -qE '^INTENT_EXTRACTOR_V2=' "$ENV_FILE"; then
              sed -i.bak -E "s/^INTENT_EXTRACTOR_V2=.*/INTENT_EXTRACTOR_V2=${FLAG_VALUE}/" "$ENV_FILE"
              echo "Replaced existing line"
            else
              echo "INTENT_EXTRACTOR_V2=${FLAG_VALUE}" >> "$ENV_FILE"
              echo "Appended new line"
            fi

            echo "=== After change ==="
            grep -E '^INTENT_EXTRACTOR_V2=' "$ENV_FILE"

            # Restart gunicorn — same pattern as deploy.yml/deploy-prod.yml.
            # preload_app=True means workers need a fresh master to pick up
            # the new env var.
            MASTER_PID=$(pgrep -f 'gunicorn.*core.gateway:app' -o 2>/dev/null || echo "0")
            if [ "$MASTER_PID" -gt "0" ] 2>/dev/null; then
              echo "Stopping gunicorn master (PID $MASTER_PID)..."
              kill -TERM "$MASTER_PID"
              for j in $(seq 1 10); do
                kill -0 "$MASTER_PID" 2>/dev/null || break
                sleep 1
              done
              echo "Gunicorn stopped"
            fi

            # Some prod boxes run via systemd. Try systemctl first, fall
            # back to a manual nohup if there's no service. The deploy
            # script logs the actual restart pattern — we mirror it here.
            if systemctl list-unit-files 2>/dev/null | grep -qE '^lawtech.*\.service'; then
              SERVICE=$(systemctl list-unit-files 2>/dev/null | awk '/^lawtech.*\.service/{print $1; exit}')
              echo "Restarting systemd service: $SERVICE"
              systemctl restart "$SERVICE"
            else
              echo "Starting gunicorn via nohup (no systemd unit found)"
              cd "$APP_DIR"
              nohup "$APP_DIR/venv/bin/gunicorn" -c gunicorn.conf.py core.gateway:app \
                > /dev/null 2>&1 &
            fi

            sleep 2
            NEW_PID=$(pgrep -f 'gunicorn.*core.gateway:app' -o 2>/dev/null || echo "?")
            echo "Gunicorn master PID after restart: $NEW_PID"

            # Detect port — deploy-prod.yml uses 5001 in some setups; the
            # AWS prod box may use 5000 or 8000 fronted by nginx. We probe
            # a few common ones.
            for PORT in 5001 5000 8000 8080; do
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$PORT/pyapi/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
                APP_PORT=$PORT
                echo "Detected app port: $APP_PORT (initial $STATUS)"
                break
              fi
            done
            if [ -z "$APP_PORT" ]; then
              echo "ERROR: no app port responded — check service logs"
              exit 1
            fi

            # Stable-health gate (3 consecutive 200/503)
            CONSECUTIVE_OK=0
            NEEDED=3
            for i in $(seq 1 24); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$APP_PORT/pyapi/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
                CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
                if [ "$CONSECUTIVE_OK" -ge "$NEEDED" ]; then
                  echo "Stable health: $NEEDED consecutive checks at HTTP $STATUS"
                  exit 0
                fi
                echo "Healthy (HTTP $STATUS), $CONSECUTIVE_OK/$NEEDED..."
              else
                CONSECUTIVE_OK=0
                echo "Waiting attempt $i/24 (HTTP $STATUS)"
              fi
            done
            echo "ERROR: timeout waiting for stable health"
            exit 1
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
