<style>

  .page { background: var(--paper); color: #1a1a1a; width: 210mm; min-height: 297mm; margin: 24px auto;
          box-shadow: 0 1px 6px rgba(0,0,0,.18); font-family: "Times New Roman", Times, serif; }
  @media (max-width: 230mm) { .page { width: auto; margin: 12px 16px; min-height: 0; } }

  .page p { margin: 0 0 .6em; }
  .b-title { font-weight: 700; margin: 0 0 .3em !important; }
  .b-heading { font-weight: 700; margin: 1.1em 0 .6em !important; }
  .b-heading.u, .b-title.u { text-decoration: underline; }
  .al-left { text-align: left; } .al-center { text-align: center; }
  .al-right { text-align: right; } .al-justify { text-align: justify; }

  .b-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 2em; margin: .5em 0 .8em; }
  .b-row .l { flex: 1 1 auto; } .b-row .r { flex: 0 0 auto; text-align: right; white-space: nowrap; }

  /* Numbered paragraph with a hanging number: the number sits in the gutter, wrapped lines align with the text. */
  .b-para { display: grid; grid-template-columns: 2.6em 1fr; margin: 0 0 .7em; text-align: justify; }
  .b-para .n { text-align: left; }
  .b-para .sub { grid-column: 2; display: grid; grid-template-columns: 2.2em 1fr; margin-top: .3em; }

  .b-sign { margin: 1.6em 0 .6em; }
  .b-table { border-collapse: collapse; width: 100%; margin: .6em 0 1em; }
  .b-table td, .b-table th { border: 1px solid #555; padding: 4px 6px; vertical-align: top; text-align: left; }
  .b-pagebreak { border: 0; border-top: 1px dashed #b5b0a6; margin: 1.6em -1cm; }

  .blank { background: var(--blank-bg); color: var(--blank-ink); border-radius: 3px; padding: 0 3px; font-style: italic; }
  .section { position: relative; border-radius: 4px; }
  .section:hover { outline: 1px dashed #9db6d8; outline-offset: 6px; }
  .section::before { content: attr(data-heading); position: absolute; left: -3.6cm; top: 0; width: 3.2cm;
                     font: 11px system-ui, sans-serif; color: #9a958c; text-align: right; }
  @media (max-width: 230mm) { .section::before { display: none; } }
</style>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Inline: **bold**, *italic*, __underline__, [[blank]], and "\n" as a line break.
function inline(s) {
  return esc(s)
    .replace(/\[\[([^\[\]\n]{1,80})\]\]/g, '<span class="blank">[$1]</span>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/__([^_]+)__/g, "<u>$1</u>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\n/g, "<br>");
}

const RENDER = {
  title:   b => `<p class="b-title al-${b.align}${b.underline ? " u" : ""}"${b.bold ? "" : ' style="font-weight:400"'}>${inline(b.text)}</p>`,
  heading: b => `<p class="b-heading al-${b.align}${b.underline ? " u" : ""}">${inline(b.text)}</p>`,
  text:    b => `<p class="al-${b.align}" style="padding-left:${b.indent_cm || 0}cm">${inline(b.text)}</p>`,
  row:     b => `<div class="b-row"><div class="l">${b.left.map(inline).join("<br>")}</div><div class="r">${b.right.map(inline).join("<br>")}</div></div>`,
  para:    b => `<div class="b-para"><span class="n">${esc(b.label || (b.number ? b.number + "." : ""))}</span><span>${inline(b.text)}</span>${
                  (b.sub || []).map(s => `<div class="sub"><span>${esc(s.marker)}</span><span>${inline(s.text)}</span></div>`).join("")}</div>`,
  signature: b => `<p class="b-sign al-${b.align}">${b.lines.map(inline).join("<br>")}</p>`,
  table:   b => `<table class="b-table">${b.header && b.header.length ? `<tr>${b.header.map(h => `<th>${inline(h)}</th>`).join("")}</tr>` : ""}${
                  b.rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`,
  page_break: () => `<hr class="b-pagebreak">`,
};

function render(a) {
  const p = a.page || {}, m = p.margins_cm || {top: 2.5, bottom: 2.5, left: 4, right: 2.5};
  document.getElementById("meta").textContent = `${a.title} · v${a.version}`;
  document.getElementById("out").innerHTML =
    `<div class="page" style="padding:${m.top}cm ${m.right}cm ${m.bottom}cm ${m.left}cm;` +
    `font-size:${p.font_size_pt || 14}pt;line-height:${p.line_spacing || 1.5}">` +
    a.sections.map(s => `<div class="section" id="${esc(s.id)}" data-heading="${esc(s.heading)}">${
      s.blocks.map(b => (RENDER[b.type] || (() => ""))(b)).join("")}</div>`).join("") +
    `</div>`;
}

render(JSON.parse(document.getElementById("sample").textContent));
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => render(JSON.parse(t))).catch(err => alert("Not a valid artifact: " + err));
});
</script>
