apiVersion: 1

contactPoints:
  - orgId: 1
    name: lawtech-oncall
    receivers:
      # Email alerts — set GF_SMTP_* env vars in docker-compose to enable.
      # If SMTP is not configured this receiver is silently skipped.
      - uid: email-oncall
        type: email
        settings:
          addresses: "admin@lawttorney.com"
          subject: "[Lawtech-AI] {{ .GroupLabels.alertname }} — {{ .Status | title }}"
          message: |
            {{ range .Alerts }}
            Alert: {{ .Annotations.summary }}
            Detail: {{ .Annotations.description }}
            Severity: {{ .Labels.severity }}
            {{ end }}
        disableResolveMessage: false
