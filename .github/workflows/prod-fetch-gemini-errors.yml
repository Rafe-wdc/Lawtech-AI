name: Prod Fetch Gemini + Non_legal errors (read-only diagnostic)

# One-off workflow_dispatch — SSH's into the prod box and pulls the last
# hour of application logs, filtered for:
#   - "Gemini" / "google.genai" errors
#   - "Non-legal agent" info + errors
#   - "Web search fallback" invocations
#   - "web fallback returned empty candidates" — the specific silent-empty
#     path that turns real answers into the "unable to retrieve"
#     hardcoded fallback string in core/agent_fallback.py
#
# Why we need this: after the msgpack Send fix (PR #7) landed 2026-07-17,
# the msgpack `error` SSE event is gone, but every /pyapi/chat and
# /pyapi/search/stream call still returns the same 103-char
# "I was unable to retrieve information..." body in ~1.5s. That's much
# faster than a real Gemini generation — smells like the SDK is either
# rejecting the model ID or silently returning empty content on every
# call. This workflow surfaces the actual server-side signal so we can
# fix root cause instead of guessing.
#
# Read-only: no files created / modified / deleted on prod.

on:
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch Gemini/Non_legal errors from prod
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lawttorney.com/pyapi/health

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Pull recent Gemini + Non_legal signal
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
              'bash -s' << 'ENDSSH'
          set -u

          echo "=========================================================="
          echo " 0. Box identity + service uptime (confirm we're on prod)"
          echo "=========================================================="
          hostname
          curl -fsS https://api.lawttorney.com/pyapi/health 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f"  version: {d.get(\"version\")}  uptime_s: {d.get(\"uptime_seconds\")}")' || echo "(health probe failed)"
          sudo systemctl status lawttorney-v2.service --no-pager 2>/dev/null | head -5 || echo "(systemctl unavailable)"
          echo

          SINCE="1 hour ago"
          UNIT=lawttorney-v2.service

          echo "=========================================================="
          echo " 1. Non-legal agent activity (last hour)"
          echo "=========================================================="
          sudo journalctl -u "$UNIT" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -iE "Non-legal agent|non_legal|NonLegal" \
            | tail -40 || echo "  (no Non_legal log lines)"
          echo

          echo "=========================================================="
          echo " 2. Empty-candidate / silent-empty Gemini paths (last hour)"
          echo "     — this is the specific pattern that produces the"
          echo "     'I was unable to retrieve information...' body."
          echo "=========================================================="
          sudo journalctl -u "$UNIT" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -iE "returned empty candidates|empty parts|web fallback returned|Gemini web fallback" \
            | tail -40 || echo "  (no empty-candidate log lines)"
          echo

          echo "=========================================================="
          echo " 3. Web-search fallback invocations (orchestrator_synthesize"
          echo "     falls into this when all agents return empty content)"
          echo "=========================================================="
          sudo journalctl -u "$UNIT" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -iE "All agents empty|invoking web search last resort|web_search_fallback|Web search fallback failed" \
            | tail -40 || echo "  (no web-fallback log lines)"
          echo

          echo "=========================================================="
          echo " 4. Google GenAI / SDK errors (last hour)"
          echo "=========================================================="
          sudo journalctl -u "$UNIT" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -iE "google.genai|google_genai|ClientError|Gemini.*error|API_KEY_INVALID|INVALID_ARGUMENT|RECITATION|SAFETY|model.*not.*found|404|BLOCKED_REASON|max_retries" \
            | tail -60 || echo "  (no Google GenAI error log lines)"
          echo

          echo "=========================================================="
          echo " 5. Any ERROR-level log line from the app (last hour)"
          echo "=========================================================="
          sudo journalctl -u "$UNIT" --since "$SINCE" --no-pager 2>/dev/null \
            | grep -E "\\[ERROR\\]|level=error|ERROR:" \
            | tail -40 || echo "  (no ERROR lines)"
          echo

          echo "=========================================================="
          echo " 6. GOOGLE_API_KEY presence in the running service env"
          echo "     (just prints length + first 6 chars — never full key)"
          echo "=========================================================="
          PID=$(pgrep -f "lawttorney-v2\|uvicorn core.gateway" | head -1)
          if [ -n "$PID" ]; then
            KEY=$(sudo cat "/proc/$PID/environ" 2>/dev/null | tr '\0' '\n' | grep -E '^GOOGLE_API_KEY=' | cut -d= -f2)
            if [ -n "$KEY" ]; then
              echo "  GOOGLE_API_KEY length: ${#KEY}   prefix: ${KEY:0:6}..."
            else
              echo "  GOOGLE_API_KEY: NOT SET IN SERVICE ENV"
            fi
          else
            echo "  (could not locate service PID)"
          fi
          echo

          echo "=========================================================="
          echo " 7. Configured Gemini model IDs (grep core/clients.py)"
          echo "=========================================================="
          sudo grep -nE "google_genai:gemini" /root/Lawtech-AI/core/clients.py 2>/dev/null \
            || sudo grep -nE "google_genai:gemini" /opt/lawtech-ai/core/clients.py 2>/dev/null \
            || echo "  (core/clients.py not found in expected paths)"
          echo

          echo "=========================================================="
          echo " 8. Quick live probe: does gemini-2.5-flash accept a 1-token"
          echo "     hello call? Runs in the same venv as the service."
          echo "=========================================================="
          APP_DIR=""
          for cand in /root/Lawtech-AI /opt/lawtech-ai; do
            if [ -f "$cand/core/clients.py" ]; then APP_DIR="$cand"; break; fi
          done
          if [ -n "$APP_DIR" ] && [ -x "$APP_DIR/.venv/bin/python3" ]; then
            sudo -E env PYTHONPATH="$APP_DIR" "$APP_DIR/.venv/bin/python3" - << 'PY'
import os, traceback
from core.clients import get_gemini_flash_lite, get_gemini_flash_full
for name, factory in [("flash_lite (gemini-2.5-flash-lite)", get_gemini_flash_lite),
                      ("flash_full (gemini-2.5-flash)", get_gemini_flash_full)]:
    try:
        llm = factory(temperature=0.1, max_output_tokens=64)
        resp = llm.invoke("Reply with exactly one word: hello")
        txt = getattr(resp, "text", None) or getattr(resp, "content", None) or repr(resp)
        print(f"  {name}: OK  len={len(str(txt))}  head={str(txt)[:120]!r}")
    except Exception as e:
        first_line = str(e).splitlines()[0] if str(e) else type(e).__name__
        print(f"  {name}: FAIL  {type(e).__name__}: {first_line[:280]}")
PY
          else
            echo "  (could not locate app venv / dir — checked /root/Lawtech-AI + /opt/lawtech-ai)"
          fi
          echo

          echo "=========================================================="
          echo " DIAGNOSTIC COMPLETE"
          echo "=========================================================="
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
