name: Prod — rotate GOOGLE_API_KEY

# One-off workflow_dispatch. SSHes into prod, replaces the
# GOOGLE_API_KEY= line in the systemd EnvironmentFile= (the .env under
# /root/Lawtech-AI/), restarts lawttorney-v2 to pick up the new env,
# and verifies /pyapi/health returns 200 before returning.
#
# Reads the new key from the repo secret `GOOGLE_API_KEY_ROTATE` so the
# key never appears in workflow logs or the workflow_dispatch history.
# Rotate the secret out (or delete it) after the workflow finishes.
#
# Rollback: the workflow copies the old .env to .env.backup-<epoch>
# before writing. If the health check fails post-restart it restores
# the backup automatically. If a *later* problem surfaces, ssh into
# prod and `sudo cp /root/Lawtech-AI/.env.backup-<epoch>
# /root/Lawtech-AI/.env && sudo systemctl restart lawttorney-v2`.

on:
  workflow_dispatch:

jobs:
  rotate_key:
    name: Rotate GOOGLE_API_KEY on prod
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lawttorney.com/pyapi/health

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Rotate GOOGLE_API_KEY and restart
        env:
          NEW_KEY: ${{ secrets.GOOGLE_API_KEY_ROTATE }}
        run: |
          if [ -z "$NEW_KEY" ]; then
            echo "ERROR: secret GOOGLE_API_KEY_ROTATE is empty or unset. Aborting."
            exit 1
          fi
          # Prevent the key from ever landing in log output.
          echo "::add-mask::$NEW_KEY"

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
              "NEW_KEY='$NEW_KEY' bash -s" << 'ENDSSH'
          set -euo pipefail

          # Discover the systemd-authoritative env file. Same pattern as
          # prod-cors-add-origin.yml so we always target the file the
          # running service actually reads.
          ENV_FILE_RAW=$(sudo systemctl show lawttorney-v2 -p EnvironmentFiles --value 2>/dev/null | tr ' ' '\n' | grep -v '^$' | head -1 | sed 's|^-||' | awk '{print $1}')
          ENV_FILE=""
          if [ -n "$ENV_FILE_RAW" ] && sudo test -f "$ENV_FILE_RAW"; then
            ENV_FILE="$ENV_FILE_RAW"
          else
            for candidate in \
                /root/Lawtech-AI/.env \
                /root/Lawtech-AI/.env.production \
                /root/Lawtech-AI/.env.prod \
                /etc/lawttorney/.env \
                /etc/lawttorney-v2/.env; do
              if sudo test -f "$candidate"; then
                ENV_FILE="$candidate"
                break
              fi
            done
          fi
          if [ -z "$ENV_FILE" ] || ! sudo test -f "$ENV_FILE"; then
            echo "ERROR: could not locate .env file."
            sudo systemctl show lawttorney-v2 -p EnvironmentFiles
            exit 1
          fi
          echo "Discovered .env: $ENV_FILE"

          echo "=========================================================="
          echo " 1. Show current GOOGLE_API_KEY line (masked)"
          echo "=========================================================="
          # Show only the prefix/suffix so we can tell one key from another
          # in logs without leaking the value.
          CURRENT_KEY=$(sudo grep "^GOOGLE_API_KEY=" "$ENV_FILE" | head -1 | sed 's/^GOOGLE_API_KEY=//' | tr -d '"' || true)
          if [ -z "$CURRENT_KEY" ]; then
            echo "  (no GOOGLE_API_KEY line — will append)"
          else
            LEN=${#CURRENT_KEY}
            echo "  length=$LEN prefix=${CURRENT_KEY:0:6}... suffix=...${CURRENT_KEY: -4}"
          fi
          echo

          echo "=========================================================="
          echo " 2. Backup .env"
          echo "=========================================================="
          BACKUP="/root/Lawtech-AI/.env.backup-$(date +%s)"
          sudo cp "$ENV_FILE" "$BACKUP"
          echo "Backup: $BACKUP"
          echo

          echo "=========================================================="
          echo " 3. Write new GOOGLE_API_KEY (value masked)"
          echo "=========================================================="
          # Show the NEW key's shape too so post-run we can verify the swap
          # actually landed without ever printing the full key.
          NEW_LEN=${#NEW_KEY}
          echo "  new key length=$NEW_LEN prefix=${NEW_KEY:0:6}... suffix=...${NEW_KEY: -4}"

          # Use a delimiter-safe python one-liner instead of sed so `/`,
          # `.`, `_`, `-` etc. inside the key can't break the substitution.
          # Reads current file, replaces (or appends) the GOOGLE_API_KEY
          # line, writes back atomically via tempfile.
          sudo python3 - "$ENV_FILE" "$NEW_KEY" <<'PY'
          import os, sys, tempfile
          env_path, new_key = sys.argv[1], sys.argv[2]
          with open(env_path, "r", encoding="utf-8") as f:
              lines = f.read().splitlines()
          new_line = f'GOOGLE_API_KEY="{new_key}"'
          replaced = False
          out = []
          for ln in lines:
              if ln.startswith("GOOGLE_API_KEY="):
                  out.append(new_line)
                  replaced = True
              else:
                  out.append(ln)
          if not replaced:
              out.append(new_line)
          # Preserve trailing newline convention.
          body = "\n".join(out) + "\n"
          # Preserve owner/mode of the original file.
          st = os.stat(env_path)
          fd, tmp = tempfile.mkstemp(prefix=".env.new-", dir=os.path.dirname(env_path))
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as f:
                  f.write(body)
              os.chown(tmp, st.st_uid, st.st_gid)
              os.chmod(tmp, st.st_mode & 0o7777)
              os.replace(tmp, env_path)
          except Exception:
              os.unlink(tmp)
              raise
          print(f"  updated {env_path} (replaced={replaced})")
          PY
          echo

          echo "=========================================================="
          echo " 4. Verify updated key line (masked)"
          echo "=========================================================="
          POST_KEY=$(sudo grep "^GOOGLE_API_KEY=" "$ENV_FILE" | head -1 | sed 's/^GOOGLE_API_KEY=//' | tr -d '"')
          POST_LEN=${#POST_KEY}
          echo "  post-write length=$POST_LEN prefix=${POST_KEY:0:6}... suffix=...${POST_KEY: -4}"
          if [ "$POST_KEY" != "$NEW_KEY" ]; then
            echo "ERROR: written key doesn't match input. Rolling back."
            sudo cp "$BACKUP" "$ENV_FILE"
            exit 1
          fi
          echo

          echo "=========================================================="
          echo " 5. Restart lawttorney-v2"
          echo "=========================================================="
          sudo systemctl restart lawttorney-v2
          echo "Waiting for healthy..."
          for i in $(seq 1 20); do
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5001/pyapi/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  Healthy after $((i * 3))s"
              break
            fi
            echo "  Waiting... attempt $i/20 (HTTP $STATUS)"
            if [ "$i" = "20" ]; then
              echo "ERROR: service didn't come back after 60s. Rolling back."
              sudo cp "$BACKUP" "$ENV_FILE"
              sudo systemctl restart lawttorney-v2
              exit 1
            fi
          done
          echo

          echo "=========================================================="
          echo " 6. Verify Google key surfaces as healthy in /pyapi/health"
          echo "=========================================================="
          # /pyapi/health checks google_key presence + basic reachability.
          # A 200 with google_key.status=ok proves the file was reloaded.
          HEALTH=$(curl -s --max-time 10 http://localhost:5001/pyapi/health 2>&1 || echo "{}")
          echo "$HEALTH" | python3 -c "
          import json, sys
          try:
              d = json.loads(sys.stdin.read())
          except Exception:
              print('  could not parse health payload'); sys.exit(0)
          gk = d.get('checks', {}).get('google_key', {})
          print(f\"  google_key.status = {gk.get('status')}\")
          print(f\"  uptime_seconds    = {d.get('uptime_seconds')}\")
          print(f\"  overall status    = {d.get('status')}\")
          "
          echo

          echo "=========================================================="
          echo " DONE — backup at $BACKUP (delete after verifying)"
          echo "=========================================================="
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
