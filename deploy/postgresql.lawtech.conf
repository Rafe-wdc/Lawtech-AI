# Lawtech-AI — PostgreSQL 16 tuning snippet for the scaling target host
# (8 vCPU / 32 GB RAM / NVMe). Append this file to the end of postgresql.conf,
# or use `include 'postgresql.lawtech.conf'`.
#
# Sources & rationale documented in docs/phase1_provision_runbook.md §6.
#
# Validate after restart:
#   sudo -u postgres psql -c "SHOW shared_buffers;"
#   sudo -u postgres psql -c "SHOW effective_cache_size;"
#   sudo -u postgres psql -c "SHOW max_connections;"
#
# Install:
#   sudo cp deploy/postgresql.lawtech.conf /etc/postgresql/16/main/conf.d/lawtech.conf
#   sudo systemctl restart postgresql

# ── Connections ──────────────────────────────────────────────────────────────
# Worker pools:  6 gunicorn workers × (LangGraph saver ~10 + chat_store ~10)
#                = ~120 baseline. 200 gives ~40 % headroom for spikes/admin.
max_connections = 200

# ── Memory ───────────────────────────────────────────────────────────────────
# 25 % of RAM — standard production sizing for OLTP-style workload.
shared_buffers = 8GB

# Tells the planner roughly how much RAM is available for OS page cache.
# 75 % of RAM is the upper bound of common guidance for a dedicated DB box.
effective_cache_size = 24GB

# Per-sort/hash op. With 200 connections, peak fan-out (200 × 16 MB = 3.2 GB)
# stays well clear of OOM territory. Raise per-session via SET if a heavy
# analytical query needs it.
work_mem = 16MB

# Autovacuum / index builds. RAM/16 is the standard guideline.
maintenance_work_mem = 2GB

# ── WAL / Checkpointing ──────────────────────────────────────────────────────
wal_buffers = 16MB
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# ── SSD/NVMe-aware planner hints ─────────────────────────────────────────────
# Default is 4 (assumes spinning disk). NVMe random IO is near-sequential,
# so lower the random_page_cost to bias the planner toward index scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ── Parallelism (8 vCPU) ─────────────────────────────────────────────────────
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# ── Logging (slow query observability) ───────────────────────────────────────
# Surface queries > 1 s so we can spot N+1 from LangGraph saver / chat_store
# under load. Lower to 250ms during load testing if you want a finer signal.
log_min_duration_statement = 1000
log_line_prefix = '%t [%p] %u@%d '
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0

# ── Statistics (autovacuum tuning) ───────────────────────────────────────────
# Default 100 is fine for our table count; raise if planner gets unstable
# on chat_messages / checkpoint tables.
default_statistics_target = 100

# ── Autovacuum (chat_messages will be the hot table) ─────────────────────────
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
