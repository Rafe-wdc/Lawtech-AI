name: Dev — clear OCR cache (one-off diagnostic)

# One-off helper for the 2026-09-06 WhatsApp-PDF investigation. Earlier
# 2.5-flash runs hit `504 DEADLINE_EXCEEDED` on 2 of 3 pages and may
# have written a partial OCR text to `chroma_store/.ocr_cache` on the
# dev Vultr box. Because the cache is keyed by file HASH, every
# subsequent upload of that same PDF reuses the stale/partial entry —
# even after the 3.6-flash upgrade. This workflow SSHes to the dev box,
# lists the cache, and (unless dry-run) removes it. No gunicorn
# restart needed — the cache is a filesystem read-through only.
#
# Delete this file after the WhatsApp-PDF investigation is closed.
# Reuses SSH_PRIVATE_KEY / SERVER_HOST / SERVER_USER secrets.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (list only, do not delete)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  clear:
    name: Clear .ocr_cache on dev
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Inspect + clear .ocr_cache
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            DRY_RUN="$DRY_RUN" bash <<'ENDSSH'
            set -e

            APP_DIR=/root/v2_multi_agent
            CACHE_DIR="$APP_DIR/chroma_store/.ocr_cache"

            echo "=== Target: $CACHE_DIR ==="
            if [ ! -d "$CACHE_DIR" ]; then
              echo "(cache dir does not exist — nothing to do)"
              exit 0
            fi

            echo "=== Current contents ==="
            ls -la "$CACHE_DIR" | head -50
            entry_count=$(find "$CACHE_DIR" -type f 2>/dev/null | wc -l)
            size_bytes=$(du -sb "$CACHE_DIR" 2>/dev/null | awk '{print $1}')
            echo "=== Summary ==="
            echo "entries=$entry_count  size_bytes=$size_bytes"

            if [ "$DRY_RUN" = "true" ]; then
              echo "=== DRY RUN — no deletion ==="
              exit 0
            fi

            echo "=== Clearing cache ==="
            rm -rf "$CACHE_DIR"
            mkdir -p "$CACHE_DIR"
            echo "cleared. next OCR of any PDF will run fresh."
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
