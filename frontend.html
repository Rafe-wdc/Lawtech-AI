<script>
// ============================================================
// State
// ============================================================
let currentThreadId = sessionStorage.getItem('lawttorney_thread_id') || null;
let currentTurnCount = parseInt(sessionStorage.getItem('lawttorney_turn_count') || '0');
let lastQuery = ''; // For retry on error

function getBase() { return document.getElementById('apiBase').value.replace(/\/+$/, ''); }
function getApiKey() { return (document.getElementById('apiKey') || {}).value || ''; }
function authHeaders(extra) {
  var h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  var k = getApiKey();
  if (k) h['X-API-Key'] = k;
  return h;
}

// API key — persisted in localStorage across sessions
function initApiKey() {
  var el = document.getElementById('apiKey');
  if (!el) return;
  var saved = localStorage.getItem('lawtech_api_key');
  if (saved) el.value = saved;
  el.addEventListener('change', function() { localStorage.setItem('lawtech_api_key', el.value); });
}

// Integration JWT (FSD login token used for Google Docs / Notion extraction).
// Persisted in localStorage; sent as `integration_token` form/JSON field on
// chat requests so the backend can detect & extract content from URLs.
function initIntegrationToken() {
  var el = document.getElementById('integrationToken');
  if (!el) return;
  var saved = localStorage.getItem('lawtech_integration_token');
  if (saved) el.value = saved;
  el.addEventListener('change', function() {
    localStorage.setItem('lawtech_integration_token', el.value);
  });
}
function getIntegrationToken() {
  var el = document.getElementById('integrationToken');
  return (el && el.value && el.value.trim()) || null;
}

// Language preference — persisted in localStorage across sessions
function getPreferredLang() {
  const sel = document.getElementById('langSelect');
  return sel ? sel.value : 'auto';
}
function initLangSelect() {
  const sel = document.getElementById('langSelect');
  if (!sel) return;
  const saved = localStorage.getItem('lawtech_lang');
  if (saved) sel.value = saved;
  sel.addEventListener('change', () => localStorage.setItem('lawtech_lang', sel.value));
}

function persistThread(threadId, turnCount) {
  currentThreadId = threadId;
  if (turnCount !== undefined) currentTurnCount = turnCount;
  if (threadId) {
    sessionStorage.setItem('lawttorney_thread_id', threadId);
    sessionStorage.setItem('lawttorney_turn_count', String(currentTurnCount));
  } else {
    sessionStorage.removeItem('lawttorney_thread_id');
    sessionStorage.removeItem('lawttorney_turn_count');
    currentTurnCount = 0;
  }
}

function updateContextBar(opts) {
  // opts: { turn, rewritten, effectiveQuery, hasSummary, historyTurns, threadId }
  const bar = document.getElementById('contextBar');
  if (!bar) return;
  const pills = [];

  const tid = opts.threadId || currentThreadId;
  if (tid) {
    pills.push('<span class="context-pill thread">Thread: ' + escapeHtml(tid.substring(0, 8)) + '...</span>');
  }

  const turn = opts.turn || currentTurnCount;
  if (turn > 0) {
    pills.push('<span class="context-pill turn">Turn ' + turn + '</span>');
  }

  if (opts.hasSummary) {
    pills.push('<span class="context-pill summary">Context loaded</span>');
  }

  if (opts.rewritten && opts.effectiveQuery) {
    pills.push('<span class="context-pill rewrite">Query rewritten</span>');
    pills.push('<span class="rewrite-detail">"' + escapeHtml(opts.effectiveQuery.substring(0, 80)) + (opts.effectiveQuery.length > 80 ? '...' : '') + '"</span>');
  }

  bar.innerHTML = pills.join('');
}

// ============================================================
// Tab Switching
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
}

// ============================================================
// Health Check
// ============================================================
async function checkHealth() {
  const dot = document.getElementById('healthDot');
  const txt = document.getElementById('healthText');
  try {
    const r = await fetch(getBase() + '/pyapi/health', { headers: authHeaders() });
    const d = await r.json();
    dot.classList.add('ok');
    txt.textContent = `v${d.version} — Connected`;
    addLog('success', `Health OK: ${JSON.stringify(d)}`);
  } catch (e) {
    dot.classList.remove('ok');
    txt.textContent = 'Disconnected';
    addLog('error', `Health check failed: ${e.message}`);
  }
}

// ============================================================
// Session History
// ============================================================
async function loadSessionList() {
  const container = document.getElementById('sessionList');
  try {
    const r = await fetch(getBase() + '/pyapi/threads?limit=30', { headers: authHeaders() });
    if (!r.ok) throw new Error('Failed to fetch');
    const d = await r.json();
    const threads = d.threads || [];

    if (threads.length === 0) {
      container.innerHTML = '<div class="session-empty">No previous sessions</div>';
      return;
    }

    container.innerHTML = threads.map(t => {
      const preview = t.preview || 'Empty conversation';
      const isActive = currentThreadId === t.thread_id;
      const ago = timeAgo(t.updated_at);
      const safeId = escapeHtml(t.thread_id);
      const safeTurns = parseInt(t.total_turns, 10) || 0;
      return `<div class="session-item${isActive ? ' active' : ''}"
                   data-thread-id="${safeId}"
                   onclick="restoreSession('${safeId}', ${safeTurns})"
                   title="${escapeHtml(preview)}">
        <div class="session-preview">${escapeHtml(preview)}</div>
        <div class="session-meta">
          <span>${safeTurns} turn${safeTurns !== 1 ? 's' : ''}</span>
          <span>${escapeHtml(ago)}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    container.innerHTML = '<div class="session-empty">Could not load sessions</div>';
  }
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr.replace(' ', 'T') + 'Z'); // SQLite dates are UTC, space→T for strict ISO 8601
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString();
  } catch { return ''; }
}

async function restoreSession(threadId, totalTurns) {
  // Update state
  persistThread(threadId, totalTurns);
  document.getElementById('threadId').value = threadId;

  // Switch to chat tab
  switchTab('chat');

  // Show loading
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.innerHTML = '<div class="msg system">Loading conversation...</div>';
  document.getElementById('chatMeta').textContent =
    `Thread: ${threadId.substring(0, 8)}... | ${totalTurns} turns | Loading...`;

  // Highlight active session in sidebar
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.threadId === threadId);
  });

  try {
    const r = await fetch(getBase() + `/pyapi/threads/${threadId}/messages`, { headers: authHeaders() });
    if (!r.ok) throw new Error('Failed to load messages');
    const d = await r.json();
    const messages = d.messages || [];

    chatMessages.innerHTML = '';

    if (messages.length === 0) {
      addChatMsg('system', 'No messages found in this conversation.');
      return;
    }

    // Render each turn
    messages.forEach(msg => {
      var q = msg.user_query || '';
      var a = msg.ai_response || '';

      // Special message types (compliance report, revised draft)
      if (q.startsWith('[COMPLIANCE_CHECK]')) {
        // Render as compliance report (amber)
        var reportDiv = document.createElement('div');
        reportDiv.className = 'msg ai compliance-report';
        reportDiv.dataset.markdown = a;
        reportDiv.dataset.originalDraft = q.replace('[COMPLIANCE_CHECK]', '').trim();
        reportDiv.dataset.complianceReport = a;
        reportDiv.innerHTML = '<div class="compliance-badge">\uD83D\uDD0D Compliance Report</div>' +
          '<div class="ai-content">' + renderMarkdown(a) + '</div>' +
          '<div class="response-actions">' +
            '<button class="response-action-btn" onclick="copyResponse(this)">\uD83D\uDCCB Copy</button>' +
            '<button class="response-action-btn" onclick="exportComplianceReport(this,\'docx\')">\uD83D\uDCE5 Export .docx</button>' +
            '<button class="response-action-btn fix-draft-btn" onclick="fixDraft(this)">\uD83D\uDD27 Fix Draft</button>' +
          '</div>';
        chatMessages.appendChild(reportDiv);
      } else if (q.startsWith('[FIX_DRAFT]')) {
        // Render as revised draft (green)
        var revisedDiv = document.createElement('div');
        revisedDiv.className = 'msg ai revised-draft';
        revisedDiv.dataset.markdown = a;
        revisedDiv.innerHTML = '<div class="revised-badge">\uD83D\uDD27 Revised Draft (v2)</div>' +
          '<div class="ai-content">' + renderMarkdown(a) + '</div>' +
          '<div class="response-actions">' +
            '<button class="response-action-btn" onclick="copyResponse(this)">\uD83D\uDCCB Copy</button>' +
            '<button class="response-action-btn" onclick="addStatuteRefs(this)" data-turn="0">\u2696\uFE0F Add Statutes</button>' +
            '<div class="export-dropdown">' +
              '<button class="response-action-btn" onclick="toggleExportMenu(this)">\uD83D\uDCE5 Export \u25BE</button>' +
              '<div class="export-dropdown-menu">' +
                '<button class="export-dropdown-item" onclick="exportRevisedDraft(this,\'docx\')"><span class="ext">.docx</span> Word</button>' +
                '<button class="export-dropdown-item" onclick="exportRevisedDraft(this,\'pdf\')"><span class="ext">.pdf</span> PDF</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        chatMessages.appendChild(revisedDiv);
      } else {
        // Normal user + AI message pair
        addChatMsg('user', q);
        addChatMsg('ai', a);
      }
    });

    document.getElementById('chatMeta').textContent =
      `Thread: ${threadId.substring(0, 8)}... | Turn ${totalTurns} | Restored`;
    updateContextBar({ turn: totalTurns, threadId: threadId });

    // Scroll to bottom
    chatMessages.scrollTop = chatMessages.scrollHeight;

  } catch (e) {
    chatMessages.innerHTML = '';
    addChatMsg('system', `Restored thread ${threadId.substring(0, 8)}... (turn ${totalTurns}). Previous messages could not be loaded, but you can continue the conversation.`);
    document.getElementById('chatMeta').textContent =
      `Thread: ${threadId.substring(0, 8)}... | Turn ${totalTurns}`;
    updateContextBar({ turn: totalTurns, threadId: threadId });
  }
}

// ============================================================
// Legal Q&A Chat
// ============================================================
function newChat() {
  persistThread(null);
  document.getElementById('threadId').value = '';
  document.getElementById('chatMessages').innerHTML =
    '<div class="msg system">New conversation started.</div>';
  document.getElementById('chatMeta').textContent = 'New conversation';
  document.getElementById('contextBar').innerHTML = '';
  document.getElementById('persistentFilesBar').innerHTML = '';
  // Update sidebar — deselect active session
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

// --- File Attachment (ChatGPT-style) ---
let pendingFiles = [];
const ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.webp','.docx','.txt','.md','.csv','.xlsx'];
const MAX_ATTACH_FILES = 30;
const MAX_ATTACH_SIZE_MB = 1024;
const MAX_ATTACH_SIZE = MAX_ATTACH_SIZE_MB * 1024 * 1024;

const FILE_ICONS = {
  pdf: '📄', docx: '📝', xlsx: '📊', csv: '📋',
  txt: '📃', md: '📃', jpg: '🖼', jpeg: '🖼', png: '🖼', webp: '🖼',
};
const FILE_BADGE_CLASS = {
  pdf: 'badge-pdf', jpg: 'badge-img', jpeg: 'badge-img', png: 'badge-img', webp: 'badge-img',
  docx: 'badge-docx', xlsx: 'badge-xlsx', csv: 'badge-csv', txt: 'badge-txt', md: 'badge-md',
};

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024*1024) return `${(bytes/1024).toFixed(0)} KB`;
  if (bytes < 1024*1024*1024) return `${(bytes/1024/1024).toFixed(1)} MB`;
  return `${(bytes/1024/1024/1024).toFixed(2)} GB`;
}

function handleChatFiles(fileList) {
  for (const f of fileList) {
    if (pendingFiles.length >= MAX_ATTACH_FILES) {
      addLog('warn', `Max ${MAX_ATTACH_FILES} files per message`);
      break;
    }
    const ext = '.' + f.name.split('.').pop().toLowerCase();
    if (!ALLOWED_EXTS.includes(ext)) {
      addLog('warn', `Unsupported type: ${ext} — allowed: PDF, images, DOCX, TXT, CSV, XLSX`);
      continue;
    }
    if (f.size > MAX_ATTACH_SIZE) {
      addLog('warn', `${f.name} too large (${fmtSize(f.size)}) — max ${MAX_ATTACH_SIZE_MB} MB`);
      continue;
    }
    // Avoid duplicates by name
    if (pendingFiles.some(p => p.name === f.name && p.size === f.size)) continue;
    pendingFiles.push(f);
  }
  renderFileCards();
  document.getElementById('chatFileInput').value = '';
}

// Paste image from clipboard
function handlePaste(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const f = item.getAsFile();
      if (f) {
        // Rename to include type
        const ext = item.type.split('/')[1] || 'png';
        const named = new File([f], `pasted_image.${ext}`, { type: item.type });
        handleChatFiles([named]);
      }
    }
  }
}

function renderFileCards() {
  const bar = document.getElementById('filePreviewBar');
  const attachBtn = document.getElementById('attachBtn');
  const storageEl = document.getElementById('storageIndicator');

  if (!pendingFiles.length) {
    bar.innerHTML = '';
    attachBtn.classList.remove('has-files');
    storageEl.className = 'storage-indicator';
    return;
  }

  attachBtn.classList.add('has-files');

  bar.innerHTML = pendingFiles.map((f, i) => {
    const ext = f.name.split('.').pop().toLowerCase();
    const isImg = ['jpg','jpeg','png','webp'].includes(ext);
    const badge = FILE_BADGE_CLASS[ext] || 'badge-txt';
    const icon = FILE_ICONS[ext] || '📎';
    const shortName = f.name.length > 22 ? f.name.slice(0,19) + '…' + f.name.slice(-4) : f.name;

    if (isImg) {
      const objUrl = URL.createObjectURL(f);
      return `<div class="file-card is-image" title="${escapeHtml(f.name)} · ${fmtSize(f.size)}">
        <img src="${objUrl}" alt="${escapeHtml(f.name)}" onload="URL.revokeObjectURL(this.src)" />
        <span class="file-card-remove" onclick="removeFile(${i})" title="Remove">×</span>
      </div>`;
    }

    return `<div class="file-card" title="${escapeHtml(f.name)} · ${fmtSize(f.size)}">
      <div class="file-card-icon">${icon}</div>
      <div class="file-card-info">
        <div class="file-card-name">${escapeHtml(shortName)}</div>
        <div class="file-card-meta"><span class="file-type-badge ${badge}">${ext.toUpperCase()}</span>${fmtSize(f.size)}</div>
      </div>
      <span class="file-card-remove" onclick="removeFile(${i})" title="Remove">×</span>
    </div>`;
  }).join('');

  // Storage indicator
  const totalBytes = pendingFiles.reduce((s, f) => s + f.size, 0);
  const pct = Math.round((pendingFiles.length / MAX_ATTACH_FILES) * 100);
  storageEl.textContent = `${pendingFiles.length}/${MAX_ATTACH_FILES} files · ${fmtSize(totalBytes)} · Shift+Enter for new line`;
  storageEl.className = 'storage-indicator visible' + (pct >= 80 ? ' warn' : '');
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderFileCards();
}

// Show persistent files from prior turns in this thread
function renderPersistentFiles(fileNames) {
  const bar = document.getElementById('persistentFilesBar');
  if (!bar) return;
  if (!fileNames || !fileNames.length) { bar.innerHTML = ''; return; }
  bar.innerHTML =
    `<span class="persistent-label">📎 Thread files</span>` +
    fileNames.slice(0, 8).map(n => {
      const ext = n.split('.').pop().toLowerCase();
      const icon = FILE_ICONS[ext] || '📎';
      const short = n.length > 20 ? n.slice(0,17) + '…' : n;
      return `<span class="persistent-file-tag">${icon} ${escapeHtml(short)}</span>`;
    }).join('') +
    (fileNames.length > 8 ? `<span class="persistent-file-tag">+${fileNames.length-8} more</span>` : '');
}

// Auto-resize textarea
function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// Drag-drop — cover entire chat panel (not just input area)
(function() {
  const panel = document.getElementById('chatMessages') || document.getElementById('chatInputArea');
  if (!panel) return;
  let dragCounter = 0;
  let overlay = null;

  panel.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    dragCounter++;
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'chat-drop-overlay';
      overlay.innerHTML = '📎 Drop files here<div class="drop-sub">PDF · Images · DOCX · TXT · CSV · XLSX</div>';
      panel.style.position = 'relative';
      panel.appendChild(overlay);
    }
  });
  panel.addEventListener('dragleave', e => {
    dragCounter--;
    if (dragCounter <= 0) {
      if (overlay) { overlay.remove(); overlay = null; }
      dragCounter = 0;
    }
  });
  panel.addEventListener('dragover', e => e.preventDefault());
  panel.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    if (overlay) { overlay.remove(); overlay = null; }
    if (e.dataTransfer.files.length) {
      handleChatFiles(e.dataTransfer.files);
      document.getElementById('chatInput').focus();
    }
  });
})();

async function sendChat() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query) return;
  lastQuery = query;

  const streaming = document.getElementById('streamToggle').checked;
  const threadInput = document.getElementById('threadId').value.trim();
  const threadId = threadInput || currentThreadId || null;

  // Add user message — show file cards above the text bubble
  let displayQuery = query;
  if (pendingFiles.length) {
    const fnames = pendingFiles.map(f => f.name).join(' · ');
    displayQuery = `📎 **${fnames}**\n\n${query}`;
  }
  addChatMsg('user', displayQuery);
  input.value = '';
  input.style.height = 'auto';

  // Disable send
  const btn = document.getElementById('chatSendBtn');
  btn.disabled = true;

  try {
    if (pendingFiles.length > 0) {
      btn.textContent = 'Uploading...';
      await sendChatWithFiles(query, threadId);
      pendingFiles = [];
      renderFileCards();
    } else if (streaming) {
      btn.textContent = 'Streaming...';
      await sendChatStream(query, threadId);
    } else {
      btn.textContent = 'Thinking...';
      await sendChatBatch(query, threadId);
    }
  } catch (e) {
    addChatMsg('error', `Request failed: ${e.message}`);
    addLog('error', `Chat error: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = 'Send';
  loadSessionList(); // refresh sidebar
}

async function sendChatWithFiles(query, threadId) {
  const formData = new FormData();
  formData.append('query', query);
  if (threadId) formData.append('globalThreadId', threadId);
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') formData.append('preferred_language', lang);
  // Integration JWT — backend ignores when not present
  const intToken = getIntegrationToken();
  if (intToken) formData.append('integration_token', intToken);
  pendingFiles.forEach(f => formData.append('files', f));

  addLog('info', `POST /pyapi/chat (files: ${pendingFiles.length}) \u2014 "${query.substring(0, 60)}..."`);

  var chatHeaders = {};
  var k = getApiKey();
  if (k) chatHeaders['X-API-Key'] = k;
  const r = await fetch(getBase() + '/pyapi/chat', {
    method: 'POST',
    headers: chatHeaders,
    body: formData,
  });

  if (!r.ok) {
    const err = await r.text();
    addChatMsg('error', `Error ${r.status}: ${err}`);
    return;
  }

  // Same SSE reader as sendChatStream
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let msgDiv = null;
  let contentEl = null;
  let statusEl = null;
  let accumulatedContent = '';
  let lastAgents = [];
  let lastTokens = 0;
  let startTime = Date.now();
  let fullResponse = '';
  let allSources = [];

  // Create AI message container
  msgDiv = document.createElement('div');
  msgDiv.className = 'msg ai';
  statusEl = document.createElement('div');
  statusEl.className = 'stream-status';
  statusEl.innerHTML = '<span class="typing-indicator"></span> Processing files...';
  msgDiv.appendChild(statusEl);
  contentEl = document.createElement('div');
  contentEl.className = 'msg-content';
  msgDiv.appendChild(contentEl);
  document.getElementById('chatMessages').appendChild(msgDiv);
  msgDiv.scrollIntoView({behavior: 'smooth', block: 'end'});

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const evt = JSON.parse(line.slice(6));

        if (evt.type === 'thread_id') {
          persistThread(evt.data, currentTurnCount);
          document.getElementById('threadId').value = currentThreadId;
        } else if (evt.type === 'file_processing') {
          const fileList = (evt.files || []).slice(0,4).join(' · ');
          statusEl.innerHTML = `<span class="typing-indicator"></span> ${escapeHtml(evt.message)}${fileList ? ' — ' + escapeHtml(fileList) : ''}`;
          // Update persistent files bar when files are confirmed processed
          if (evt.files && evt.files.length) renderPersistentFiles(evt.files);
        } else if (evt.type === 'status') {
          statusEl.innerHTML = `<span class="typing-indicator"></span> ${evt.message}`;
        } else if (evt.type === 'agents_planned') {
          lastAgents = evt.agents;
          statusEl.innerHTML = `<span class="typing-indicator"></span> Agents: ${evt.agents.join(', ')}`;
        } else if (evt.type === 'context') {
          if (evt.query_rewritten) {
            updateContextBar({rewritten: true, effectiveQuery: evt.effective_query, threadId: currentThreadId, turn: currentTurnCount});
          }
        } else if (evt.type === 'progress') {
          // Show progress in status area for chat endpoint
          const label = evt.substep ? '  \u21B3 ' + evt.message : evt.message;
          const found = evt.found != null ? ' (' + evt.found + ')' : '';
          statusEl.innerHTML = '<span class="typing-indicator"></span> ' + escapeHtml(label + found);
        } else if (evt.type === 'token') {
          statusEl.style.display = 'none';
          accumulatedContent += evt.content;
          contentEl.innerHTML = renderMarkdown(accumulatedContent);
          msgDiv.scrollIntoView({behavior: 'smooth', block: 'end'});
        } else if (evt.type === 'token_reset') {
          accumulatedContent = '';
          contentEl.innerHTML = '';
        } else if (evt.type === 'response') {
          fullResponse = evt.content;
          if (!accumulatedContent) {
            contentEl.innerHTML = renderMarkdown(evt.content);
          }
        } else if (evt.type === 'sources') {
          allSources = evt.data;
        } else if (evt.type === 'followup_suggestions' && evt.data && evt.data.length) {
          const sugDiv = document.createElement('div');
          sugDiv.innerHTML = renderFollowupSuggestions(evt.data);
          msgDiv.appendChild(sugDiv);
          scrollChat();
        } else if (evt.type === 'drafting_progress') {
          statusEl.innerHTML = `<span class="typing-indicator"></span> Drafting section ${evt.section}/${evt.total}: ${evt.title}`;
        } else if (evt.type === 'draft_incomplete') {
          const note = document.createElement('div');
          note.className = 'draft-incomplete-note';
          note.innerHTML = `<strong>\u26A0\uFE0F Draft incomplete:</strong> ${parseInt(evt.completed_sections)||0}/${parseInt(evt.total_sections)||0} sections completed. ${parseInt(evt.failed_sections)||0} section(s) failed. <button class="btn btn-secondary btn-sm" onclick="continueDraft(this)">Retry failed sections</button>`;
          msgDiv.appendChild(note);
        } else if (evt.type === 'done') {
          lastTokens = (evt.token_usage && evt.token_usage.total_tokens) || 0;
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          statusEl.remove();
          persistThread(evt.thread_id, evt.conversation_turn || currentTurnCount + 1);
          document.getElementById('chatMeta').textContent =
            `Thread: ${currentThreadId.substring(0,8)}... | Turn ${currentTurnCount} | Agents: ${(evt.agents_used||[]).join(', ')||'none'}`;
          addLog('success', `Files+Chat: ${(evt.agents_used||[]).join(',')} | ${lastTokens} tokens | ${elapsed}s`);
          if (allSources.length) {
            const citDiv = document.createElement('div');
            citDiv.innerHTML = renderCitations(allSources);
            msgDiv.appendChild(citDiv);
          }
        } else if (evt.type === 'error') {
          addChatMsg('error', evt.data);
        }
      } catch(e) { /* skip parse errors */ }
    }
  }
  loadSessionList(); // refresh sidebar
}

async function sendChatBatch(query, threadId) {
  const payload = { Promptquery: query };
  if (threadId) payload.globalThreadId = threadId;
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') payload.preferred_language = lang;
  // Integration JWT — backend ignores when not present
  const intToken = getIntegrationToken();
  if (intToken) payload.integration_token = intToken;

  addLog('info', `POST /pyapi/search — "${query.substring(0, 60)}..."`);
  const start = Date.now();

  const r = await fetch(getBase() + '/pyapi/search', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload),
  });

  const data = await r.json();
  const elapsed = ((Date.now() - start) / 1000).toFixed(1);

  if (!r.ok) {
    addChatMsg('error', `Error ${r.status}: ${data.detail || JSON.stringify(data)}`);
    addLog('error', `Search failed: ${r.status}`);
    return;
  }

  persistThread(data.globalThreadId, data.conversation_turn || currentTurnCount + 1);
  document.getElementById('threadId').value = currentThreadId;
  document.getElementById('chatMeta').textContent =
    `Thread: ${currentThreadId.substring(0, 8)}... | Turn ${currentTurnCount} | Agents: ${(data.agents_used||[]).join(', ') || 'none'}`;

  updateContextBar({
    turn: currentTurnCount,
    rewritten: data.query_rewritten,
    effectiveQuery: data.effective_query,
    threadId: currentThreadId,
  });

  const _tu = data.token_usage || {};
  const _totalTokens = _tu.total_tokens || 0;
  addChatMsg('ai', data.result, data.agents_used, _totalTokens, elapsed, data.source,
    data.conversation_turn || currentTurnCount, data.followup_suggestions);
  addLog('success', `Response: ${data.agents_used.join(',')} | ${_totalTokens} tokens | ${elapsed}s | ${(data.source || []).length} sources`);
  if (data.query_rewritten) {
    addLog('info', `Query rewritten: "${data.effective_query}"`);
  }
}

async function sendChatStream(query, threadId) {
  const payload = { Promptquery: query };
  if (threadId) payload.globalThreadId = threadId;
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') payload.preferred_language = lang;
  // Integration JWT enables Google Docs / Notion URL extraction. If the user
  // hasn't configured one, the backend just ignores the field — no harm.
  const intToken = getIntegrationToken();
  if (intToken) payload.integration_token = intToken;

  addLog('info', `POST /pyapi/search/stream (SSE) — "${query.substring(0, 60)}..."`);

  const r = await fetch(getBase() + '/pyapi/search/stream', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload),
  });

  if (!r.ok) {
    const err = await r.text();
    addChatMsg('error', `Stream error ${r.status}: ${err}`);
    return;
  }

  // Create streaming message element. Layout:
  //   1. streamActionable — always visible (integration auth/error cards)
  //   2. streamSummary    — clickable toggle row ("Show progress")
  //   3. streamDetails    — collapsed by default, holds agent badges + status + steps
  //   4. streamContent    — the AI's final streaming response (always visible)
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ai' + (getPreferredLang() === 'ur' ? ' lang-rtl' : '');
  msgDiv.innerHTML =
    '<div id="streamActionable" class="stream-actionable"></div>' +
    '<div id="streamSummary" class="stream-summary" onclick="toggleStreamDetails()">' +
      '<span class="caret"></span>' +
      '<span class="streaming-dot"></span>' +
      '<span id="streamSummaryText">Working...</span>' +
    '</div>' +
    '<div id="streamDetails" class="stream-details">' +
      '<div class="agents-badge" id="streamAgents"></div>' +
      '<div id="streamStatus" class="stream-status">Connecting...</div>' +
      '<div id="streamSteps" class="stream-steps"></div>' +
      '<div id="streamProgress" class="progress-panel" style="display:none;"></div>' +
    '</div>' +
    '<div id="streamContent" style="display:none;"></div>';
  document.getElementById('chatMessages').appendChild(msgDiv);
  scrollChat();

  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let content = '';
  let agents = [];
  let totalTokens = 0;
  let lastStepId = null;
  let sourcesData = [];
  let streamQueryRewritten = false;
  let streamEffectiveQuery = null;
  let streamHasSummary = false;
  let streamHistoryTurns = 0;
  let tokenBuffer = '';
  let renderTimer = null;
  let isTokenStreaming = false;
  let hasDraftIncomplete = false;
  let draftIncompleteInfo = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    // Safety cap: if buffer exceeds 1MB without newlines, discard oldest data
    if (buffer.length > 1048576) {
      const lastNewline = buffer.lastIndexOf('\n');
      buffer = lastNewline > 0 ? buffer.slice(lastNewline + 1) : buffer.slice(-65536);
    }
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const event = JSON.parse(line.slice(6));

        if (event.type === 'thread_id') {
          persistThread(event.data);
          document.getElementById('threadId').value = currentThreadId;

        } else if (event.type === 'context') {
          streamQueryRewritten = event.query_rewritten || false;
          streamEffectiveQuery = event.effective_query || null;
          streamHasSummary = event.has_summary || false;
          streamHistoryTurns = event.history_turns || 0;
          updateContextBar({
            rewritten: streamQueryRewritten,
            effectiveQuery: streamEffectiveQuery,
            hasSummary: streamHasSummary,
            threadId: currentThreadId,
          });
          if (streamQueryRewritten) {
            addLog('info', `Memory: Query rewritten → "${streamEffectiveQuery}"`);
          }
          if (streamHasSummary) {
            addLog('info', `Memory: Context loaded (${streamHistoryTurns} prev turns, has summary)`);
          }

        } else if (event.type === 'agents_planned') {
          // Show agent badges early (as soon as orchestrator plans)
          const agentsEl = document.getElementById('streamAgents');
          if (agentsEl && event.agents && event.agents.length) {
            agentsEl.innerHTML = event.agents.map(a =>
              '<span class="agent-tag">' + escapeHtml(a) + '</span>'
            ).join('');
          }
          // Always-visible 1-line summary (so users know what's happening
          // without expanding the details panel)
          if (event.agents && event.agents.length) {
            setStreamSummaryText('Working — ' + event.agents.join(', '));
          }
          addLog('info', 'Agents planned: ' + (event.agents || []).join(', '));

        } else if (event.type === 'integration_status') {
          // Backend detected a Google Docs / Notion URL in the query and
          // is now checking the user's connection status with FSD.
          const provider = (event.provider || 'integration');
          const urlsArr = Array.isArray(event.urls) ? event.urls : [];
          const urlsLabel = urlsArr.length === 1
            ? urlsArr[0]
            : (urlsArr.length + ' urls');
          renderIntegrationCard('checking', provider, {
            message: event.message || (provider + ' link detected'),
            urls: urlsArr,
            urlsLabel: urlsLabel,
          });
          addLog('info', `[integration] ${provider}: ${event.message || ''}`);

        } else if (event.type === 'integration_auth') {
          // User isn't connected to this provider — show a Connect button
          // that opens FSD's OAuth URL in a popup.
          const provider = (event.provider || 'integration');
          renderIntegrationCard('auth', provider, {
            message: event.message || ('Connect ' + provider + ' to access this content.'),
            authUrl: event.auth_url,
          });
          addLog('warning', `[integration] ${provider}: needs OAuth`);

        } else if (event.type === 'integration_content') {
          // FSD extracted document content; the agent now has it as context.
          const provider = (event.provider || 'integration');
          renderIntegrationCard('content', provider, {
            title: event.title || 'document',
            wordCount: event.word_count || 0,
            message: event.message || ('Extracted ' + (event.title || 'document')),
          });
          addLog('success',
            `[integration] ${provider}: extracted "${event.title}" (${event.word_count || 0} words)`);

        } else if (event.type === 'integration_error') {
          const provider = (event.provider || 'integration');
          renderIntegrationCard('error', provider, {
            message: event.message || 'Integration failed',
            error: event.error || '',
          });
          addLog('error', `[integration] ${provider}: ${event.message || 'failed'}`);

        } else if (event.type === 'status') {
          // Update current status text
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) {
            statusEl.innerHTML = '<span class="streaming-dot"></span> ' + escapeHtml(event.message);
          }

          // When synthesis starts, mark draft progress card as complete
          if (event.agent === 'orchestrator_synthesize') {
            const draftCard = document.getElementById('draftProgressCard');
            if (draftCard) {
              draftCard.classList.add('complete');
              const fillEl = document.getElementById('draftFill');
              if (fillEl) fillEl.style.width = '100%';
              const labelEl = document.getElementById('draftLabel');
              if (labelEl) labelEl.textContent = 'All sections complete — injecting citations...';
              draftCard.querySelectorAll('.draft-section-item.active').forEach(function(el) {
                el.classList.remove('active');
                el.classList.add('done');
                el.querySelector('.icon').textContent = '\u2713';
              });
            }
          }

          // Mark previous step as done, add new step
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) {
            if (lastStepId) {
              const prev = document.getElementById(lastStepId);
              if (prev) {
                prev.classList.remove('active');
                prev.classList.add('done');
                prev.querySelector('.check').textContent = '\u2713';
              }
            }
            const stepDiv = document.createElement('div');
            const stepId = 'step_' + event.agent;
            stepDiv.id = stepId;
            stepDiv.className = 'step active';
            stepDiv.innerHTML = '<span class="check">\u2022</span> ' + escapeHtml(event.message);
            stepsEl.appendChild(stepDiv);
            lastStepId = stepId;
          }
          scrollChat();
          addLog('info', `${event.agent}: ${event.message}`);

        } else if (event.type === 'progress') {
          // Granular agent progress — render in progress panel
          const progressPanel = document.getElementById('streamProgress');
          if (progressPanel) {
            progressPanel.style.display = 'flex';

            // Agent icon mapping
            const agentIcons = {
              guardrail: '\u{1F6E1}', memory: '\u{1F9E0}', orchestrator: '\u{1F4CB}',
              legislation: '\u{1F4DC}', judgment: '\u2696\uFE0F', sci_judgment: '\u{1F3DB}',
              newacts: '\u{1F4D6}', drafting: '\u270F\uFE0F', scenario: '\u{1F50D}',
              constitution: '\u{1F3DB}', maxim: '\u{1F4DA}', legal_concepts: '\u{1F4A1}',
              document: '\u{1F4C4}', non_legal: '\u{1F4AC}',
            };

            // Get or create agent column
            let agentCol = document.getElementById('progress_' + event.agent);
            if (!agentCol) {
              agentCol = document.createElement('div');
              agentCol.id = 'progress_' + event.agent;
              agentCol.className = 'progress-agent';
              const icon = agentIcons[event.agent] || '\u2022';
              const label = event.agent.charAt(0).toUpperCase() + event.agent.slice(1).replace('_', ' ');
              agentCol.innerHTML = '<div class="progress-agent-header"><span class="agent-icon">' + icon + '</span> ' + escapeHtml(label) + '</div>';
              progressPanel.appendChild(agentCol);
            }

            // Mark previous active item as done
            const prevActive = agentCol.querySelector('.progress-item.active');
            if (prevActive) {
              prevActive.classList.remove('active');
              prevActive.classList.add('done');
              prevActive.querySelector('.pi-icon').textContent = '\u2713';
            }

            // Add new progress item
            const item = document.createElement('div');
            item.className = 'progress-item active' + (event.substep ? ' substep' : '');
            let html = '<span class="pi-icon">\u25CF</span> ' + escapeHtml(event.message);
            if (event.found != null) {
              html += '<span class="pi-found">' + event.found + '</span>';
            }
            if (event.detail && !event.substep) {
              html += ' <span style="color:var(--text3,#888)">(' + escapeHtml(event.detail.substring(0, 60)) + ')</span>';
            }
            item.innerHTML = html;
            agentCol.appendChild(item);
            scrollChat();
          }

        } else if (event.type === 'drafting_progress') {
          // Phase C: drafting_progress fires twice per section — once on start
          // (status=in_progress) and again on finish (status=completed | failed).
          // Sections complete out of order because they generate in parallel,
          // so we track each section by its `section` number rather than
          // append-order.
          //
          // Backward compat: events with no `status` field are treated as
          // in_progress (the pre-Phase-C behavior).
          const statusEl = document.getElementById('streamStatus');
          const stepsEl = document.getElementById('streamSteps');
          let card = document.getElementById('draftProgressCard');
          if (!card) {
            if (statusEl) statusEl.style.display = 'none';
            card = document.createElement('div');
            card.id = 'draftProgressCard';
            card.className = 'draft-progress-card';
            card.innerHTML =
              '<div class="draft-progress-header">' +
                '<div class="spinner"></div>' +
                'Generating Legal Draft' +
                '<span class="draft-progress-counter" id="draftCounter"></span>' +
              '</div>' +
              '<div class="draft-progress-bar"><div class="fill" id="draftFill" style="width:0%"></div></div>' +
              '<div class="draft-progress-label" id="draftLabel"></div>' +
              '<div class="draft-section-list" id="draftSections"></div>';
            if (stepsEl && stepsEl.parentNode) {
              stepsEl.parentNode.insertBefore(card, stepsEl);
            }
          }

          const status = event.status || 'in_progress';
          const sectionNum = event.section;
          const total = event.total;
          const itemId = 'draftSection_' + sectionNum;
          const listEl = document.getElementById('draftSections');

          // Find or create the row for this section number
          let item = listEl ? document.getElementById(itemId) : null;
          if (!item && listEl) {
            item = document.createElement('div');
            item.id = itemId;
            listEl.appendChild(item);
          }
          if (item) {
            // Set state classes + icon based on status
            item.classList.remove('active', 'done', 'failed');
            let iconChar, color;
            if (status === 'completed') {
              item.classList.add('done');
              iconChar = '\u2713';   // check
              color = '';
            } else if (status === 'failed') {
              item.classList.add('failed');
              iconChar = '\u2717';   // cross
              color = 'var(--red, #ef4444)';
            } else {
              item.classList.add('active');
              iconChar = '\u25CF';   // dot
              color = '';
            }
            const charNote = (status === 'completed' && event.char_count)
              ? ' <small style="opacity:0.6">(' + event.char_count + ' chars)</small>'
              : '';
            const errNote = (status === 'failed' && event.error)
              ? ' <small style="opacity:0.7; color: var(--red, #ef4444)">' +
                escapeHtml(String(event.error).slice(0, 80)) + '</small>'
              : '';
            item.className = 'draft-section-item ' + (item.classList.contains('done') ? 'done'
                            : item.classList.contains('failed') ? 'failed' : 'active');
            item.style.color = color;
            item.innerHTML = '<span class="icon">' + iconChar + '</span> ' +
                             escapeHtml(event.title) + charNote + errNote;
            listEl.scrollTop = listEl.scrollHeight;
          }

          // Recompute progress bar from completed/failed count rather than
          // the latest event's section number (which is meaningless when
          // sections complete out of order).
          if (listEl) {
            const finished = listEl.querySelectorAll('.draft-section-item.done, .draft-section-item.failed').length;
            const pct = total ? Math.round((finished / total) * 100) : 0;
            const fillEl = document.getElementById('draftFill');
            if (fillEl) fillEl.style.width = pct + '%';
            const counterEl = document.getElementById('draftCounter');
            if (counterEl) counterEl.textContent = finished + ' / ' + total;
            // Surface drafting progress in the always-visible summary line
            setStreamSummaryText('Drafting — ' + finished + ' / ' + total + ' sections');
          }
          // Label shows the most recent event
          const labelEl = document.getElementById('draftLabel');
          if (labelEl) {
            const verb = status === 'completed' ? 'Completed: '
                       : status === 'failed' ? 'Failed: ' : 'Writing: ';
            labelEl.textContent = verb + event.title;
          }
          scrollChat();
          addLog('info',
            'Drafting section ' + sectionNum + '/' + total + ' [' + status + ']: ' + event.title);

        } else if (event.type === 'draft_incomplete') {
          // Some sections failed — mark failed items in draft progress card
          hasDraftIncomplete = true;
          draftIncompleteInfo = event;
          const listEl = document.getElementById('draftSections');
          if (listEl) {
            const items = listEl.querySelectorAll('.draft-section-item');
            // Mark the last active item as failed
            const lastActive = listEl.querySelector('.active');
            if (lastActive) {
              lastActive.classList.remove('active');
              lastActive.classList.add('failed');
              lastActive.querySelector('.icon').textContent = '\u2717';
              lastActive.style.color = 'var(--red, #ef4444)';
            }
          }
          addLog('warning', `Draft incomplete: ${event.failed_sections.length} section(s) failed`);

        } else if (event.type === 'token_reset') {
          // Server is retrying LLM call — clear partial tokens from failed attempt
          tokenBuffer = '';
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
          const resetContentEl = document.getElementById('streamContent');
          if (resetContentEl) resetContentEl.innerHTML = '';
          addLog('info', 'LLM retry — clearing partial output');

        } else if (event.type === 'token') {
          // Progressive token streaming
          if (!isTokenStreaming) {
            isTokenStreaming = true;
            // Update the always-visible 1-line summary
            setStreamSummaryText('Writing response...');
            const statusEl = document.getElementById('streamStatus');
            if (statusEl) statusEl.style.display = 'none';
            const stepsEl = document.getElementById('streamSteps');
            if (stepsEl) stepsEl.style.display = 'none';
            // Mark all progress items as done and collapse panel
            const progressPanel = document.getElementById('streamProgress');
            if (progressPanel) {
              progressPanel.querySelectorAll('.progress-item.active').forEach(function(el) {
                el.classList.remove('active');
                el.classList.add('done');
                el.querySelector('.pi-icon').textContent = '\u2713';
              });
              // Collapse panel with animation after brief delay
              setTimeout(function() {
                progressPanel.style.maxHeight = progressPanel.scrollHeight + 'px';
                progressPanel.style.transition = 'max-height 0.4s ease, opacity 0.4s ease';
                requestAnimationFrame(function() {
                  progressPanel.style.maxHeight = '0';
                  progressPanel.style.opacity = '0';
                  progressPanel.style.overflow = 'hidden';
                });
              }, 800);
            }
            // Hide draft progress card when final response starts streaming
            const draftCard = document.getElementById('draftProgressCard');
            if (draftCard) draftCard.style.display = 'none';
            const contentEl = document.getElementById('streamContent');
            if (contentEl) {
              contentEl.style.display = 'block';
              contentEl.classList.add('streaming-cursor');
            }
          }
          tokenBuffer += event.content;
          if (!renderTimer) {
            renderTimer = setTimeout(() => {
              const contentEl = document.getElementById('streamContent');
              if (contentEl) contentEl.innerHTML = renderMarkdown(tokenBuffer);
              scrollChat();
              renderTimer = null;
            }, 80);
          }

        } else if (event.type === 'response') {
          // Final render with complete post-processed text
          content = event.content;
          msgDiv.dataset.markdown = content || '';
          isTokenStreaming = false;
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) statusEl.style.display = 'none';
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) stepsEl.style.display = 'none';
          const draftCard = document.getElementById('draftProgressCard');
          if (draftCard) draftCard.style.display = 'none';
          const contentEl = document.getElementById('streamContent');
          if (contentEl) {
            contentEl.classList.remove('streaming-cursor');
            contentEl.style.display = 'block';
            contentEl.innerHTML = renderMarkdown(content);
          }
          scrollChat();

        } else if (event.type === 'sources') {
          sourcesData = event.data || [];
          addLog('info', `Received ${sourcesData.length} citation sources`);

        } else if (event.type === 'followup_suggestions') {
          var sugData = event.data || [];
          if (sugData.length > 0) {
            var sugDiv = document.createElement('div');
            sugDiv.innerHTML = renderFollowupSuggestions(sugData);
            msgDiv.appendChild(sugDiv);
            scrollChat();
          }
          addLog('info', `Received ${sugData.length} follow-up suggestions`);

        } else if (event.type === 'done') {
          agents = event.agents_used || [];
          totalTokens = (event.token_usage && event.token_usage.total_tokens) || 0;
          const convTurn = event.conversation_turn || 0;
          if (convTurn > 0) persistThread(currentThreadId, convTurn);
          // Update context bar with final turn count
          updateContextBar({
            turn: currentTurnCount,
            rewritten: event.query_rewritten || streamQueryRewritten,
            effectiveQuery: event.effective_query || streamEffectiveQuery,
            hasSummary: streamHasSummary,
            threadId: currentThreadId,
          });
          // Show agents badge
          const agentsEl = document.getElementById('streamAgents');
          if (agentsEl && agents.length) {
            agentsEl.innerHTML = agents.map(a =>
              `<span class="agent-tag">${escapeHtml(a)}</span>`
            ).join('');
          }
          // Hide the summary toggle now that streaming is done. The
          // collapsed details panel is still inspectable via DevTools, but
          // we don't pester the user with a "Show progress" arrow forever.
          const summaryEl = document.getElementById('streamSummary');
          if (summaryEl) summaryEl.style.display = 'none';
          addLog('success', `Stream complete: ${agents.join(', ')} | ${totalTokens} tokens | Turn ${currentTurnCount}`);

        } else if (event.type === 'error') {
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) statusEl.style.display = 'none';
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) stepsEl.style.display = 'none';
          content = `**Error:** ${event.data}`;
          const contentEl = document.getElementById('streamContent');
          if (contentEl) {
            contentEl.style.display = 'block';
            contentEl.innerHTML = renderMarkdown(content);
          }
          addLog('error', `Stream error: ${event.data}`);
        }
      } catch (e) { /* ignore parse errors for partial lines */ }
    }
  }

  // Add citations
  if (sourcesData.length > 0) {
    const citDiv = document.createElement('div');
    citDiv.innerHTML = renderCitations(sourcesData);
    msgDiv.appendChild(citDiv);
  }

  // Add tokens footer + response actions
  if (totalTokens > 0) {
    const tokensDiv = document.createElement('div');
    tokensDiv.className = 'tokens';
    tokensDiv.textContent = `${totalTokens} tokens | ${sourcesData.length} sources`;
    msgDiv.appendChild(tokensDiv);
  }
  if (content) {
    msgDiv.dataset.turn = currentTurnCount || '0';
    const actionsDiv = document.createElement('div');
    actionsDiv.innerHTML = renderResponseActions(currentTurnCount);
    msgDiv.appendChild(actionsDiv);
  }

  // Show Continue button for incomplete drafts
  if (hasDraftIncomplete && draftIncompleteInfo) {
    const contDiv = document.createElement('div');
    contDiv.className = 'continue-draft-section';
    const failedNames = (draftIncompleteInfo.failed_sections || [])
      .map(s => s.title).join(', ');
    contDiv.innerHTML =
      '<div class="continue-draft-info">' +
        '<strong>Draft incomplete</strong> — ' +
        draftIncompleteInfo.failed_sections.length + ' of ' +
        draftIncompleteInfo.total_sections + ' section(s) could not be generated: ' +
        escapeHtml(failedNames) +
      '</div>' +
      '<button class="continue-draft-btn" onclick="continueDraft(this)">' +
        '<span class="spinner-sm"></span>' +
        'Continue Draft' +
      '</button>';
    msgDiv.appendChild(contDiv);
  }

  // Handle no response
  if (!content) {
    const statusEl = document.getElementById('streamStatus');
    if (statusEl) statusEl.style.display = 'none';
    const stepsEl = document.getElementById('streamSteps');
    if (stepsEl) stepsEl.style.display = 'none';
    const contentEl = document.getElementById('streamContent');
    if (contentEl) {
      contentEl.style.display = 'block';
      contentEl.innerHTML = '<em>No response received</em>';
    }
  }

  // Remove temp IDs to avoid conflicts with next stream
  ['streamAgents', 'streamStatus', 'streamSteps', 'streamProgress', 'streamContent'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.removeAttribute('id');
  });

  document.getElementById('chatMeta').textContent =
    `Thread: ${(currentThreadId || '').substring(0, 8)}... | Turn ${currentTurnCount} | Agents: ${agents.join(', ') || 'none'} | Streamed`;
}

function addChatMsg(type, text, agents, tokens, elapsed, sources, turnNumber, followupSuggestions) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'ai' && getPreferredLang() === 'ur') div.classList.add('lang-rtl');

  if (type === 'ai') {
    div.dataset.markdown = text || '';
    if (turnNumber) div.dataset.turn = turnNumber;
    let html = '';
    if (agents && agents.length) {
      html += '<div class="agents-badge">' +
        agents.map(a => `<span class="agent-tag">${a}</span>`).join('') +
        '</div>';
    }
    html += renderMarkdown(text);
    if (sources && sources.length) {
      html += renderCitations(sources);
    }
    if (followupSuggestions && followupSuggestions.length) {
      html += renderFollowupSuggestions(followupSuggestions);
    }
    if (tokens || elapsed) {
      html += `<div class="tokens">${tokens ? tokens + ' tokens' : ''}${elapsed ? ' | ' + elapsed + 's' : ''}</div>`;
    }
    html += renderResponseActions(turnNumber);
    div.innerHTML = html;
  } else if (type === 'error') {
    div.innerHTML = escapeHtml(text) + '<br><button class="retry-btn" onclick="retryLastQuery(this)">Retry</button>';
  } else {
    div.textContent = text;
  }

  const container = document.getElementById('chatMessages');
  container.appendChild(div);
  // Cap DOM messages to prevent memory bloat in long sessions
  const MAX_DOM_MESSAGES = 200;
  while (container.children.length > MAX_DOM_MESSAGES) {
    container.removeChild(container.firstChild);
  }
  scrollChat();
}

function scrollChat() {
  const el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

// ============================================================
// Simple Markdown Renderer

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function toggleStreamDetails() {
  const summary = document.getElementById('streamSummary');
  if (summary) summary.classList.toggle('open');
}
// Update the always-visible 1-line summary text (shown next to the caret).
function setStreamSummaryText(text) {

}

// Render or update the integration status card (Google Docs / Notion).
// Phases: 'checking' -> ('auth' OR 'content') OR 'error'.
// Auth + error cards live in the always-visible 'streamActionable' slot
// because they require user action / signal failure. Checking + content
// cards collapse into the details panel.
function renderIntegrationCard(phase, provider, opts) {
  opts = opts || {};
  // Where does this card go? Auth/error are interactive => always visible.
  // Status/content are informational => inside the collapsible details.
  const containerId = (phase === 'auth' || phase === 'error')
    ? 'streamActionable'
    : 'streamDetails';
  const container = document.getElementById(containerId)
                  || document.getElementById('streamSteps');
  const cardId = 'integrationCard_' + provider + '_' + phase;
  // Remove any previous card for this provider so we don't accumulate
  // (e.g., a 'checking' card stops being shown once content arrives).
  const prevPhases = ['checking', 'auth', 'content', 'error'];
  prevPhases.forEach(p => {
    if (p === phase) return;
    const stale = document.getElementById('integrationCard_' + provider + '_' + p);
    if (stale && stale.parentNode) stale.parentNode.removeChild(stale);
  });
  let card = document.getElementById(cardId);
  if (!card) {
    card = document.createElement('div');
    card.id = cardId;
    card.className = 'integration-card';
    card.style.cssText =
      'padding: 10px 12px; margin: 6px 0; border-left: 3px solid var(--accent, #6366f1);' +
      'background: var(--surface-2, #f3f4f6); border-radius: 4px; font-size: 13px;';
    if (container) container.appendChild(card);
  }
  const providerLabel = provider.charAt(0).toUpperCase() + provider.slice(1);
  let body = '<strong>' + escapeHtml(providerLabel) + '</strong> &middot; ';
  if (phase === 'checking') {
    body += '<span style="opacity:0.8">' + escapeHtml(opts.message || 'Checking connection...') + '</span>';
    if (opts.urls && opts.urls.length) {
      const links = opts.urls.map(u =>
        '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener" style="word-break:break-all">' +
        escapeHtml(u.length > 80 ? u.slice(0, 77) + '...' : u) + '</a>'
      ).join('<br>');
      body += '<div style="margin-top:6px; font-size:11px; opacity:0.7">' + links + '</div>';
    }
    card.style.borderLeftColor = 'var(--accent, #6366f1)';
  } else if (phase === 'auth') {
    body += '<span>' + escapeHtml(opts.message || 'Please connect.') + '</span>';
    if (opts.authUrl) {
      body += '<div style="margin-top:8px"><button class="btn btn-primary btn-sm" ' +
              'onclick="openIntegrationOAuth(\'' + escapeHtml(opts.authUrl) + '\', \'' +
              escapeHtml(provider) + '\')">Connect ' + escapeHtml(providerLabel) + '</button></div>';
    }
    card.style.borderLeftColor = 'var(--orange, #f59e0b)';
  } else if (phase === 'content') {
    body += '<span>\u2713 Extracted <strong>' + escapeHtml(opts.title || 'document') + '</strong>';
    if (opts.wordCount) body += ' <small style="opacity:0.7">(' + opts.wordCount + ' words)</small>';
    body += '</span>';
    card.style.borderLeftColor = 'var(--green, #22c55e)';
  } else if (phase === 'error') {
    body += '<span style="color: var(--red, #ef4444)">' + escapeHtml(opts.message || 'Error') + '</span>';
    if (opts.error) body += '<div style="margin-top:4px; font-size:11px; opacity:0.7">' + escapeHtml(opts.error) + '</div>';
    card.style.borderLeftColor = 'var(--red, #ef4444)';
  }
  card.innerHTML = body;
}

// Opens the OAuth URL in a popup. After the popup closes the user sends
// their original query again; the backend re-checks status and extracts.
function openIntegrationOAuth(authUrl, provider) {
  const popup = window.open(authUrl, 'oauth_' + provider, 'width=500,height=650');
  if (!popup) {
    alert('Popup blocked. Please allow popups for this site and try again.');
    return;
  }
  addLog('info', '[integration] OAuth popup opened for ' + provider);
  // Optional: poll for popup close, then prompt user to re-send query.
  const watcher = setInterval(function() {
    if (popup.closed) {
      clearInterval(watcher);
      addLog('info', '[integration] OAuth popup closed for ' + provider +
        ' — re-send your prompt to continue.');
    }
  }, 1000);
}

function renderMarkdown(text) {
  if (!text) return '';
  // Escape HTML entities FIRST to prevent XSS
  let html = escapeHtml(text);

  // Protect code blocks — extract, replace with placeholders, restore at end
  const codeBlocks = [];
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    codeBlocks.push('<pre><code' + (lang ? ' class="lang-' + lang + '"' : '') + '>' + code + '</code></pre>');
    return '\x00CB' + (codeBlocks.length - 1) + '\x00';
  });

  // Tables — parse markdown tables into HTML tables
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)+)/gm, function(match, headerRow, sepRow, bodyRows) {
    var headers = headerRow.split('|').filter(function(c) { return c.trim(); });
    // Parse alignment from separator row
    var aligns = sepRow.split('|').filter(function(c) { return c.trim(); }).map(function(c) {
      c = c.trim();
      if (c.startsWith(':') && c.endsWith(':')) return 'center';
      if (c.endsWith(':')) return 'right';
      return 'left';
    });
    var rows = bodyRows.trim().split('\n');
    var table = '<table><thead><tr>';
    headers.forEach(function(h, i) {
      var a = aligns[i] || 'left';
      table += '<th style="text-align:' + a + '">' + h.trim() + '</th>';
    });
    table += '</tr></thead><tbody>';
    rows.forEach(function(row) {
      var cells = row.split('|').filter(function(c) { return c.trim(); });
      table += '<tr>';
      cells.forEach(function(c, i) {
        var a = aligns[i] || 'left';
        table += '<td style="text-align:' + a + '">' + c.trim() + '</td>';
      });
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });

  html = html
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic (but not inside URLs or already-processed tags)
    .replace(/(?<!\w)\*(.+?)\*(?!\w)/g, '<em>$1</em>')
    // Links — [text](url)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    // Headers
    .replace(/^##### (.+)$/gm, '<h5>$1</h5>')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    // Horizontal rule
    .replace(/^---+$/gm, '<hr>')
    // Blockquotes
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Lists — process line by line for proper nesting and ordered/unordered
  html = html.replace(/(^[\t ]*(?:[-*]|\d+\.) .+(?:\n[\t ]*(?:[-*]|\d+\.) .+)*)/gm, function(block) {
    var lines = block.split('\n');
    var result = '';
    var stack = []; // track open list tags

    lines.forEach(function(line) {
      var m = line.match(/^([\t ]*)([-*]|\d+\.)\s+(.+)$/);
      if (!m) return;
      var indent = m[1].length;
      var marker = m[2];
      var content = m[3];
      var tag = /^\d+\./.test(marker) ? 'ol' : 'ul';
      var level = Math.floor(indent / 2);

      while (stack.length > level + 1) {
        result += '</' + stack.pop() + '>';
      }
      if (stack.length <= level) {
        result += '<' + tag + '>';
        stack.push(tag);
      }
      result += '<li>' + content + '</li>';
    });

    while (stack.length) {
      result += '</' + stack.pop() + '>';
    }
    return result;
  });

  // Paragraphs and line breaks
  html = html
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');

  // Merge consecutive blockquotes
  html = html.replace(/<\/blockquote>(\s*<br>)*\s*<blockquote>/g, '<br>');

  // Restore code blocks
  html = html.replace(/\x00CB(\d+)\x00/g, function(_, i) { return codeBlocks[i]; });

  return '<p>' + html + '</p>';
}

// ============================================================
// Citation Rendering
// ============================================================
const SOURCE_ICONS = {
  judgment:       { icon: '\u2696\uFE0F', label: 'Court Judgment' },
  sci_judgment:   { icon: '\u2696\uFE0F', label: 'Supreme Court Judgment' },
  legislation:    { icon: '\uD83D\uDCDC', label: 'Legislation' },
  newacts:        { icon: '\uD83D\uDCCB', label: 'Act / Code' },
  drafting:       { icon: '\u270F\uFE0F', label: 'Legal Template' },
  scenario:       { icon: '\uD83C\uDF10', label: 'Web Source' },
  constitution:   { icon: '\uD83C\uDFDB\uFE0F', label: 'Constitutional Provision' },
  maxim:          { icon: '\uD83D\uDCD6', label: 'Legal Maxim' },
  document:       { icon: '\uD83D\uDCC4', label: 'Uploaded Document' },
  legal_concepts: { icon: '\uD83D\uDCA1', label: 'Legal Concept' },
};

function renderCitations(sources) {
  if (!sources || !Array.isArray(sources) || sources.length === 0) return '';

  const cardsHtml = sources.map(function(s) {
    const type = s.source_type || 'legal_concepts';
    const iconInfo = SOURCE_ICONS[type] || SOURCE_ICONS.legal_concepts;

    var metaHtml = '';
    if (s.court_name) metaHtml += '<span>\uD83C\uDFDB ' + escapeHtml(s.court_name) + '</span>';
    if (s.year) metaHtml += '<span>\uD83D\uDCC5 ' + s.year + '</span>';
    if (s.case_no) metaHtml += '<span># ' + escapeHtml(s.case_no) + '</span>';
    if (s.judgment_date) metaHtml += '<span>\uD83D\uDCC5 ' + escapeHtml(s.judgment_date) + '</span>';
    if (s.bench) metaHtml += '<span>\uD83D\uDC64 ' + escapeHtml((s.bench || '').substring(0, 80)) + '</span>';
    if (s.judgment_by) metaHtml += '<span>Judge: ' + escapeHtml(s.judgment_by) + '</span>';
    if (s.section_number) metaHtml += '<span>\u00A7 Section ' + escapeHtml(s.section_number) + '</span>';
    if (s.act_name) metaHtml += '<span>\uD83D\uDCDC ' + escapeHtml(s.act_name) + '</span>';
    if (s.template_type) metaHtml += '<span>Template: ' + escapeHtml(s.template_type) + '</span>';
    if (s.agent_name) metaHtml += '<span class="citation-agent-tag">' + escapeHtml(s.agent_name) + '</span>';

    var linkHtml = '';
    if (s.doc_link && s.doc_link !== 'N/A') {
      linkHtml = '<a class="citation-link" href="' + escapeHtml(s.doc_link) + '" target="_blank" rel="noopener">\uD83D\uDCC4 View PDF</a>';
    } else if (s.web_url) {
      linkHtml = '<a class="citation-link" href="' + escapeHtml(s.web_url) + '" target="_blank" rel="noopener">\uD83C\uDF10 ' + escapeHtml(s.web_title || 'View Source') + '</a>';
    }
    if (s.pdf_links && s.pdf_links.length > 0) {
      linkHtml = s.pdf_links.map(function(pl) {
        return '<a class="citation-link" href="' + escapeHtml(pl.url) + '" target="_blank" rel="noopener">\uD83D\uDCC4 ' + escapeHtml(pl.label || 'PDF') + '</a>';
      }).join(' ');
    }

    var excerptHtml = '';
    if (s.content && s.content.length && s.content[0]) {
      var fullText = Array.isArray(s.content) ? s.content.join('\n\n') : String(s.content);
      var excerpt = fullText.substring(0, 150);
      var cardUid = 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      excerptHtml = '<div class="citation-excerpt">' + escapeHtml(excerpt) + '...</div>';
      if (fullText.length > 160) {
        excerptHtml += '<button class="citation-expand-btn" onclick="toggleCardContent(\'' + cardUid + '\')">' +
          '<span id="' + cardUid + '_label">Show more</span></button>' +
          '<div class="citation-full-content" id="' + cardUid + '_full">' + escapeHtml(fullText) + '</div>';
      }
    }

    var titleHtml = escapeHtml(s.title || 'Source');
    if (s.doc_link && s.doc_link !== 'N/A') {
      titleHtml = '<a href="' + escapeHtml(s.doc_link) + '" target="_blank">' + titleHtml + '</a>';
    } else if (s.web_url) {
      titleHtml = '<a href="' + escapeHtml(s.web_url) + '" target="_blank">' + titleHtml + '</a>';
    }

    return '<div class="citation-card">' +
      '<div class="citation-icon ' + type + '">' + iconInfo.icon + '</div>' +
      '<div class="citation-body">' +
        '<div class="citation-title">' + titleHtml + '</div>' +
        (metaHtml ? '<div class="citation-meta">' + metaHtml + '</div>' : '') +
        excerptHtml +
        linkHtml +
      '</div></div>';
  }).join('');

  var uid = 'cite_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  return '<div class="citations-section">' +
    '<div class="citations-header" onclick="toggleCitations(\'' + uid + '\')">' +
      '<span>Sources & Citations <span class="citations-count">' + sources.length + '</span></span>' +
      '<span class="chevron" id="' + uid + '_chevron">\u25BC</span>' +
    '</div>' +
    '<div class="citations-list" id="' + uid + '">' + cardsHtml + '</div>' +
  '</div>';
}

function toggleCitations(id) {
  var list = document.getElementById(id);
  var chevron = document.getElementById(id + '_chevron');
  if (list.classList.contains('expanded')) {
    list.classList.remove('expanded');
    chevron.classList.remove('open');
  } else {
    list.classList.add('expanded');
    chevron.classList.add('open');
  }
}

function toggleCardContent(cardUid) {
  var fullEl = document.getElementById(cardUid + '_full');
  var labelEl = document.getElementById(cardUid + '_label');
  if (fullEl.classList.contains('visible')) {
    fullEl.classList.remove('visible');
    labelEl.textContent = 'Show more';
  } else {
    fullEl.classList.add('visible');
    labelEl.textContent = 'Show less';
  }
}

        '<button class="export-dropdown-item" onclick="generateMemo(this,\'docx\')" data-turn="' + tn + '"><span class="ext">.docx</span> Research Memo</button>' +
        '<button class="export-dropdown-item" onclick="generateMemo(this,\'pdf\')" data-turn="' + tn + '"><span class="ext">.pdf</span> Research Memo</button>' +
        '<div style="border-top:1px solid var(--border);margin:4px 0"></div>' +

        '<button class="export-dropdown-item" onclick="generateTOA(this,\'pdf\')" data-turn="' + tn + '"><span class="ext">.pdf</span> Table of Authorities</button>' +

    '<div style="margin-left:auto;display:flex;gap:6px">' +

function copyResponse(btn) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  navigator.clipboard.writeText(markdown).then(function() {
    btn.classList.add('copied');
    var orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  });
}

function exportResponse(btn) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  var blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lawttorney_response_' + new Date().toISOString().slice(0, 10) + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  // Close dropdown
  var menu = btn.closest('.export-dropdown-menu');
  if (menu) menu.classList.remove('show');
}

function toggleExportMenu(btn) {
  var menu = btn.nextElementSibling;
  // Close all other open menus
  document.querySelectorAll('.export-dropdown-menu.show').forEach(function(m) {
    if (m !== menu) m.classList.remove('show');
  });
  menu.classList.toggle('show');
}

// Close export dropdown when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.export-dropdown')) {
    document.querySelectorAll('.export-dropdown-menu.show').forEach(function(m) {
      m.classList.remove('show');
    });
  }
});

async function exportAs(btn, format) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  var turn = parseInt(btn.dataset.turn) || 0;

  if (!markdown.trim()) {
    addLog('warn', 'No content to export');
    return;
  }

  // Show loading state
  var origText = btn.innerHTML;
  btn.classList.add('loading');
  btn.innerHTML = '<span class="ext">...</span> Generating...';

  try {
    var payload = { format: format };
    // Prefer thread_id + turn for server-side export (preserves formatting)
    if (currentThreadId && turn > 0) {
      payload.thread_id = currentThreadId;
      payload.turn_number = turn;
    } else {
      payload.raw_text = markdown;
      payload.title = 'Lawttorney Export';
    }

    var resp = await fetch(getBase() + '/pyapi/export', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      var err = await resp.json().catch(function() { return { message: 'Export failed' }; });
      throw new Error(err.message || 'Export failed');
    }

    // Download the file
    var blob = await resp.blob();
    var disposition = resp.headers.get('Content-Disposition') || '';
    var filename = 'lawttorney_export.' + format;
    var match = disposition.match(/filename="?([^"]+)"?/);
    if (match) filename = match[1];

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    addLog('info', 'Exported as ' + format.toUpperCase() + ': ' + filename);
  } catch (e) {
    addLog('error', 'Export failed: ' + e.message);
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = origText;
    // Close dropdown
    var menu = btn.closest('.export-dropdown-menu');
    if (menu) menu.classList.remove('show');
  }
}

async function generateMemo(btn, format) {

  if (!markdown.trim()) {

    return;
  }

  var origText = btn.innerHTML;
  btn.classList.add('loading');
  btn.innerHTML = '<span class="ext">...</span> Generating memo...';

  try {
    var payload = {
      format: format,
      response_text: markdown,
      query: '',
      sources: [],
      agents_used: [],
    };

    // Use thread_id + turn if available
    if (currentThreadId && turn > 0) {
      payload.thread_id = currentThreadId;
      payload.turn_number = turn;

    // Try to get the user query from the previous message

      });
    }

    var resp = await fetch(getBase() + '/pyapi/memo', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      var err = await resp.json().catch(function() { return { message: 'Memo generation failed' }; });
      throw new Error(err.message || 'Memo generation failed');
    }

    var blob = await resp.blob();
    var disposition = resp.headers.get('Content-Disposition') || '';
    var filename = 'research_memo.' + format;
    var match = disposition.match(/filename="?([^"]+)"?/);
    if (match) filename = match[1];

    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    addLog('info', 'Research memo generated: ' + filename);
  } catch (e) {
    addLog('error', 'Memo generation failed: ' + e.message);
  } finally {
    btn.classList.remove('loading');
    btn.innerHTML = origText;
    var menu = btn.closest('.export-dropdown-menu');
    if (menu) menu.classList.remove('show');
  }
}

async function runComplianceCheck(btn) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  var turn = parseInt(btn.dataset.turn) || 0;

  if (!markdown.trim()) {
    addLog('warn', 'No content for compliance check');
    return;
  }

  var origText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '\uD83D\uDD0D Checking...';

  try {
    var payload = { format: 'md' };
    if (currentThreadId && turn > 0) {
      payload.thread_id = currentThreadId;
      payload.turn_number = turn;
    } else {
      payload.text = markdown;
    }

    var resp = await fetch(getBase() + '/pyapi/compliance-check', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      var err = await resp.json().catch(function() { return { message: 'Failed' }; });
      throw new Error(err.message || 'Compliance check failed');
    }

    var report = await resp.text();

    // Show the compliance report as a new message in the chat
    var reportHtml = renderMarkdown(report);
    var reportDiv = document.createElement('div');
    reportDiv.className = 'msg ai compliance-report';
    reportDiv.dataset.markdown = report;
    // Store original draft markdown on the report div for fix-draft
    reportDiv.dataset.originalDraft = markdown;
    reportDiv.dataset.complianceReport = report;

    reportDiv.innerHTML = '<div class="compliance-badge">\uD83D\uDD0D Compliance Report</div>' +
      '<div class="ai-content">' + reportHtml + '</div>' +
      '<div class="response-actions">' +
        '<button class="response-action-btn" onclick="copyResponse(this)">\uD83D\uDCCB Copy</button>' +
        '<button class="response-action-btn" onclick="exportComplianceReport(this,\'docx\')">\uD83D\uDCE5 Export .docx</button>' +
        '<button class="response-action-btn fix-draft-btn" onclick="fixDraft(this)">\uD83D\uDD27 Fix Draft</button>' +
      '</div>';

    // Insert after the current message
    msgDiv.parentNode.insertBefore(reportDiv, msgDiv.nextSibling);

    // Scroll to the report
    reportDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Persist to chat history so it survives refresh
    if (currentThreadId) {
      fetch(getBase() + '/pyapi/save-turn', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({
          thread_id: currentThreadId,
          user_query: '[COMPLIANCE_CHECK]' + markdown,
          ai_response: report,
        }),
      }).catch(function(e) { addLog('warn', 'Failed to save compliance report: ' + e.message); });
    }

    addLog('info', 'Compliance check complete (' + report.length + ' chars)');
    btn.innerHTML = '\u2705 Checked';
  } catch (e) {
    addLog('error', 'Compliance check failed: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = origText;
  }
}
