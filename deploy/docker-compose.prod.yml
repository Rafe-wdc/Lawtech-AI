version: "3.8"

# Lawtech-AI — Production Deploy Stack
#
# Runs the full production stack:
#   - postgres: PostgreSQL for LangGraph conversation checkpointing
#   - app:      FastAPI app via gunicorn (2 uvicorn workers)
#   - caddy:    HTTPS reverse proxy (ports 80/443) with automatic Let's Encrypt
#
# SETUP:
#   1. Copy .env.example to .env and fill in all required values
#   2. Set DOMAIN in .env (e.g. DOMAIN=api.yourdomain.com)
#   3. Open ports 80 and 443 on your firewall
#   4. Run: docker compose -f deploy/docker-compose.prod.yml up -d
#
# Note: The observability stack (Prometheus + Grafana) is in monitoring/docker-compose.yml
# Run both if you want metrics: docker compose -f monitoring/docker-compose.yml up -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: lawtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lawtech
      POSTGRES_USER: lawtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawtech -d lawtech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lawtech-net

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lawtech-app
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Override POSTGRES_URL to use Docker service name
      - POSTGRES_URL=postgresql://lawtech:${POSTGRES_PASSWORD:-changeme}@postgres:5432/lawtech
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../chroma_store:/app/chroma_store
      - ../models:/app/models
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/pyapi/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lawtech-net

  caddy:
    image: caddy:2-alpine
    container_name: lawtech-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # TLS certificates (persisted)
      - caddy_config:/config
      - ../logs:/app/logs
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - app
    networks:
      - lawtech-net

networks:
  lawtech-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
