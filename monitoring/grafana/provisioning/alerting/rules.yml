apiVersion: 1

groups:
  - orgId: 1
    name: lawtech-production
    folder: Lawtech Alerts
    interval: 1m   # evaluate every minute

    rules:

      # ── 1. High 5xx Error Rate ───────────────────────────────────────────────
      # Fires when >10% of requests return 5xx for 2 consecutive minutes.
      # Indicates a crash, broken dependency, or unhandled exception.
      - uid: alert-error-rate
        title: High 5xx Error Rate
        condition: C
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate is {{ $values.B.Value | printf \"%.1f\" }}%"
          description: >
            More than 10% of requests are returning 5xx errors over the last 5 minutes.
            Check logs: journalctl -u lawtech-v2 -n 100
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: sum(rate(lawtech_requests_total{status_code=~"5.."}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: >
                sum(rate(lawtech_requests_total{status_code=~"5.."}[5m])) /
                sum(rate(lawtech_requests_total[5m])) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last

      # ── 2. App Completely Down ───────────────────────────────────────────────
      # Fires when Prometheus gets no request metrics for 3 minutes.
      # Means the app stopped scraping (crashed / OOM-killed / port not listening).
      - uid: alert-app-down
        title: App Not Responding
        condition: C
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Lawtech-AI is not responding"
          description: >
            No request metrics received for 3+ minutes.
            Check: systemctl status lawtech-v2 && journalctl -u lawtech-v2 -n 50
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: sum(rate(lawtech_requests_total[1m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [0.001]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last

      # ── 3. High Memory Usage ─────────────────────────────────────────────────
      # Fires when the process RSS exceeds 2 GB for 5 minutes.
      # Uses process_resident_memory_bytes from prometheus_client (no node_exporter needed).
      # Raise the threshold if your server has >8 GB RAM and queries are large.
      - uid: alert-memory-high
        title: High Memory Usage
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage is {{ $values.A.Value | humanize1024 }}B RSS"
          description: >
            Application process memory (RSS) exceeds 2 GB for 5+ minutes.
            Consider graceful reload: kill -HUP $(systemctl show -p MainPID --value lawtech-v2)
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: process_resident_memory_bytes{job="lawtech"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [2147483648]   # 2 GB in bytes
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last

      # ── 4. Elasticsearch Unreachable ─────────────────────────────────────────
      # Fires when the ES fallback rate spikes — all agent calls are falling back
      # to web search, which means ES is down or not responding.
      - uid: alert-es-down
        title: Elasticsearch High Fallback Rate
        condition: C
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "ES fallback rate is {{ $values.B.Value | printf \"%.0f\" }} fallbacks/min"
          description: >
            More than 5 web-search fallbacks per minute for 3+ minutes.
            Likely means Elasticsearch is unreachable.
            Check: curl http://139.84.219.174:9200/_cluster/health
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: sum(rate(lawtech_fallback_total[1m])) * 60
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last

      # ── 5. High P95 Latency ──────────────────────────────────────────────────
      # Fires when 95th-percentile response time exceeds 30s for 3 minutes.
      - uid: alert-latency-high
        title: High P95 Latency
        condition: C
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency is {{ $values.B.Value | printf \"%.1f\" }}s"
          description: >
            95th-percentile response time exceeds 30 seconds for 3+ minutes.
            Check agent concurrency limits and LLM provider status.
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: lawtech-prometheus
            model:
              expr: >
                histogram_quantile(0.95,
                  sum by(le) (rate(lawtech_request_latency_seconds_bucket[5m]))
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
