# Lawtech-AI — logrotate configuration
#
# Install on the prod server:
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/lawtech-ai
#   sudo chmod 644 /etc/logrotate.d/lawtech-ai
#   sudo logrotate --debug /etc/logrotate.d/lawtech-ai   # dry-run
#
# Rotates:
#   - logs/api.log    (uvicorn stdout/stderr from start.sh — grows unbounded)
#   - logs/embed.log  (embedding service stdout)
#
# NOT rotated here (already handled in code):
#   - logs/agent.log  — Python RotatingFileHandler in core/logger.py
#                       (10 MB × 5 backups)
#
# Update the path below to match your deploy directory.

/root/Lawtech-AI/logs/api.log
/root/Lawtech-AI/logs/embed.log {
    daily
    rotate 14
    size 100M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
    create 0644 root root
}
