name: Prod — toggle intent extractor (manual)

# Single-purpose rollout helper for the Phase 0-2 intent layer on the
# AWS production box (api.lawttorney.com). Sister workflow to
# dev-enable-intent-extractor.yml. workflow_dispatch ONLY — no auto-trigger.
#
# Idempotent: replaces an existing INTENT_EXTRACTOR_V2 line in .env,
# appends if missing. Restarts via `sudo systemctl restart lawttorney-v2`
# matching the deploy-prod.yml pattern, then waits for 3 consecutive
# healthy /pyapi/health responses on port 5001.
#
# Uses the prod SSH secrets:
#   SSH_PRIVATE_KEY_PROD, SERVER_HOST_PROD, SERVER_USER_PROD (ubuntu).
# Prod APP_DIR is /root/Lawtech-AI (root-owned; needs sudo).
#
# Delete along with dev-enable-intent-extractor.yml once Phase 4 makes
# the flag unconditional.

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'INTENT_EXTRACTOR_V2 value to set on prod (true | false)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  flip:
    name: Flip flag on prod
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Set flag + systemctl restart + verify health
        env:
          FLAG_VALUE: ${{ inputs.value }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
            FLAG_VALUE="$FLAG_VALUE" 'bash -s' << 'ENDSSH'
          set -e
          APP_DIR=/root/Lawtech-AI
          ENV_FILE="$APP_DIR/.env"

          echo "=== Current INTENT_EXTRACTOR_V2 state ==="
          sudo grep -E '^INTENT_EXTRACTOR_V2=' "$ENV_FILE" || echo "(not set)"

          # Idempotent: replace existing line if present, append otherwise.
          if sudo grep -qE '^INTENT_EXTRACTOR_V2=' "$ENV_FILE"; then
            sudo sed -i.bak -E "s/^INTENT_EXTRACTOR_V2=.*/INTENT_EXTRACTOR_V2=${FLAG_VALUE}/" "$ENV_FILE"
            echo "Replaced existing line"
          else
            echo "INTENT_EXTRACTOR_V2=${FLAG_VALUE}" | sudo tee -a "$ENV_FILE" >/dev/null
            echo "Appended new line"
          fi

          echo "=== After change ==="
          sudo grep -E '^INTENT_EXTRACTOR_V2=' "$ENV_FILE"

          echo "=== Restart v2 via systemd (matches deploy-prod.yml) ==="
          sudo systemctl restart lawttorney-v2

          echo "=== Wait for v2 health (3 consecutive 200s, max 120s) ==="
          CONSECUTIVE_OK=0
          NEEDED=3
          HEALTHY=0
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                     --max-time 5 http://localhost:5001/pyapi/health 2>/dev/null) || STATUS="000"
            if [ "$STATUS" = "200" ]; then
              CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
              echo "  Healthy (200), $CONSECUTIVE_OK/$NEEDED consecutive..."
              if [ "$CONSECUTIVE_OK" -ge "$NEEDED" ]; then
                echo "  Stable. Settling 10s for any remaining worker startup..."
                sleep 10
                HEALTHY=1
                break
              fi
            else
              CONSECUTIVE_OK=0
              echo "  Waiting... attempt $i/24 (HTTP $STATUS)"
            fi
          done

          if [ "$HEALTHY" = "1" ]; then
            echo "FLAG FLIP OK"
          else
            echo "ERROR: no $NEEDED consecutive 200s within 120s. journalctl tail:"
            sudo journalctl -u lawttorney-v2 -n 50 --no-pager
            exit 1
          fi
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
