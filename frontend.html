<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lawttorney AI v2 — Test Console</title>
<style>
  :root {
    --bg: #fdfcf8;
    --surface: #f7f3e9;
    --surface2: #ede8d8;
    --border: #ddd3b5;
    --text: #2c2720;
    --text2: #7d7060;
    --accent: #c8920c;
    --accent2: #a87608;
    --green: #16a34a;
    --red: #dc2626;
    --orange: #ea580c;
    --blue: #2563eb;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* --- Layout --- */
  .app { display: flex; height: 100vh; }
  .sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sidebar-header .version {
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }
  .health-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    margin-right: 6px;
    transition: background 0.3s;
  }
  .health-dot.ok { background: var(--green); }

  .nav { flex: 1; padding: 12px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #1c1917; font-weight: 600; }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  /* --- Session History --- */
  .session-divider {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    padding: 12px 14px 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  .session-item {
    padding: 8px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 12px;
    color: var(--text2);
    transition: all 0.15s;
    margin-bottom: 2px;
    border: 1px solid transparent;
  }
  .session-item:hover { background: var(--surface2); color: var(--text); }
  .session-item.active { background: rgba(200,146,12,0.15); border-color: var(--accent); color: var(--text); }
  .session-item .session-preview {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    font-size: 13px;
    color: var(--text);
  }
  .session-item .session-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
    font-size: 11px;
    color: var(--text2);
  }
  .session-empty {
    padding: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--text2);
    font-style: italic;
  }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* --- Tabs Content --- */
  .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* --- Chat Panel --- */
  .chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
  }
  .chat-header h2 { font-size: 15px; font-weight: 600; }
  .chat-header .meta { font-size: 12px; color: var(--text2); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #1c1917;
    border-bottom-right-radius: 4px;
    max-width: 75%;
  }
  .msg.ai {
    align-self: flex-start;
    background: var(--surface2);
    border-bottom-left-radius: 4px;
    max-width: 95%;
  }
  .msg.ai .agents-badge {
    display: inline-flex;
    gap: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .agent-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(200,146,12,0.2);
    color: var(--accent2);
    font-weight: 600;
  }
  .msg.ai .tokens {
    font-size: 11px;
    color: var(--text2);
    margin-top: 8px;
    text-align: right;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-style: italic;
    padding: 6px;
  }
  .msg.error {
    align-self: center;
    background: rgba(220,38,38,0.08);
    color: var(--red);
    border: 1px solid rgba(220,38,38,0.2);
  }
  .msg pre {
    background: #f3f4f6;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
  }
  .msg ul, .msg ol { padding-left: 20px; margin: 6px 0; }
  .msg h2, .msg h3, .msg h4 { margin: 10px 0 4px; }
  .msg h2 { font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .msg h3 { font-size: 14px; }
  .msg p { margin: 4px 0; }
  .msg hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .msg table {
    border-collapse: collapse;
    width: 100%;
    margin: 10px 0;
    font-size: 13px;
    overflow-x: auto;
    display: block;
  }
  .msg table th, .msg table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .msg table th {
    background: rgba(200,146,12,0.12);
    font-weight: 600;
    white-space: nowrap;
  }
  .msg table tr:nth-child(even) { background: rgba(0,0,0,0.02); }
  .msg blockquote {
    border-left: 3px solid var(--accent);
    padding: 8px 16px;
    margin: 8px 0;
    background: rgba(200,146,12,0.06);
    border-radius: 0 6px 6px 0;
  }

  .chat-input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  /* ── File attachment UI (ChatGPT-style) ── */
  .chat-input-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.15s;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .chat-input-box:focus-within { border-color: var(--accent); }

  /* File preview cards (above textarea, inside the box) */
  .file-preview-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 12px 0;
  }
  .file-preview-bar:empty { display: none; }

  .file-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    max-width: 200px;
    min-width: 120px;
    cursor: default;
    transition: border-color 0.15s;
  }
  .file-card:hover { border-color: var(--accent); }
  .file-card.is-image {
    padding: 0;
    overflow: hidden;
    width: 72px;
    min-width: 72px;
    height: 72px;
    border-radius: 8px;
    background: #000;
  }
  .file-card.is-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 7px;
    display: block;
  }
  .file-card-icon {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
  }
  .file-card-info {
    flex: 1;
    min-width: 0;
  }
  .file-card-name {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .file-card-meta {
    font-size: 10px;
    color: var(--text2);
    margin-top: 1px;
  }
  .file-type-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 1px 4px;
    border-radius: 3px;
    margin-right: 3px;
  }
  .badge-pdf   { background: #fee2e2; color: #dc2626; }
  .badge-img   { background: #dbeafe; color: #2563eb; }
  .badge-docx  { background: #dbeafe; color: #1d4ed8; }
  .badge-xlsx  { background: #dcfce7; color: #16a34a; }
  .badge-csv   { background: #d1fae5; color: #059669; }
  .badge-txt   { background: var(--surface2); color: var(--text2); }
  .badge-md    { background: #f3f4f6; color: #374151; }
  .file-card-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    font-size: 11px;
    line-height: 17px;
    text-align: center;
    cursor: pointer;
    color: var(--text2);
    display: none;
    z-index: 2;
  }
  .file-card:hover .file-card-remove { display: block; }
  .file-card-remove:hover { background: var(--red); color: #fff; border-color: var(--red); }

  /* Persistent files bar (files from prior turns, grayed) */
  .persistent-files-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text2);
  }
  .persistent-files-bar:empty { display: none; }
  .persistent-file-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 11px;
    color: var(--text2);
    opacity: 0.7;
  }
  .persistent-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    opacity: 0.6;
    margin-right: 2px;
  }

  /* Bottom row: attach + textarea + send — all inside the box */
  .input-inner {
    display: flex;
    align-items: flex-end;
    gap: 0;
  }
  .btn-attach {
    background: none;
    border: none;
    color: var(--text2);
    padding: 10px 10px 10px 12px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: color 0.15s;
    flex-shrink: 0;
    align-self: flex-end;
    margin-bottom: 2px;
  }
  .btn-attach:hover { color: var(--accent); }
  .btn-attach.has-files { color: var(--accent); }
  .input-row, .input-inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-row textarea, .input-inner textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    padding: 12px 12px 12px 4px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 160px;
    transition: border-color 0.15s;
  }
  .input-row textarea:focus, .input-inner textarea:focus { outline: none; }
  .input-row textarea::placeholder, .input-inner textarea::placeholder { color: var(--text2); }

  /* Storage indicator */
  .storage-indicator {
    font-size: 10px;
    color: var(--text2);
    padding: 3px 12px 6px;
    display: none;
  }
  .storage-indicator.visible { display: block; }
  .storage-indicator.warn { color: var(--orange); }

  /* Language selector */
  .lang-select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
    max-width: 130px;
  }
  .lang-select:focus { outline: 1px solid var(--accent); }

  /* RTL support for Urdu responses */
  .msg.ai.lang-rtl { direction: rtl; text-align: right; }
  .msg.ai.lang-rtl .msg-meta { direction: ltr; }

  /* Drag-drop overlay — full chat panel */
  .chat-drop-overlay {
    position: absolute;
    inset: 0;
    background: rgba(200,146,12,0.07);
    border: 2px dashed var(--accent);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 18px;
    color: var(--accent);
    font-weight: 600;
    z-index: 20;
    pointer-events: none;
    backdrop-filter: blur(2px);
  }
  .chat-drop-overlay .drop-sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.7;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--accent);
    color: #1c1917;
  }
  .btn-primary:hover { background: var(--accent2); color: #fff; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-danger {
    background: rgba(220,38,38,0.1);
    color: var(--red);
    border: 1px solid rgba(220,38,38,0.2);
  }
  .btn-danger:hover { background: rgba(220,38,38,0.2); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }

  .toggle-row {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 10px;
  }
  .toggle-row label {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
  }
  .toggle-row select, .toggle-row input[type="text"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }

  /* --- PDF Panel --- */
  .pdf-panel {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-card h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 30px;
    text-align: center;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 14px;
  }
  .file-drop:hover, .file-drop.dragover {
    border-color: var(--accent);
    background: rgba(200,146,12,0.05);
  }
  .file-drop input { display: none; }
  .file-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 13px;
  }
  .file-item .size { color: var(--text2); font-size: 11px; }
  .file-item .remove {
    color: var(--red);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }

  .progress-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0;
  }
  .progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.3s;
  }

  .result-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 12px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .field-group {
    margin-bottom: 14px;
  }
  .field-group label {
    display: block;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field-group input, .field-group textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  .field-group input:focus, .field-group textarea:focus {
    border-color: var(--accent);
  }

  .status-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
  }
  .status-pill.ok { background: rgba(22,163,74,0.12); color: var(--green); }
  .status-pill.error { background: rgba(220,38,38,0.12); color: var(--red); }
  .status-pill.pending { background: rgba(200,146,12,0.15); color: var(--accent2); }
  .status-pill.processing { background: rgba(37,99,235,0.12); color: var(--blue); }

  /* --- Streaming indicator --- */
  .streaming-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1s infinite;
    margin-right: 4px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .streaming-cursor::after {
    content: '\258C';
    color: var(--accent);
    animation: blink-cursor 0.7s step-end infinite;
    font-weight: bold;
  }
  @keyframes blink-cursor {
    50% { opacity: 0; }
  }
  .stream-status {
    font-size: 12px;
    color: var(--text2);
    padding: 4px 0;
    transition: opacity 0.2s;
  }
  .stream-steps {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 6px;
  }
  .stream-steps .step {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }
  .stream-steps .step.active { color: var(--blue); }
  .stream-steps .step.done { color: var(--green); }
  .stream-steps .step .check { font-size: 11px; }

  /* --- Draft Progress Card (multi-step pipeline) --- */
  .draft-progress-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin: 8px 0;
    animation: fadeSlideIn 0.3s ease;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .draft-progress-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 12px;
  }
  .draft-progress-header .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .draft-progress-counter {
    margin-left: auto;
    font-size: 11px;
    color: var(--text2);
    font-weight: 400;
  }
  .draft-progress-bar {
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .draft-progress-bar .fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.5s ease;
  }
  .draft-progress-label {
    font-size: 12px;
    color: var(--accent2);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .draft-section-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 150px;
    overflow-y: auto;
  }
  .draft-section-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text2);
    transition: color 0.2s;
  }
  .draft-section-item.done { color: var(--green); }
  .draft-section-item.active { color: var(--accent2); font-weight: 500; }
  .draft-section-item .icon { width: 14px; text-align: center; font-size: 10px; }
  .draft-progress-card.complete .spinner {
    animation: none;
    border-color: var(--green);
    border-top-color: var(--green);
  }
  .draft-progress-card.complete .draft-progress-header { color: var(--green); }

  /* --- Log Panel --- */
  .log-panel {
    padding: 16px 24px;
    overflow-y: auto;
    flex: 1;
    font-family: 'Consolas', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.8;
    background: var(--bg);
  }
  .log-entry { color: var(--text2); }
  .log-entry .time { color: var(--text2); opacity: 0.6; margin-right: 8px; }
  .log-entry.info { color: var(--blue); }
  .log-entry.success { color: var(--green); }
  .log-entry.error { color: var(--red); }
  .log-entry.warn { color: var(--orange); }

  /* --- Scrollbar --- */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  /* --- Markdown in messages --- */
  .msg.ai strong { color: var(--accent2); }
  .msg.ai a { color: var(--blue); text-decoration: underline; }
  .msg.ai code {
    background: rgba(0,0,0,0.07);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .msg.ai table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
  }
  .msg.ai th, .msg.ai td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  .msg.ai th { background: var(--surface); }

  /* --- Citation Cards --- */
  .citations-section { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
  .citations-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; padding: 8px 0; font-size: 13px; font-weight: 600;
    color: var(--text2); user-select: none;
  }
  .citations-header:hover { color: var(--text); }
  .citations-header .chevron { transition: transform 0.2s; font-size: 12px; }
  .citations-header .chevron.open { transform: rotate(180deg); }
  .citations-count {
    background: var(--accent); color: #1c1917; font-size: 10px;
    padding: 1px 7px; border-radius: 10px; margin-left: 8px;
  }
  .citations-list {
    display: flex; flex-direction: column; gap: 8px; margin-top: 8px;
    max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out;
  }
  .citations-list.expanded { max-height: 2000px; }
  .citation-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 12px; display: flex; gap: 10px;
    align-items: flex-start; transition: border-color 0.15s;
  }
  .citation-card:hover { border-color: var(--accent); }
  .citation-icon {
    width: 32px; height: 32px; border-radius: 6px; display: flex;
    align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .citation-icon.judgment    { background: rgba(220,38,38,0.12); }
  .citation-icon.sci_judgment { background: rgba(200,146,12,0.15); }
  .citation-icon.legislation  { background: rgba(37,99,235,0.12); }
  .citation-icon.newacts      { background: rgba(22,163,74,0.12); }
  .citation-icon.drafting     { background: rgba(124,58,237,0.12); }
  .citation-icon.scenario     { background: rgba(219,39,119,0.12); }
  .citation-icon.constitution { background: rgba(200,146,12,0.15); }
  .citation-icon.maxim        { background: rgba(37,99,235,0.12); }
  .citation-icon.document     { background: rgba(22,163,74,0.12); }
  .citation-icon.legal_concepts { background: rgba(200,146,12,0.15); }
  .citation-body { flex: 1; min-width: 0; }
  .citation-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .citation-title a { color: var(--blue); text-decoration: none; }
  .citation-title a:hover { text-decoration: underline; }
  .citation-meta {
    color: var(--text2); font-size: 11px; display: flex;
    flex-wrap: wrap; gap: 4px 12px; margin-bottom: 4px;
  }
  .citation-meta span { display: flex; align-items: center; gap: 3px; }
  .citation-excerpt {
    color: var(--text2); font-size: 11px; line-height: 1.5;
    margin-top: 4px; max-height: 40px; overflow: hidden; text-overflow: ellipsis;
  }
  .citation-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--blue); font-size: 11px; text-decoration: none; margin-top: 4px;
  }
  .citation-link:hover { text-decoration: underline; }
  .citation-agent-tag {
    font-size: 9px; padding: 1px 6px; border-radius: 8px;
    background: rgba(200,146,12,0.15); color: var(--accent2); font-weight: 600;
  }
  .citation-expand-btn {
    color: var(--blue); font-size: 11px; cursor: pointer; margin-top: 4px;
    background: none; border: none; padding: 0; font-family: inherit;
  }
  .citation-expand-btn:hover { text-decoration: underline; }
  .citation-full-content {
    display: none; margin-top: 8px; padding: 10px; background: var(--surface2);
    border-radius: 6px; font-size: 12px; line-height: 1.6; color: var(--text);
    max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .citation-full-content.visible { display: block; }

  /* --- Response Actions (Copy, Export, Feedback) --- */
  .response-actions {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .response-action-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); font-size: 11px; padding: 4px 10px; cursor: pointer;
    display: flex; align-items: center; gap: 4px; transition: all 0.15s; font-family: inherit;
  }
  .response-action-btn:hover { background: var(--surface); color: var(--text); border-color: var(--accent); }
  .response-action-btn.copied { color: var(--green); border-color: var(--green); }
  .feedback-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; padding: 4px 8px; cursor: pointer; transition: all 0.15s; line-height: 1;
  }
  .feedback-btn:hover { background: var(--surface); }
  .feedback-btn.active-up { background: rgba(22,163,74,0.12); border-color: var(--green); }
  .feedback-btn.active-down { background: rgba(220,38,38,0.12); border-color: var(--red); }
  .feedback-comment {
    display: none; margin-top: 6px; gap: 6px; align-items: center;
  }
  .feedback-comment.visible { display: flex; }
  .feedback-comment input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 6px 10px; font-size: 12px;
    font-family: inherit; outline: none;
  }

  /* --- Follow-up Suggestions --- */
  .followup-section { margin-top: 12px; }
  .followup-title { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 8px; }
  .followup-chip {
    display: inline-block; padding: 6px 14px; border-radius: 16px;
    background: rgba(200,146,12,0.1); border: 1px solid rgba(245,158,11,0.25);
    color: var(--accent2); font-size: 12px; cursor: pointer; transition: all 0.15s;
    margin: 3px 4px 3px 0;
  }
  .followup-chip:hover { background: rgba(200,146,12,0.2); border-color: var(--accent); }

  /* --- Continue Draft Button --- */
  .continue-draft-section {
    margin-top: 14px; padding: 12px 16px;
    background: rgba(245,158,11,0.06); border: 1px solid rgba(245,158,11,0.25);
    border-radius: 10px;
  }
  .continue-draft-info {
    font-size: 12px; color: var(--text2); margin-bottom: 10px; line-height: 1.5;
  }
  .continue-draft-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #000; font-weight: 600; font-size: 13px; font-family: inherit;
    border: none; border-radius: 8px; padding: 10px 22px;
    cursor: pointer; transition: all 0.2s; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .continue-draft-btn:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(245,158,11,0.3); }
  .continue-draft-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .continue-draft-btn .spinner-sm {
    width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #000; border-radius: 50%;
    animation: spin 0.6s linear infinite; display: none;
  }
  .continue-draft-btn.loading .spinner-sm { display: inline-block; }
  .continue-draft-btn.loading { pointer-events: none; opacity: 0.7; }

  /* --- Context Bar (below chat header) --- */
  .context-bar {
    padding: 8px 24px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: var(--text2);
    min-height: 36px;
    flex-wrap: wrap;
  }
  .context-bar:empty { display: none; }
  .context-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
  }
  .context-pill.turn {
    background: rgba(37,99,235,0.1);
    color: var(--blue);
  }
  .context-pill.rewrite {
    background: rgba(200,146,12,0.15);
    color: var(--accent2);
  }
  .context-pill.summary {
    background: rgba(22,163,74,0.1);
    color: var(--green);
  }
  .context-pill.thread {
    background: rgba(200,146,12,0.15);
    color: var(--accent2);
  }
  .rewrite-detail {
    font-size: 11px;
    color: var(--text2);
    font-style: italic;
    max-width: 500px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Lawttorney AI</h1>
      <div class="version">
        <span class="health-dot" id="healthDot"></span>
        <span id="healthText">Connecting...</span>
      </div>
    </div>
    <div class="nav">
      <div class="nav-item active" data-tab="chat" onclick="switchTab('chat')">
        <span class="icon">&#9998;</span> Legal Q&A
      </div>

      <div class="nav-item" data-tab="logs" onclick="switchTab('logs')">
        <span class="icon">&#128203;</span> Request Logs
      </div>
    </div>
    <div class="session-divider">Recent Sessions</div>
    <div class="session-list" id="sessionList">
      <div class="session-empty">Loading sessions...</div>
    </div>
    <div style="padding: 12px; border-top: 1px solid var(--border);">
      <div class="field-group" style="margin-bottom: 8px;">
        <label>API Base URL</label>
        <input type="text" id="apiBase" value="http://localhost:5000" />
      </div>
      <div class="field-group" style="margin-bottom: 8px;">
        <label>API Key</label>
        <input type="password" id="apiKey" value="" placeholder="Enter API key" />
      </div>
      <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="checkHealth()">
        Test Connection
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">

    <!-- Tab 1: Legal Q&A Chat -->
    <div class="tab-content active" id="tab-chat">
      <div class="chat-header">
        <div>
          <h2>Legal Q&A</h2>
          <div class="meta" id="chatMeta">New conversation</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="newChat()">New Chat</button>
        </div>
      </div>
      <div class="context-bar" id="contextBar"></div>
      <div class="chat-messages" id="chatMessages">
        <div class="msg system">Ask any legal question — the multi-agent system will classify, route, and respond.</div>
      </div>
      <div class="chat-input-area" style="position:relative;" id="chatInputArea">
        <input type="file" id="chatFileInput" multiple
               accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,.txt,.md,.csv,.xlsx" style="display:none"
               onchange="handleChatFiles(this.files)" />

        <!-- Persistent files from prior turns -->
        <div class="persistent-files-bar" id="persistentFilesBar"></div>

        <!-- ChatGPT-style input box with file cards inside -->
        <div class="chat-input-box" id="chatInputBox">
          <!-- File preview cards (shown when files are queued) -->
          <div class="file-preview-bar" id="filePreviewBar"></div>

          <!-- Attach + textarea + send in one row -->
          <div class="input-inner">
            <button class="btn-attach" id="attachBtn"
                    onclick="document.getElementById('chatFileInput').click()"
                    title="Attach files — PDF, images, DOCX, TXT, CSV, XLSX&#10;Up to 30 files · 1 GB each">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <textarea id="chatInput" placeholder="Ask a legal question..." rows="1"
                      onkeydown="handleChatKey(event)"
                      oninput="autoResizeTextarea(this)"
                      onpaste="handlePaste(event)"></textarea>
            <button class="btn btn-primary" id="chatSendBtn" onclick="sendChat()"
                    style="margin: 6px 8px 6px 0; padding: 8px 18px; align-self: flex-end;">Send</button>
          </div>
          <div class="storage-indicator" id="storageIndicator"></div>

        <div class="toggle-row" style="margin-top:8px;">
          <label><input type="checkbox" id="streamToggle" /> Streaming (SSE)</label>
          <label>Thread:
            <input type="text" id="threadId" placeholder="auto" style="width: 180px;" />
          </label>
          <label title="Response language (overrides auto-detection)">
            <select id="langSelect" class="lang-select">
              <option value="auto">🌐 Auto-detect</option>
              <option value="en">English</option>
              <option value="hi">हिन्दी</option>
              <option value="bn">বাংলা</option>
              <option value="te">తెలుగు</option>
              <option value="mr">मराठी</option>
              <option value="ta">தமிழ்</option>
              <option value="kn">ಕನ್ನಡ</option>
              <option value="ml">മലയാളം</option>
              <option value="gu">ગુજરાતી</option>
              <option value="pa">ਪੰਜਾਬੀ</option>
              <option value="ur">اردو</option>
            </select>
          </label>
        </div>
      </div>
    </div>

    <!-- Tab 2: Request Logs -->
    <div class="tab-content" id="tab-logs">
      <div class="chat-header">
        <div><h2>Request Logs</h2></div>
        <button class="btn btn-secondary btn-sm" onclick="clearLogs()">Clear</button>
      </div>
      <div class="log-panel" id="logPanel"></div>
    </div>

  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
let currentThreadId = sessionStorage.getItem('lawttorney_thread_id') || null;
let currentTurnCount = parseInt(sessionStorage.getItem('lawttorney_turn_count') || '0');

function getBase() { return document.getElementById('apiBase').value.replace(/\/+$/, ''); }
function getApiKey() { return (document.getElementById('apiKey') || {}).value || ''; }
function authHeaders(extra) {
  var h = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
  var k = getApiKey();
  if (k) h['X-API-Key'] = k;
  return h;
}

// API key — persisted in localStorage across sessions
function initApiKey() {
  var el = document.getElementById('apiKey');
  if (!el) return;
  var saved = localStorage.getItem('lawtech_api_key');
  if (saved) el.value = saved;
  el.addEventListener('change', function() { localStorage.setItem('lawtech_api_key', el.value); });
}

// Language preference — persisted in localStorage across sessions
function getPreferredLang() {
  const sel = document.getElementById('langSelect');
  return sel ? sel.value : 'auto';
}
function initLangSelect() {
  const sel = document.getElementById('langSelect');
  if (!sel) return;
  const saved = localStorage.getItem('lawtech_lang');
  if (saved) sel.value = saved;
  sel.addEventListener('change', () => localStorage.setItem('lawtech_lang', sel.value));
}

function persistThread(threadId, turnCount) {
  currentThreadId = threadId;
  if (turnCount !== undefined) currentTurnCount = turnCount;
  if (threadId) {
    sessionStorage.setItem('lawttorney_thread_id', threadId);
    sessionStorage.setItem('lawttorney_turn_count', String(currentTurnCount));
  } else {
    sessionStorage.removeItem('lawttorney_thread_id');
    sessionStorage.removeItem('lawttorney_turn_count');
    currentTurnCount = 0;
  }
}

function updateContextBar(opts) {
  // opts: { turn, rewritten, effectiveQuery, hasSummary, historyTurns, threadId }
  const bar = document.getElementById('contextBar');
  if (!bar) return;
  const pills = [];

  const tid = opts.threadId || currentThreadId;
  if (tid) {
    pills.push('<span class="context-pill thread">Thread: ' + escapeHtml(tid.substring(0, 8)) + '...</span>');
  }

  const turn = opts.turn || currentTurnCount;
  if (turn > 0) {
    pills.push('<span class="context-pill turn">Turn ' + turn + '</span>');
  }

  if (opts.hasSummary) {
    pills.push('<span class="context-pill summary">Context loaded</span>');
  }

  if (opts.rewritten && opts.effectiveQuery) {
    pills.push('<span class="context-pill rewrite">Query rewritten</span>');
    pills.push('<span class="rewrite-detail">"' + escapeHtml(opts.effectiveQuery.substring(0, 80)) + (opts.effectiveQuery.length > 80 ? '...' : '') + '"</span>');
  }

  bar.innerHTML = pills.join('');
}

// ============================================================
// Tab Switching
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
}

// ============================================================
// Health Check
// ============================================================
async function checkHealth() {
  const dot = document.getElementById('healthDot');
  const txt = document.getElementById('healthText');
  try {
    const r = await fetch(getBase() + '/pyapi/health', { headers: authHeaders() });
    const d = await r.json();
    dot.classList.add('ok');
    txt.textContent = `v${d.version} — Connected`;
    addLog('success', `Health OK: ${JSON.stringify(d)}`);
  } catch (e) {
    dot.classList.remove('ok');
    txt.textContent = 'Disconnected';
    addLog('error', `Health check failed: ${e.message}`);
  }
}

// ============================================================
// Session History
// ============================================================
async function loadSessionList() {
  const container = document.getElementById('sessionList');
  try {
    const r = await fetch(getBase() + '/pyapi/threads?limit=30', { headers: authHeaders() });
    if (!r.ok) throw new Error('Failed to fetch');
    const d = await r.json();
    const threads = d.threads || [];

    if (threads.length === 0) {
      container.innerHTML = '<div class="session-empty">No previous sessions</div>';
      return;
    }

    container.innerHTML = threads.map(t => {
      const preview = t.preview || 'Empty conversation';
      const isActive = currentThreadId === t.thread_id;
      const ago = timeAgo(t.updated_at);
      const safeId = escapeHtml(t.thread_id);
      const safeTurns = parseInt(t.total_turns, 10) || 0;
      return `<div class="session-item${isActive ? ' active' : ''}"
                   data-thread-id="${safeId}"
                   onclick="restoreSession('${safeId}', ${safeTurns})"
                   title="${escapeHtml(preview)}">
        <div class="session-preview">${escapeHtml(preview)}</div>
        <div class="session-meta">
          <span>${safeTurns} turn${safeTurns !== 1 ? 's' : ''}</span>
          <span>${escapeHtml(ago)}</span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    container.innerHTML = '<div class="session-empty">Could not load sessions</div>';
  }
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr.replace(' ', 'T') + 'Z'); // SQLite dates are UTC, space→T for strict ISO 8601
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString();
  } catch { return ''; }
}

async function restoreSession(threadId, totalTurns) {
  // Update state
  persistThread(threadId, totalTurns);
  document.getElementById('threadId').value = threadId;

  // Switch to chat tab
  switchTab('chat');

  // Show loading
  const chatMessages = document.getElementById('chatMessages');
  chatMessages.innerHTML = '<div class="msg system">Loading conversation...</div>';
  document.getElementById('chatMeta').textContent =
    `Thread: ${threadId.substring(0, 8)}... | ${totalTurns} turns | Loading...`;

  // Highlight active session in sidebar
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.threadId === threadId);
  });

  try {
    const r = await fetch(getBase() + `/pyapi/threads/${threadId}/messages`, { headers: authHeaders() });
    if (!r.ok) throw new Error('Failed to load messages');
    const d = await r.json();
    const messages = d.messages || [];

    chatMessages.innerHTML = '';

    if (messages.length === 0) {
      addChatMsg('system', 'No messages found in this conversation.');
      return;
    }

    // Render each turn
    messages.forEach(msg => {
      addChatMsg('user', msg.user_query);
      addChatMsg('ai', msg.ai_response);
    });

    document.getElementById('chatMeta').textContent =
      `Thread: ${threadId.substring(0, 8)}... | Turn ${totalTurns} | Restored`;
    updateContextBar({ turn: totalTurns, threadId: threadId });

    // Scroll to bottom
    chatMessages.scrollTop = chatMessages.scrollHeight;

  } catch (e) {
    chatMessages.innerHTML = '';
    addChatMsg('system', `Restored thread ${threadId.substring(0, 8)}... (turn ${totalTurns}). Previous messages could not be loaded, but you can continue the conversation.`);
    document.getElementById('chatMeta').textContent =
      `Thread: ${threadId.substring(0, 8)}... | Turn ${totalTurns}`;
    updateContextBar({ turn: totalTurns, threadId: threadId });
  }
}

// ============================================================
// Legal Q&A Chat
// ============================================================
function newChat() {
  persistThread(null);
  document.getElementById('threadId').value = '';
  document.getElementById('chatMessages').innerHTML =
    '<div class="msg system">New conversation started.</div>';
  document.getElementById('chatMeta').textContent = 'New conversation';
  document.getElementById('contextBar').innerHTML = '';
  document.getElementById('persistentFilesBar').innerHTML = '';
  // Update sidebar — deselect active session
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
}

function handleChatKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
}

// --- File Attachment (ChatGPT-style) ---
let pendingFiles = [];
const ALLOWED_EXTS = ['.pdf','.jpg','.jpeg','.png','.webp','.docx','.txt','.md','.csv','.xlsx'];
const MAX_ATTACH_FILES = 30;
const MAX_ATTACH_SIZE_MB = 1024;
const MAX_ATTACH_SIZE = MAX_ATTACH_SIZE_MB * 1024 * 1024;

const FILE_ICONS = {
  pdf: '📄', docx: '📝', xlsx: '📊', csv: '📋',
  txt: '📃', md: '📃', jpg: '🖼', jpeg: '🖼', png: '🖼', webp: '🖼',
};
const FILE_BADGE_CLASS = {
  pdf: 'badge-pdf', jpg: 'badge-img', jpeg: 'badge-img', png: 'badge-img', webp: 'badge-img',
  docx: 'badge-docx', xlsx: 'badge-xlsx', csv: 'badge-csv', txt: 'badge-txt', md: 'badge-md',
};

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024*1024) return `${(bytes/1024).toFixed(0)} KB`;
  if (bytes < 1024*1024*1024) return `${(bytes/1024/1024).toFixed(1)} MB`;
  return `${(bytes/1024/1024/1024).toFixed(2)} GB`;
}

function handleChatFiles(fileList) {
  for (const f of fileList) {
    if (pendingFiles.length >= MAX_ATTACH_FILES) {
      addLog('warn', `Max ${MAX_ATTACH_FILES} files per message`);
      break;
    }
    const ext = '.' + f.name.split('.').pop().toLowerCase();
    if (!ALLOWED_EXTS.includes(ext)) {
      addLog('warn', `Unsupported type: ${ext} — allowed: PDF, images, DOCX, TXT, CSV, XLSX`);
      continue;
    }
    if (f.size > MAX_ATTACH_SIZE) {
      addLog('warn', `${f.name} too large (${fmtSize(f.size)}) — max ${MAX_ATTACH_SIZE_MB} MB`);
      continue;
    }
    // Avoid duplicates by name
    if (pendingFiles.some(p => p.name === f.name && p.size === f.size)) continue;
    pendingFiles.push(f);
  }
  renderFileCards();
  document.getElementById('chatFileInput').value = '';
}

// Paste image from clipboard
function handlePaste(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const f = item.getAsFile();
      if (f) {
        // Rename to include type
        const ext = item.type.split('/')[1] || 'png';
        const named = new File([f], `pasted_image.${ext}`, { type: item.type });
        handleChatFiles([named]);
      }
    }
  }
}

function renderFileCards() {
  const bar = document.getElementById('filePreviewBar');
  const attachBtn = document.getElementById('attachBtn');
  const storageEl = document.getElementById('storageIndicator');

  if (!pendingFiles.length) {
    bar.innerHTML = '';
    attachBtn.classList.remove('has-files');
    storageEl.className = 'storage-indicator';
    return;
  }

  attachBtn.classList.add('has-files');

  bar.innerHTML = pendingFiles.map((f, i) => {
    const ext = f.name.split('.').pop().toLowerCase();
    const isImg = ['jpg','jpeg','png','webp'].includes(ext);
    const badge = FILE_BADGE_CLASS[ext] || 'badge-txt';
    const icon = FILE_ICONS[ext] || '📎';
    const shortName = f.name.length > 22 ? f.name.slice(0,19) + '…' + f.name.slice(-4) : f.name;

    if (isImg) {
      const objUrl = URL.createObjectURL(f);
      return `<div class="file-card is-image" title="${escapeHtml(f.name)} · ${fmtSize(f.size)}">
        <img src="${objUrl}" alt="${escapeHtml(f.name)}" onload="URL.revokeObjectURL(this.src)" />
        <span class="file-card-remove" onclick="removeFile(${i})" title="Remove">×</span>
      </div>`;
    }

    return `<div class="file-card" title="${escapeHtml(f.name)} · ${fmtSize(f.size)}">
      <div class="file-card-icon">${icon}</div>
      <div class="file-card-info">
        <div class="file-card-name">${escapeHtml(shortName)}</div>
        <div class="file-card-meta"><span class="file-type-badge ${badge}">${ext.toUpperCase()}</span>${fmtSize(f.size)}</div>
      </div>
      <span class="file-card-remove" onclick="removeFile(${i})" title="Remove">×</span>
    </div>`;
  }).join('');

  // Storage indicator
  const totalBytes = pendingFiles.reduce((s, f) => s + f.size, 0);
  const pct = Math.round((pendingFiles.length / MAX_ATTACH_FILES) * 100);
  storageEl.textContent = `${pendingFiles.length}/${MAX_ATTACH_FILES} files · ${fmtSize(totalBytes)} · Shift+Enter for new line`;
  storageEl.className = 'storage-indicator visible' + (pct >= 80 ? ' warn' : '');
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderFileCards();
}

// Show persistent files from prior turns in this thread
function renderPersistentFiles(fileNames) {
  const bar = document.getElementById('persistentFilesBar');
  if (!bar) return;
  if (!fileNames || !fileNames.length) { bar.innerHTML = ''; return; }
  bar.innerHTML =
    `<span class="persistent-label">📎 Thread files</span>` +
    fileNames.slice(0, 8).map(n => {
      const ext = n.split('.').pop().toLowerCase();
      const icon = FILE_ICONS[ext] || '📎';
      const short = n.length > 20 ? n.slice(0,17) + '…' : n;
      return `<span class="persistent-file-tag">${icon} ${escapeHtml(short)}</span>`;
    }).join('') +
    (fileNames.length > 8 ? `<span class="persistent-file-tag">+${fileNames.length-8} more</span>` : '');
}

// Auto-resize textarea
function autoResizeTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// Drag-drop — cover entire chat panel (not just input area)
(function() {
  const panel = document.getElementById('chatMessages') || document.getElementById('chatInputArea');
  if (!panel) return;
  let dragCounter = 0;
  let overlay = null;

  panel.addEventListener('dragenter', e => {
    if (![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();
    dragCounter++;
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'chat-drop-overlay';
      overlay.innerHTML = '📎 Drop files here<div class="drop-sub">PDF · Images · DOCX · TXT · CSV · XLSX</div>';
      panel.style.position = 'relative';
      panel.appendChild(overlay);
    }
  });
  panel.addEventListener('dragleave', e => {
    dragCounter--;
    if (dragCounter <= 0) {
      if (overlay) { overlay.remove(); overlay = null; }
      dragCounter = 0;
    }
  });
  panel.addEventListener('dragover', e => e.preventDefault());
  panel.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    if (overlay) { overlay.remove(); overlay = null; }
    if (e.dataTransfer.files.length) {
      handleChatFiles(e.dataTransfer.files);
      document.getElementById('chatInput').focus();
    }
  });
})();

async function sendChat() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query) return;

  const streaming = document.getElementById('streamToggle').checked;
  const threadInput = document.getElementById('threadId').value.trim();
  const threadId = threadInput || currentThreadId || null;

  // Add user message — show file cards above the text bubble
  let displayQuery = query;
  if (pendingFiles.length) {
    const fnames = pendingFiles.map(f => f.name).join(' · ');
    displayQuery = `📎 **${fnames}**\n\n${query}`;
  }
  addChatMsg('user', displayQuery);
  input.value = '';
  input.style.height = 'auto';

  // Disable send
  const btn = document.getElementById('chatSendBtn');
  btn.disabled = true;

  try {
    if (pendingFiles.length > 0) {
      btn.textContent = 'Uploading...';
      await sendChatWithFiles(query, threadId);
      pendingFiles = [];
      renderFileCards();
    } else if (streaming) {
      btn.textContent = 'Streaming...';
      await sendChatStream(query, threadId);
    } else {
      btn.textContent = 'Thinking...';
      await sendChatBatch(query, threadId);
    }
  } catch (e) {
    addChatMsg('error', `Request failed: ${e.message}`);
    addLog('error', `Chat error: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = 'Send';
  loadSessionList(); // refresh sidebar
}

async function sendChatWithFiles(query, threadId) {
  const formData = new FormData();
  formData.append('query', query);
  if (threadId) formData.append('globalThreadId', threadId);
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') formData.append('preferred_language', lang);
  pendingFiles.forEach(f => formData.append('files', f));

  addLog('info', `POST /pyapi/chat (files: ${pendingFiles.length}) \u2014 "${query.substring(0, 60)}..."`);

  var chatHeaders = {};
  var k = getApiKey();
  if (k) chatHeaders['X-API-Key'] = k;
  const r = await fetch(getBase() + '/pyapi/chat', {
    method: 'POST',
    headers: chatHeaders,
    body: formData,
  });

  if (!r.ok) {
    const err = await r.text();
    addChatMsg('error', `Error ${r.status}: ${err}`);
    return;
  }

  // Same SSE reader as sendChatStream
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let msgDiv = null;
  let contentEl = null;
  let statusEl = null;
  let accumulatedContent = '';
  let lastAgents = [];
  let lastTokens = 0;
  let startTime = Date.now();
  let fullResponse = '';
  let allSources = [];

  // Create AI message container
  msgDiv = document.createElement('div');
  msgDiv.className = 'msg ai';
  statusEl = document.createElement('div');
  statusEl.className = 'stream-status';
  statusEl.innerHTML = '<span class="typing-indicator"></span> Processing files...';
  msgDiv.appendChild(statusEl);
  contentEl = document.createElement('div');
  contentEl.className = 'msg-content';
  msgDiv.appendChild(contentEl);
  document.getElementById('chatMessages').appendChild(msgDiv);
  msgDiv.scrollIntoView({behavior: 'smooth', block: 'end'});

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const evt = JSON.parse(line.slice(6));

        if (evt.type === 'thread_id') {
          persistThread(evt.data, currentTurnCount);
          document.getElementById('threadId').value = currentThreadId;
        } else if (evt.type === 'file_processing') {
          const fileList = (evt.files || []).slice(0,4).join(' · ');
          statusEl.innerHTML = `<span class="typing-indicator"></span> ${escapeHtml(evt.message)}${fileList ? ' — ' + escapeHtml(fileList) : ''}`;
          // Update persistent files bar when files are confirmed processed
          if (evt.files && evt.files.length) renderPersistentFiles(evt.files);
        } else if (evt.type === 'status') {
          statusEl.innerHTML = `<span class="typing-indicator"></span> ${evt.message}`;
        } else if (evt.type === 'agents_planned') {
          lastAgents = evt.agents;
          statusEl.innerHTML = `<span class="typing-indicator"></span> Agents: ${evt.agents.join(', ')}`;
        } else if (evt.type === 'context') {
          if (evt.query_rewritten) {
            updateContextBar({rewritten: true, effectiveQuery: evt.effective_query, threadId: currentThreadId, turn: currentTurnCount});
          }
        } else if (evt.type === 'token') {
          accumulatedContent += evt.content;
          contentEl.innerHTML = renderMarkdown(accumulatedContent);
          msgDiv.scrollIntoView({behavior: 'smooth', block: 'end'});
        } else if (evt.type === 'token_reset') {
          accumulatedContent = '';
          contentEl.innerHTML = '';
        } else if (evt.type === 'response') {
          fullResponse = evt.content;
          if (!accumulatedContent) {
            contentEl.innerHTML = renderMarkdown(evt.content);
          }
        } else if (evt.type === 'sources') {
          allSources = evt.data;
        } else if (evt.type === 'followup_suggestions' && evt.data && evt.data.length) {
          const sugDiv = document.createElement('div');
          sugDiv.innerHTML = renderFollowupSuggestions(evt.data);
          msgDiv.appendChild(sugDiv);
          scrollChat();
        } else if (evt.type === 'drafting_progress') {
          statusEl.innerHTML = `<span class="typing-indicator"></span> Drafting section ${evt.section}/${evt.total}: ${evt.title}`;
        } else if (evt.type === 'draft_incomplete') {
          const note = document.createElement('div');
          note.className = 'draft-incomplete-note';
          note.innerHTML = `<strong>\u26A0\uFE0F Draft incomplete:</strong> ${parseInt(evt.completed_sections)||0}/${parseInt(evt.total_sections)||0} sections completed. ${parseInt(evt.failed_sections)||0} section(s) failed. <button class="btn btn-secondary btn-sm" onclick="continueDraft(this)">Retry failed sections</button>`;
          msgDiv.appendChild(note);
        } else if (evt.type === 'done') {
          lastTokens = evt.total_tokens || 0;
          const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
          statusEl.remove();
          persistThread(evt.thread_id, evt.conversation_turn || currentTurnCount + 1);
          document.getElementById('chatMeta').textContent =
            `Thread: ${currentThreadId.substring(0,8)}... | Turn ${currentTurnCount} | Agents: ${(evt.agents_used||[]).join(', ')||'none'}`;
          addLog('success', `Files+Chat: ${(evt.agents_used||[]).join(',')} | ${lastTokens} tokens | ${elapsed}s`);
          if (allSources.length) {
            const citDiv = document.createElement('div');
            citDiv.innerHTML = renderCitations(allSources);
            msgDiv.appendChild(citDiv);
          }
        } else if (evt.type === 'error') {
          addChatMsg('error', evt.data);
        }
      } catch(e) { /* skip parse errors */ }
    }
  }
  loadSessionList(); // refresh sidebar
}

async function sendChatBatch(query, threadId) {
  const payload = { Promptquery: query };
  if (threadId) payload.globalThreadId = threadId;
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') payload.preferred_language = lang;

  addLog('info', `POST /pyapi/search — "${query.substring(0, 60)}..."`);
  const start = Date.now();

  const r = await fetch(getBase() + '/pyapi/search', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload),
  });

  const data = await r.json();
  const elapsed = ((Date.now() - start) / 1000).toFixed(1);

  if (!r.ok) {
    addChatMsg('error', `Error ${r.status}: ${data.detail || JSON.stringify(data)}`);
    addLog('error', `Search failed: ${r.status}`);
    return;
  }

  persistThread(data.globalThreadId, data.conversation_turn || currentTurnCount + 1);
  document.getElementById('threadId').value = currentThreadId;
  document.getElementById('chatMeta').textContent =
    `Thread: ${currentThreadId.substring(0, 8)}... | Turn ${currentTurnCount} | Agents: ${(data.agents_used||[]).join(', ') || 'none'}`;

  updateContextBar({
    turn: currentTurnCount,
    rewritten: data.query_rewritten,
    effectiveQuery: data.effective_query,
    threadId: currentThreadId,
  });

  addChatMsg('ai', data.result, data.agents_used, data.total_tokens_consumed, elapsed, data.source,
    data.conversation_turn || currentTurnCount, data.followup_suggestions);
  addLog('success', `Response: ${data.agents_used.join(',')} | ${data.total_tokens_consumed} tokens | ${elapsed}s | ${(data.source || []).length} sources`);
  if (data.query_rewritten) {
    addLog('info', `Query rewritten: "${data.effective_query}"`);
  }
}

async function sendChatStream(query, threadId) {
  const payload = { Promptquery: query };
  if (threadId) payload.globalThreadId = threadId;
  const lang = getPreferredLang();
  if (lang && lang !== 'auto') payload.preferred_language = lang;

  addLog('info', `POST /pyapi/search/stream (SSE) — "${query.substring(0, 60)}..."`);

  const r = await fetch(getBase() + '/pyapi/search/stream', {
    method: 'POST',
    headers: authHeaders(),
    body: JSON.stringify(payload),
  });

  if (!r.ok) {
    const err = await r.text();
    addChatMsg('error', `Stream error ${r.status}: ${err}`);
    return;
  }

  // Create streaming message element with status + content areas
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg ai' + (getPreferredLang() === 'ur' ? ' lang-rtl' : '');
  msgDiv.innerHTML =
    '<div class="agents-badge" id="streamAgents"></div>' +
    '<div id="streamStatus" class="stream-status"><span class="streaming-dot"></span> Connecting...</div>' +
    '<div id="streamSteps" class="stream-steps"></div>' +
    '<div id="streamContent" style="display:none;"></div>';
  document.getElementById('chatMessages').appendChild(msgDiv);
  scrollChat();

  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let content = '';
  let agents = [];
  let totalTokens = 0;
  let lastStepId = null;
  let sourcesData = [];
  let streamQueryRewritten = false;
  let streamEffectiveQuery = null;
  let streamHasSummary = false;
  let streamHistoryTurns = 0;
  let tokenBuffer = '';
  let renderTimer = null;
  let isTokenStreaming = false;
  let hasDraftIncomplete = false;
  let draftIncompleteInfo = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    // Safety cap: if buffer exceeds 1MB without newlines, discard oldest data
    if (buffer.length > 1048576) {
      const lastNewline = buffer.lastIndexOf('\n');
      buffer = lastNewline > 0 ? buffer.slice(lastNewline + 1) : buffer.slice(-65536);
    }
    const lines = buffer.split('\n');
    buffer = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      try {
        const event = JSON.parse(line.slice(6));

        if (event.type === 'thread_id') {
          persistThread(event.data);
          document.getElementById('threadId').value = currentThreadId;

        } else if (event.type === 'context') {
          streamQueryRewritten = event.query_rewritten || false;
          streamEffectiveQuery = event.effective_query || null;
          streamHasSummary = event.has_summary || false;
          streamHistoryTurns = event.history_turns || 0;
          updateContextBar({
            rewritten: streamQueryRewritten,
            effectiveQuery: streamEffectiveQuery,
            hasSummary: streamHasSummary,
            threadId: currentThreadId,
          });
          if (streamQueryRewritten) {
            addLog('info', `Memory: Query rewritten → "${streamEffectiveQuery}"`);
          }
          if (streamHasSummary) {
            addLog('info', `Memory: Context loaded (${streamHistoryTurns} prev turns, has summary)`);
          }

        } else if (event.type === 'agents_planned') {
          // Show agent badges early (as soon as orchestrator plans)
          const agentsEl = document.getElementById('streamAgents');
          if (agentsEl && event.agents && event.agents.length) {
            agentsEl.innerHTML = event.agents.map(a =>
              '<span class="agent-tag">' + escapeHtml(a) + '</span>'
            ).join('');
          }
          addLog('info', 'Agents planned: ' + (event.agents || []).join(', '));

        } else if (event.type === 'status') {
          // Update current status text
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) {
            statusEl.innerHTML = '<span class="streaming-dot"></span> ' + escapeHtml(event.message);
          }

          // When synthesis starts, mark draft progress card as complete
          if (event.agent === 'orchestrator_synthesize') {
            const draftCard = document.getElementById('draftProgressCard');
            if (draftCard) {
              draftCard.classList.add('complete');
              const fillEl = document.getElementById('draftFill');
              if (fillEl) fillEl.style.width = '100%';
              const labelEl = document.getElementById('draftLabel');
              if (labelEl) labelEl.textContent = 'All sections complete — injecting citations...';
              draftCard.querySelectorAll('.draft-section-item.active').forEach(function(el) {
                el.classList.remove('active');
                el.classList.add('done');
                el.querySelector('.icon').textContent = '\u2713';
              });
            }
          }

          // Mark previous step as done, add new step
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) {
            if (lastStepId) {
              const prev = document.getElementById(lastStepId);
              if (prev) {
                prev.classList.remove('active');
                prev.classList.add('done');
                prev.querySelector('.check').textContent = '\u2713';
              }
            }
            const stepDiv = document.createElement('div');
            const stepId = 'step_' + event.agent;
            stepDiv.id = stepId;
            stepDiv.className = 'step active';
            stepDiv.innerHTML = '<span class="check">\u2022</span> ' + escapeHtml(event.message);
            stepsEl.appendChild(stepDiv);
            lastStepId = stepId;
          }
          scrollChat();
          addLog('info', `${event.agent}: ${event.message}`);

        } else if (event.type === 'drafting_progress') {
          // Dedicated draft section progress card
          const statusEl = document.getElementById('streamStatus');
          const stepsEl = document.getElementById('streamSteps');
          let card = document.getElementById('draftProgressCard');
          if (!card) {
            // First section — create the progress card
            if (statusEl) statusEl.style.display = 'none';
            card = document.createElement('div');
            card.id = 'draftProgressCard';
            card.className = 'draft-progress-card';
            card.innerHTML =
              '<div class="draft-progress-header">' +
                '<div class="spinner"></div>' +
                'Generating Legal Draft' +
                '<span class="draft-progress-counter" id="draftCounter"></span>' +
              '</div>' +
              '<div class="draft-progress-bar"><div class="fill" id="draftFill" style="width:0%"></div></div>' +
              '<div class="draft-progress-label" id="draftLabel"></div>' +
              '<div class="draft-section-list" id="draftSections"></div>';
            // Insert card before the steps list
            if (stepsEl && stepsEl.parentNode) {
              stepsEl.parentNode.insertBefore(card, stepsEl);
            }
          }
          // Update progress bar
          const pct = Math.round((event.section / event.total) * 100);
          const fillEl = document.getElementById('draftFill');
          if (fillEl) fillEl.style.width = pct + '%';
          // Update counter
          const counterEl = document.getElementById('draftCounter');
          if (counterEl) counterEl.textContent = event.section + ' / ' + event.total;
          // Update label
          const labelEl = document.getElementById('draftLabel');
          if (labelEl) labelEl.textContent = 'Writing: ' + event.title;
          // Update section list
          const listEl = document.getElementById('draftSections');
          if (listEl) {
            // Mark previous active as done
            const prevActive = listEl.querySelector('.active');
            if (prevActive) {
              prevActive.classList.remove('active');
              prevActive.classList.add('done');
              prevActive.querySelector('.icon').textContent = '\u2713';
            }
            // Add current section
            const item = document.createElement('div');
            item.className = 'draft-section-item active';
            item.innerHTML = '<span class="icon">\u25CF</span> ' + escapeHtml(event.title);
            listEl.appendChild(item);
            listEl.scrollTop = listEl.scrollHeight;
          }
          scrollChat();
          addLog('info', 'Drafting section ' + event.section + '/' + event.total + ': ' + event.title);

        } else if (event.type === 'draft_incomplete') {
          // Some sections failed — mark failed items in draft progress card
          hasDraftIncomplete = true;
          draftIncompleteInfo = event;
          const listEl = document.getElementById('draftSections');
          if (listEl) {
            const items = listEl.querySelectorAll('.draft-section-item');
            // Mark the last active item as failed
            const lastActive = listEl.querySelector('.active');
            if (lastActive) {
              lastActive.classList.remove('active');
              lastActive.classList.add('failed');
              lastActive.querySelector('.icon').textContent = '\u2717';
              lastActive.style.color = 'var(--red, #ef4444)';
            }
          }
          addLog('warning', `Draft incomplete: ${event.failed_sections.length} section(s) failed`);

        } else if (event.type === 'token_reset') {
          // Server is retrying LLM call — clear partial tokens from failed attempt
          tokenBuffer = '';
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
          const resetContentEl = document.getElementById('streamContent');
          if (resetContentEl) resetContentEl.innerHTML = '';
          addLog('info', 'LLM retry — clearing partial output');

        } else if (event.type === 'token') {
          // Progressive token streaming
          if (!isTokenStreaming) {
            isTokenStreaming = true;
            const statusEl = document.getElementById('streamStatus');
            if (statusEl) statusEl.style.display = 'none';
            const stepsEl = document.getElementById('streamSteps');
            if (stepsEl) stepsEl.style.display = 'none';
            // Hide draft progress card when final response starts streaming
            const draftCard = document.getElementById('draftProgressCard');
            if (draftCard) draftCard.style.display = 'none';
            const contentEl = document.getElementById('streamContent');
            if (contentEl) {
              contentEl.style.display = 'block';
              contentEl.classList.add('streaming-cursor');
            }
          }
          tokenBuffer += event.content;
          if (!renderTimer) {
            renderTimer = setTimeout(() => {
              const contentEl = document.getElementById('streamContent');
              if (contentEl) contentEl.innerHTML = renderMarkdown(tokenBuffer);
              scrollChat();
              renderTimer = null;
            }, 80);
          }

        } else if (event.type === 'response') {
          // Final render with complete post-processed text
          content = event.content;
          msgDiv.dataset.markdown = content || '';
          isTokenStreaming = false;
          if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) statusEl.style.display = 'none';
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) stepsEl.style.display = 'none';
          const draftCard = document.getElementById('draftProgressCard');
          if (draftCard) draftCard.style.display = 'none';
          const contentEl = document.getElementById('streamContent');
          if (contentEl) {
            contentEl.classList.remove('streaming-cursor');
            contentEl.style.display = 'block';
            contentEl.innerHTML = renderMarkdown(content);
          }
          scrollChat();

        } else if (event.type === 'sources') {
          sourcesData = event.data || [];
          addLog('info', `Received ${sourcesData.length} citation sources`);

        } else if (event.type === 'followup_suggestions') {
          var sugData = event.data || [];
          if (sugData.length > 0) {
            var sugDiv = document.createElement('div');
            sugDiv.innerHTML = renderFollowupSuggestions(sugData);
            msgDiv.appendChild(sugDiv);
            scrollChat();
          }
          addLog('info', `Received ${sugData.length} follow-up suggestions`);

        } else if (event.type === 'done') {
          agents = event.agents_used || [];
          totalTokens = event.total_tokens || 0;
          const convTurn = event.conversation_turn || 0;
          if (convTurn > 0) persistThread(currentThreadId, convTurn);
          // Update context bar with final turn count
          updateContextBar({
            turn: currentTurnCount,
            rewritten: event.query_rewritten || streamQueryRewritten,
            effectiveQuery: event.effective_query || streamEffectiveQuery,
            hasSummary: streamHasSummary,
            threadId: currentThreadId,
          });
          // Show agents badge
          const agentsEl = document.getElementById('streamAgents');
          if (agentsEl && agents.length) {
            agentsEl.innerHTML = agents.map(a =>
              `<span class="agent-tag">${escapeHtml(a)}</span>`
            ).join('');
          }
          addLog('success', `Stream complete: ${agents.join(', ')} | ${totalTokens} tokens | Turn ${currentTurnCount}`);

        } else if (event.type === 'error') {
          const statusEl = document.getElementById('streamStatus');
          if (statusEl) statusEl.style.display = 'none';
          const stepsEl = document.getElementById('streamSteps');
          if (stepsEl) stepsEl.style.display = 'none';
          content = `**Error:** ${event.data}`;
          const contentEl = document.getElementById('streamContent');
          if (contentEl) {
            contentEl.style.display = 'block';
            contentEl.innerHTML = renderMarkdown(content);
          }
          addLog('error', `Stream error: ${event.data}`);
        }
      } catch (e) { /* ignore parse errors for partial lines */ }
    }
  }

  // Add citations
  if (sourcesData.length > 0) {
    const citDiv = document.createElement('div');
    citDiv.innerHTML = renderCitations(sourcesData);
    msgDiv.appendChild(citDiv);
  }

  // Add tokens footer + response actions
  if (totalTokens > 0) {
    const tokensDiv = document.createElement('div');
    tokensDiv.className = 'tokens';
    tokensDiv.textContent = `${totalTokens} tokens | ${sourcesData.length} sources`;
    msgDiv.appendChild(tokensDiv);
  }
  if (content) {
    msgDiv.dataset.turn = currentTurnCount || '0';
    const actionsDiv = document.createElement('div');
    actionsDiv.innerHTML = renderResponseActions(currentTurnCount);
    msgDiv.appendChild(actionsDiv);
  }

  // Show Continue button for incomplete drafts
  if (hasDraftIncomplete && draftIncompleteInfo) {
    const contDiv = document.createElement('div');
    contDiv.className = 'continue-draft-section';
    const failedNames = (draftIncompleteInfo.failed_sections || [])
      .map(s => s.title).join(', ');
    contDiv.innerHTML =
      '<div class="continue-draft-info">' +
        '<strong>Draft incomplete</strong> — ' +
        draftIncompleteInfo.failed_sections.length + ' of ' +
        draftIncompleteInfo.total_sections + ' section(s) could not be generated: ' +
        escapeHtml(failedNames) +
      '</div>' +
      '<button class="continue-draft-btn" onclick="continueDraft(this)">' +
        '<span class="spinner-sm"></span>' +
        'Continue Draft' +
      '</button>';
    msgDiv.appendChild(contDiv);
  }

  // Handle no response
  if (!content) {
    const statusEl = document.getElementById('streamStatus');
    if (statusEl) statusEl.style.display = 'none';
    const stepsEl = document.getElementById('streamSteps');
    if (stepsEl) stepsEl.style.display = 'none';
    const contentEl = document.getElementById('streamContent');
    if (contentEl) {
      contentEl.style.display = 'block';
      contentEl.innerHTML = '<em>No response received</em>';
    }
  }

  // Remove temp IDs to avoid conflicts with next stream
  ['streamAgents', 'streamStatus', 'streamSteps', 'streamContent'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.removeAttribute('id');
  });

  document.getElementById('chatMeta').textContent =
    `Thread: ${(currentThreadId || '').substring(0, 8)}... | Turn ${currentTurnCount} | Agents: ${agents.join(', ') || 'none'} | Streamed`;
}

function addChatMsg(type, text, agents, tokens, elapsed, sources, turnNumber, followupSuggestions) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  if (type === 'ai' && getPreferredLang() === 'ur') div.classList.add('lang-rtl');

  if (type === 'ai') {
    div.dataset.markdown = text || '';
    if (turnNumber) div.dataset.turn = turnNumber;
    let html = '';
    if (agents && agents.length) {
      html += '<div class="agents-badge">' +
        agents.map(a => `<span class="agent-tag">${a}</span>`).join('') +
        '</div>';
    }
    html += renderMarkdown(text);
    if (sources && sources.length) {
      html += renderCitations(sources);
    }
    if (followupSuggestions && followupSuggestions.length) {
      html += renderFollowupSuggestions(followupSuggestions);
    }
    if (tokens || elapsed) {
      html += `<div class="tokens">${tokens ? tokens + ' tokens' : ''}${elapsed ? ' | ' + elapsed + 's' : ''}</div>`;
    }
    html += renderResponseActions(turnNumber);
    div.innerHTML = html;
  } else {
    div.textContent = text;
  }

  const container = document.getElementById('chatMessages');
  container.appendChild(div);
  // Cap DOM messages to prevent memory bloat in long sessions
  const MAX_DOM_MESSAGES = 200;
  while (container.children.length > MAX_DOM_MESSAGES) {
    container.removeChild(container.firstChild);
  }
  scrollChat();
}

function scrollChat() {
  const el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

// ============================================================
// Simple Markdown Renderer
// ============================================================
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderMarkdown(text) {
  if (!text) return '';
  // Escape HTML entities FIRST to prevent XSS
  let html = escapeHtml(text);

  // Code blocks (must come first to protect content inside)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

  // Tables — parse markdown tables into HTML tables
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)+)/gm, function(match, headerRow, sepRow, bodyRows) {
    var headers = headerRow.split('|').filter(function(c) { return c.trim(); });
    var rows = bodyRows.trim().split('\n');
    var table = '<table><thead><tr>';
    headers.forEach(function(h) { table += '<th>' + h.trim() + '</th>'; });
    table += '</tr></thead><tbody>';
    rows.forEach(function(row) {
      var cells = row.split('|').filter(function(c) { return c.trim(); });
      table += '<tr>';
      cells.forEach(function(c) { table += '<td>' + c.trim() + '</td>'; });
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });

  html = html
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Headers
    .replace(/^##### (.+)$/gm, '<h5>$1</h5>')
    .replace(/^#### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h2>$1</h2>')
    // Horizontal rule
    .replace(/^---+$/gm, '<hr>')
    // Blockquotes
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    // Bullet lists
    .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
    // Numbered lists
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Line breaks
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/(<li>.*?<\/li>(\s*<br>)?)+/g, function(match) {
    return '<ul>' + match.replace(/<br>/g, '') + '</ul>';
  });

  // Merge consecutive blockquotes
  html = html.replace(/<\/blockquote>(\s*<br>)*\s*<blockquote>/g, '<br>');

  return '<p>' + html + '</p>';
}
