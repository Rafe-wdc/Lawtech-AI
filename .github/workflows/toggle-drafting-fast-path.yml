name: Toggle drafting follow-up fast path (manual)

# Sets DRAFTING_FOLLOWUP_FAST_PATH in the server's .env and restarts the app.
#
# With the flag on, a follow-up that edits the previous draft skips the full
# drafting pipeline:
#   - "change paragraph 3", "remove the second ground"  -> targeted edit:
#     one call returns block edits, every other paragraph is kept as it was
#   - "translate it", "shorten it"                      -> one whole-document
#     rewrite call
# Off (default), every follow-up re-runs the full pipeline. Measured
# 2026-10-19 on dev and prod: "shorten it" on a two-page notice cost ~53k
# tokens with the flag off.
#
# workflow_dispatch only. Idempotent: replaces the line if present, appends
# it otherwise. Rollback: run again with value 0. Same SSH secrets, app
# directories and restart method as deploy.yml (dev) and deploy-prod.yml
# (prod); the prod job waits for the production environment approval.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Server'
        required: true
        default: 'dev'
        type: choice
        options: ['dev', 'prod']
      value:
        description: 'DRAFTING_FOLLOWUP_FAST_PATH (1 = on, 0 = off)'
        required: true
        default: '1'
        type: choice
        options: ['1', '0']

jobs:
  dev:
    if: inputs.target == 'dev'
    name: Flip flag on dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Set flag + restart gunicorn + verify health
        env:
          FLAG_VALUE: ${{ inputs.value }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            FLAG_VALUE="$FLAG_VALUE" bash <<'ENDSSH'
            set -e
            APP_DIR=/root/v2_multi_agent
            cd $APP_DIR
            ENV_FILE="$APP_DIR/.env"

            echo "=== Before ==="
            grep -E "^DRAFTING_FOLLOWUP_FAST_PATH=" "$ENV_FILE" || echo "(not set)"
            if grep -qE "^DRAFTING_FOLLOWUP_FAST_PATH=" "$ENV_FILE"; then
              sed -i.bak -E "s/^DRAFTING_FOLLOWUP_FAST_PATH=.*/DRAFTING_FOLLOWUP_FAST_PATH=${FLAG_VALUE}/" "$ENV_FILE"
            else
              echo "DRAFTING_FOLLOWUP_FAST_PATH=${FLAG_VALUE}" >> "$ENV_FILE"
            fi
            echo "=== After ==="
            grep -E "^DRAFTING_FOLLOWUP_FAST_PATH=" "$ENV_FILE"

            # preload_app=True: workers need a fresh master to read the new env.
            MASTER_PID=$(pgrep -f 'gunicorn.*core.gateway:app' -o 2>/dev/null || echo "0")
            if [ "$MASTER_PID" -gt "0" ] 2>/dev/null; then
              kill -TERM "$MASTER_PID"
              for j in $(seq 1 10); do kill -0 "$MASTER_PID" 2>/dev/null || break; sleep 1; done
            fi
            nohup $APP_DIR/venv/bin/gunicorn -c gunicorn.conf.py core.gateway:app > /dev/null 2>&1 &

            CONSECUTIVE_OK=0
            for i in $(seq 1 24); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/pyapi/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
                CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
                if [ "$CONSECUTIVE_OK" -ge 3 ]; then echo "FLAG FLIP OK (HTTP $STATUS)"; exit 0; fi
              else
                CONSECUTIVE_OK=0
                echo "Waiting... attempt $i/24 (HTTP $STATUS)"
              fi
            done
            echo "ERROR: app not healthy within 120s"
            tail -50 $APP_DIR/logs/error.log
            exit 1
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  prod:
    if: inputs.target == 'prod'
    name: Flip flag on prod
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Set flag + systemctl restart + verify health
        env:
          FLAG_VALUE: ${{ inputs.value }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
            FLAG_VALUE="$FLAG_VALUE" 'bash -s' << 'ENDSSH'
          set -e
          ENV_FILE=/root/Lawtech-AI/.env

          echo "=== Before ==="
          sudo grep -E '^DRAFTING_FOLLOWUP_FAST_PATH=' "$ENV_FILE" || echo "(not set)"
          if sudo grep -qE '^DRAFTING_FOLLOWUP_FAST_PATH=' "$ENV_FILE"; then
            sudo sed -i.bak -E "s/^DRAFTING_FOLLOWUP_FAST_PATH=.*/DRAFTING_FOLLOWUP_FAST_PATH=${FLAG_VALUE}/" "$ENV_FILE"
          else
            echo "DRAFTING_FOLLOWUP_FAST_PATH=${FLAG_VALUE}" | sudo tee -a "$ENV_FILE" >/dev/null
          fi
          echo "=== After ==="
          sudo grep -E '^DRAFTING_FOLLOWUP_FAST_PATH=' "$ENV_FILE"

          sudo systemctl restart lawttorney-v2

          CONSECUTIVE_OK=0
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5001/pyapi/health 2>/dev/null) || STATUS="000"
            if [ "$STATUS" = "200" ]; then
              CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
              if [ "$CONSECUTIVE_OK" -ge 3 ]; then sleep 10; echo "FLAG FLIP OK"; exit 0; fi
            else
              CONSECUTIVE_OK=0
              echo "Waiting... attempt $i/24 (HTTP $STATUS)"
            fi
          done
          echo "ERROR: no 3 consecutive 200s within 120s"
          sudo journalctl -u lawttorney-v2 -n 50 --no-pager
          exit 1
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
