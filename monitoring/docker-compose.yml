version: "3.8"

# Lawtech-AI — L2 Observability Stack
# Prometheus scrapes metrics from the app, Grafana visualises them.
#
# Start:  docker compose -f monitoring/docker-compose.yml up -d
# Stop:   docker compose -f monitoring/docker-compose.yml down
# Grafana: http://localhost:3000  (admin / admin — change on first login)

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: lawtech-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: lawtech-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/lawtech.json
      # Alerting — unified alerting (Grafana 9+), legacy alerting disabled
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_ALERTING_ENABLED=false
      # SMTP — fill these in to enable email alerts (or set via .env on the server)
      # Use an app-password, not your main account password.
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST:-smtp.gmail.com:587}
      - GF_SMTP_USER=${GF_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS:-admin@lawttorney.com}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Lawtech Alerts}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  prometheus_data:
  grafana_data:
