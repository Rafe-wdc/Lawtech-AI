// ============================================================
// Citation Rendering
// ============================================================
const SOURCE_ICONS = {
  judgment:       { icon: '\u2696\uFE0F', label: 'Court Judgment' },
  sci_judgment:   { icon: '\u2696\uFE0F', label: 'Supreme Court Judgment' },
  legislation:    { icon: '\uD83D\uDCDC', label: 'Legislation' },
  newacts:        { icon: '\uD83D\uDCCB', label: 'Act / Code' },
  drafting:       { icon: '\u270F\uFE0F', label: 'Legal Template' },
  scenario:       { icon: '\uD83C\uDF10', label: 'Web Source' },
  constitution:   { icon: '\uD83C\uDFDB\uFE0F', label: 'Constitutional Provision' },
  maxim:          { icon: '\uD83D\uDCD6', label: 'Legal Maxim' },
  document:       { icon: '\uD83D\uDCC4', label: 'Uploaded Document' },
  legal_concepts: { icon: '\uD83D\uDCA1', label: 'Legal Concept' },
};

function renderCitations(sources) {
  if (!sources || !Array.isArray(sources) || sources.length === 0) return '';

  const cardsHtml = sources.map(function(s) {
    const type = s.source_type || 'legal_concepts';
    const iconInfo = SOURCE_ICONS[type] || SOURCE_ICONS.legal_concepts;

    var metaHtml = '';
    if (s.court_name) metaHtml += '<span>\uD83C\uDFDB ' + escapeHtml(s.court_name) + '</span>';
    if (s.year) metaHtml += '<span>\uD83D\uDCC5 ' + s.year + '</span>';
    if (s.case_no) metaHtml += '<span># ' + escapeHtml(s.case_no) + '</span>';
    if (s.judgment_date) metaHtml += '<span>\uD83D\uDCC5 ' + escapeHtml(s.judgment_date) + '</span>';
    if (s.bench) metaHtml += '<span>\uD83D\uDC64 ' + escapeHtml((s.bench || '').substring(0, 80)) + '</span>';
    if (s.judgment_by) metaHtml += '<span>Judge: ' + escapeHtml(s.judgment_by) + '</span>';
    if (s.section_number) metaHtml += '<span>\u00A7 Section ' + escapeHtml(s.section_number) + '</span>';
    if (s.act_name) metaHtml += '<span>\uD83D\uDCDC ' + escapeHtml(s.act_name) + '</span>';
    if (s.template_type) metaHtml += '<span>Template: ' + escapeHtml(s.template_type) + '</span>';
    if (s.agent_name) metaHtml += '<span class="citation-agent-tag">' + escapeHtml(s.agent_name) + '</span>';

    var linkHtml = '';
    if (s.doc_link && s.doc_link !== 'N/A') {
      linkHtml = '<a class="citation-link" href="' + escapeHtml(s.doc_link) + '" target="_blank" rel="noopener">\uD83D\uDCC4 View PDF</a>';
    } else if (s.web_url) {
      linkHtml = '<a class="citation-link" href="' + escapeHtml(s.web_url) + '" target="_blank" rel="noopener">\uD83C\uDF10 ' + escapeHtml(s.web_title || 'View Source') + '</a>';
    }
    if (s.pdf_links && s.pdf_links.length > 0) {
      linkHtml = s.pdf_links.map(function(pl) {
        return '<a class="citation-link" href="' + escapeHtml(pl.url) + '" target="_blank" rel="noopener">\uD83D\uDCC4 ' + escapeHtml(pl.label || 'PDF') + '</a>';
      }).join(' ');
    }

    var excerptHtml = '';
    if (s.content && s.content.length && s.content[0]) {
      var fullText = Array.isArray(s.content) ? s.content.join('\n\n') : String(s.content);
      var excerpt = fullText.substring(0, 150);
      var cardUid = 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      excerptHtml = '<div class="citation-excerpt">' + escapeHtml(excerpt) + '...</div>';
      if (fullText.length > 160) {
        excerptHtml += '<button class="citation-expand-btn" onclick="toggleCardContent(\'' + cardUid + '\')">' +
          '<span id="' + cardUid + '_label">Show more</span></button>' +
          '<div class="citation-full-content" id="' + cardUid + '_full">' + escapeHtml(fullText) + '</div>';
      }
    }

    var titleHtml = escapeHtml(s.title || 'Source');
    if (s.doc_link && s.doc_link !== 'N/A') {
      titleHtml = '<a href="' + escapeHtml(s.doc_link) + '" target="_blank">' + titleHtml + '</a>';
    } else if (s.web_url) {
      titleHtml = '<a href="' + escapeHtml(s.web_url) + '" target="_blank">' + titleHtml + '</a>';
    }

    return '<div class="citation-card">' +
      '<div class="citation-icon ' + type + '">' + iconInfo.icon + '</div>' +
      '<div class="citation-body">' +
        '<div class="citation-title">' + titleHtml + '</div>' +
        (metaHtml ? '<div class="citation-meta">' + metaHtml + '</div>' : '') +
        excerptHtml +
        linkHtml +
      '</div></div>';
  }).join('');

  var uid = 'cite_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  return '<div class="citations-section">' +
    '<div class="citations-header" onclick="toggleCitations(\'' + uid + '\')">' +
      '<span>Sources & Citations <span class="citations-count">' + sources.length + '</span></span>' +
      '<span class="chevron" id="' + uid + '_chevron">\u25BC</span>' +
    '</div>' +
    '<div class="citations-list" id="' + uid + '">' + cardsHtml + '</div>' +
  '</div>';
}

function toggleCitations(id) {
  var list = document.getElementById(id);
  var chevron = document.getElementById(id + '_chevron');
  if (list.classList.contains('expanded')) {
    list.classList.remove('expanded');
    chevron.classList.remove('open');
  } else {
    list.classList.add('expanded');
    chevron.classList.add('open');
  }
}

function toggleCardContent(cardUid) {
  var fullEl = document.getElementById(cardUid + '_full');
  var labelEl = document.getElementById(cardUid + '_label');
  if (fullEl.classList.contains('visible')) {
    fullEl.classList.remove('visible');
    labelEl.textContent = 'Show more';
  } else {
    fullEl.classList.add('visible');
    labelEl.textContent = 'Show less';
  }
}

// ============================================================
// Response Actions (Copy, Export, Feedback)
// ============================================================
function renderResponseActions(turnNumber) {
  var tn = turnNumber || 0;
  return '<div class="response-actions">' +
    '<button class="response-action-btn" onclick="copyResponse(this)">\uD83D\uDCCB Copy</button>' +
    '<button class="response-action-btn" onclick="exportResponse(this)">\uD83D\uDCE5 Export .md</button>' +
    '<div style="margin-left:auto;display:flex;gap:6px">' +
      '<button class="feedback-btn" data-turn="' + tn + '" onclick="sendFeedback(this,\'up\')">\uD83D\uDC4D</button>' +
      '<button class="feedback-btn" data-turn="' + tn + '" onclick="sendFeedback(this,\'down\')">\uD83D\uDC4E</button>' +
    '</div>' +
  '</div>' +
  '<div class="feedback-comment" id="fb_comment_' + tn + '">' +
    '<input type="text" placeholder="What went wrong? (optional)" onkeydown="if(event.key===\'Enter\')submitFeedbackComment(this)" />' +
    '<button class="btn btn-secondary btn-sm" onclick="submitFeedbackComment(this.previousElementSibling)">Send</button>' +
  '</div>';
}

function copyResponse(btn) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  navigator.clipboard.writeText(markdown).then(function() {
    btn.classList.add('copied');
    var orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
  });
}

function exportResponse(btn) {
  var msgDiv = btn.closest('.msg.ai');
  var markdown = msgDiv ? (msgDiv.dataset.markdown || msgDiv.innerText) : '';
  var blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'lawttorney_response_' + new Date().toISOString().slice(0, 10) + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function sendFeedback(btn, rating) {
  if (!currentThreadId) return;
  var turn = parseInt(btn.dataset.turn) || 0;
  if (!turn) return;

  var row = btn.parentElement;
  row.querySelectorAll('.feedback-btn').forEach(function(b) {
    b.classList.remove('active-up', 'active-down');
  });
  btn.classList.add('active-' + rating);

  var commentEl = document.getElementById('fb_comment_' + turn);
  if (rating === 'down' && commentEl) {
    commentEl.classList.add('visible');
  } else if (commentEl) {
    commentEl.classList.remove('visible');
  }

  try {
    await fetch(getBase() + '/pyapi/feedback', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ thread_id: currentThreadId, turn_number: turn, rating: rating }),
    });
    addLog('info', 'Feedback sent: ' + rating + ' for turn ' + turn);
  } catch (e) {
    addLog('error', 'Feedback failed: ' + e.message);
  }
}

async function submitFeedbackComment(input) {
  var comment = input.value.trim();
  if (!comment || !currentThreadId) return;
  var msgEl = input.closest('.msg');
  var downBtn = msgEl.querySelector('.feedback-btn[data-turn]');
  var turn = parseInt(downBtn.dataset.turn) || 0;

  try {
    await fetch(getBase() + '/pyapi/feedback', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ thread_id: currentThreadId, turn_number: turn, rating: 'down', comment: comment }),
    });
    input.closest('.feedback-comment').classList.remove('visible');
    input.value = '';
    addLog('info', 'Feedback comment sent for turn ' + turn);
  } catch (e) {
    addLog('error', 'Feedback comment failed: ' + e.message);
  }
}

// ============================================================
// Continue Draft (retry failed sections)
// ============================================================
async function continueDraft(btn) {
  if (!currentThreadId) {
    addLog('error', 'No active thread for continue draft');
    return;
  }

  // Disable button and show loading state
  btn.classList.add('loading');
  btn.disabled = true;
  var origText = btn.innerHTML;

  // Hide the continue section
  var section = btn.closest('.continue-draft-section');

  addLog('info', 'Continuing incomplete draft...');

  try {
    var resp = await fetch(getBase() + '/pyapi/continue_draft', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ globalThreadId: currentThreadId }),
    });

    if (!resp.ok) {
      var errData = await resp.json().catch(function() { return {}; });
      throw new Error(errData.detail || 'Continue draft request failed');
    }

    // Hide the continue section entirely
    if (section) section.style.display = 'none';

    // Create a new streaming message div
    var msgDiv = document.createElement('div');
    msgDiv.className = 'msg ai';
    msgDiv.innerHTML =
      '<div class="agents-badge" id="contAgents"><span class="agent-tag">Drafting</span></div>' +
      '<div id="contStatus" class="stream-status"><span class="streaming-dot"></span> Retrying incomplete sections...</div>' +
      '<div id="contSteps" class="stream-steps"></div>' +
      '<div id="contContent" style="display:none;"></div>';
    document.getElementById('chatMessages').appendChild(msgDiv);
    scrollChat();

    // Read SSE stream
    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    var content = '';
    var tokenBuffer = '';
    var renderTimer = null;
    var isTokenStreaming = false;
    var hasDraftIncomplete = false;
    var draftIncompleteInfo = null;
    var totalTokens = 0;
    var sourcesData = [];

    while (true) {
      var result = await reader.read();
      if (result.done) break;

      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();

      for (var li = 0; li < lines.length; li++) {
        var line = lines[li];
        if (!line.startsWith('data: ')) continue;
        try {
          var event = JSON.parse(line.slice(6));

          if (event.type === 'drafting_progress') {
            var statusEl = document.getElementById('contStatus');
            if (statusEl) {
              statusEl.innerHTML = '<span class="streaming-dot"></span> Retrying: ' + escapeHtml(event.title) +
                ' (' + event.section + '/' + event.total + ')';
            }
            addLog('info', 'Continue drafting section ' + event.section + '/' + event.total + ': ' + event.title);

          } else if (event.type === 'draft_incomplete') {
            hasDraftIncomplete = true;
            draftIncompleteInfo = event;
            addLog('warning', 'Continue: still ' + event.failed_sections.length + ' section(s) failed');

          } else if (event.type === 'token') {
            if (!isTokenStreaming) {
              isTokenStreaming = true;
              var sEl = document.getElementById('contStatus');
              if (sEl) sEl.style.display = 'none';
              var cEl = document.getElementById('contContent');
              if (cEl) { cEl.style.display = 'block'; cEl.classList.add('streaming-cursor'); }
            }
            tokenBuffer += event.content;
            if (!renderTimer) {
              renderTimer = setTimeout(function() {
                var el = document.getElementById('contContent');
                if (el) el.innerHTML = renderMarkdown(tokenBuffer);
                scrollChat();
                renderTimer = null;
              }, 80);
            }

          } else if (event.type === 'token_reset') {
            tokenBuffer = '';
            if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
            var rEl = document.getElementById('contContent');
            if (rEl) rEl.innerHTML = '';

          } else if (event.type === 'response') {
            content = event.content;
            msgDiv.dataset.markdown = content || '';
            isTokenStreaming = false;
            if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
            var sEl2 = document.getElementById('contStatus');
            if (sEl2) sEl2.style.display = 'none';
            var cEl2 = document.getElementById('contContent');
            if (cEl2) {
              cEl2.classList.remove('streaming-cursor');
              cEl2.style.display = 'block';
              cEl2.innerHTML = renderMarkdown(content);
            }
            scrollChat();

          } else if (event.type === 'sources') {
            sourcesData = event.data || [];

          } else if (event.type === 'done') {
            totalTokens = event.total_tokens || 0;
            var convTurn = event.conversation_turn || 0;
            if (convTurn > 0) persistThread(currentThreadId, convTurn);
            addLog('success', 'Continue draft complete | ' + totalTokens + ' tokens');
          }
        } catch (e) { /* ignore parse errors */ }
      }
    }

    // Remove temp IDs
    ['contAgents', 'contStatus', 'contSteps', 'contContent'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.removeAttribute('id');
    });

    // Add citations
    if (sourcesData.length > 0) {
      var citDiv = document.createElement('div');
      citDiv.innerHTML = renderCitations(sourcesData);
      msgDiv.appendChild(citDiv);
    }

    // Add tokens and actions
    if (totalTokens > 0) {
      var tokDiv = document.createElement('div');
      tokDiv.className = 'tokens';
      tokDiv.textContent = totalTokens + ' tokens | ' + sourcesData.length + ' sources';
      msgDiv.appendChild(tokDiv);
    }
    if (content) {
      msgDiv.dataset.turn = currentTurnCount || '0';
      var actDiv = document.createElement('div');
      actDiv.innerHTML = renderResponseActions(currentTurnCount);
      msgDiv.appendChild(actDiv);
    }

    // If still incomplete after retry, show Continue button again
    if (hasDraftIncomplete && draftIncompleteInfo) {
      var contDiv = document.createElement('div');
      contDiv.className = 'continue-draft-section';
      var failedNames = (draftIncompleteInfo.failed_sections || [])
        .map(function(s) { return s.title; }).join(', ');
      contDiv.innerHTML =
        '<div class="continue-draft-info">' +
          '<strong>Draft still incomplete</strong> — ' +
          draftIncompleteInfo.failed_sections.length + ' section(s) still failed: ' +
          escapeHtml(failedNames) +
        '</div>' +
        '<button class="continue-draft-btn" onclick="continueDraft(this)">' +
          '<span class="spinner-sm"></span>' +
          'Retry Again' +
        '</button>';
      msgDiv.appendChild(contDiv);
    }

    scrollChat();

  } catch (e) {
    addLog('error', 'Continue draft failed: ' + e.message);
    btn.classList.remove('loading');
    btn.disabled = false;
    btn.innerHTML = origText;
  }
}

// ============================================================
// Follow-up Suggestions
// ============================================================
function renderFollowupSuggestions(suggestions) {
  if (!suggestions || !suggestions.length) return '';
  var chips = suggestions.map(function(s) {
    return '<span class="followup-chip" onclick="sendFollowup(this)">' + escapeHtml(s) + '</span>';
  }).join('');
  return '<div class="followup-section">' +
    '<div class="followup-title">Suggested follow-ups</div>' +
    chips + '</div>';
}

function sendFollowup(chip) {
  document.getElementById('chatInput').value = chip.textContent;
  sendChat();
}


// ============================================================
// Init
// ============================================================
initApiKey();
checkHealth();
loadSessionList();
initLangSelect();

// Restore thread state from sessionStorage — auto-load full history
if (currentThreadId) {
  restoreSession(currentThreadId, currentTurnCount);
}
</script>
