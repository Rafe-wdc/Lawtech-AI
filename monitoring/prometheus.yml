global:
  scrape_interval: 15s
  evaluation_interval: 15s

# NOTE: Replace "your-admin-key-here" with your actual ADMIN_API_KEY value.
# Prometheus does not support env var substitution — edit this file directly.

scrape_configs:
  # Local dev (uvicorn on port 5000)
  - job_name: "lawtech-dev"
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: "/pyapi/metrics"
    authorization:
      type: "Bearer"
      credentials: "your-admin-key-here"

  # Production (gunicorn on port 5001)
  - job_name: "lawtech-prod"
    static_configs:
      - targets: ["host.docker.internal:5001"]
    metrics_path: "/pyapi/metrics"
    authorization:
      type: "Bearer"
      credentials: "your-admin-key-here"
