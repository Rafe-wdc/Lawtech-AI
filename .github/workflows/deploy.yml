name: Test & Deploy (dev → Vultr)

# Deploys the dev branch to the Vultr test box. Use this branch for
# pre-production validation; once dev is stable, merge to main and the
# deploy-prod.yml workflow ships to the AWS production box (with manual
# approval). Phase 2-8 scaling rollout, 2026-06-12.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ── Job 1: Fast syntax + import check ─────────────────────────────────────
  test:
    name: Syntax & Import Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight dependencies (syntax check only)
        run: |
          pip install --quiet \
            fastapi pydantic python-dotenv structlog \
            langgraph langchain langchain-core langchain-openai \
            langchain-google-genai slowapi uvicorn gunicorn \
            psycopg psutil prometheus-client

      - name: Check Python syntax (all .py files)
        run: |
          echo "Checking syntax..."
          find . -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            | xargs python -m py_compile
          echo "Syntax OK"

      - name: Check critical module imports
        env:
          # Dummy values so settings.py doesn't raise on missing keys
          OPENAI_API_KEY: sk-dummy
          GOOGLE_API_KEY: AIza-dummy
          API_KEYS: test-key
          ADMIN_API_KEY: test-admin-key
        run: |
          echo "Checking core imports..."
          python -c "from core.settings import HOST, PORT; print('settings OK')"
          python -c "from core.auth import require_user_key, require_admin_key; print('auth OK')"
          python -c "from core.checkpointer import create_checkpointer; print('checkpointer OK')"
          python -c "from core.logger import get_logger; print('logger OK')"
          echo "All imports OK"

  # ── Job 2: Integration tests against live server (optional) ──────────────
  # Runs only when INTEGRATION_TEST_URL repo variable is set. Hits the dev
  # box (Vultr) via /pyapiv2 prefix. Production integration runs are in
  # deploy-prod.yml against api.lawttorney.com.
  #   vars.INTEGRATION_TEST_URL    https://tool.lawttorney.com
  #   secrets.INTEGRATION_API_KEY  a valid user API key
  #   secrets.INTEGRATION_ADMIN_KEY a valid admin API key
  integration:
    name: Integration Tests (dev)
    # Wait for deploy to finish before testing. Running in parallel causes
    # flaky 502s when gunicorn is mid-restart. deploy only runs on push to
    # dev, so on PRs we fall back to just the syntax check.
    needs: [test, deploy]
    runs-on: ubuntu-latest
    # Gate: set INTEGRATION_TEST_URL as a repository variable (not secret)
    # GitHub → Settings → Variables → Actions → New repository variable
    if: vars.INTEGRATION_TEST_URL != ''
    continue-on-error: true   # informational, doesn't block anything

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: pip install --quiet pytest requests pytest-timeout pytest-rerunfailures

      - name: Run integration tests
        env:
          API_URL:   ${{ vars.INTEGRATION_TEST_URL }}
          API_PREFIX: /pyapiv2
          API_KEY:   ${{ secrets.INTEGRATION_API_KEY }}
          ADMIN_KEY: ${{ secrets.INTEGRATION_ADMIN_KEY }}
        # --reruns 2: GitHub Actions runners occasionally see TLS handshake
        # timeouts to tool.lawttorney.com (likely nginx upstream cycling
        # or Cloudflare-style burst rate-limiting). Prod is healthy from
        # other IPs at the same instant, so this is purely a CI-side
        # network blip. Auto-retry tolerates ≤3 transient blips per test
        # without masking real regressions.
        run: |
          pytest tests/integration/test_api.py -v \
            --tb=short \
            --timeout=60 \
            --reruns 2 --reruns-delay 5 \
            -x

  # ── Job 3: Deploy to Vultr dev box (dev only) ────────────────────────────
  deploy:
    name: Deploy to dev (Vultr)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Package application (exclude heavy/secret dirs)
        run: |
          tar --exclude='.git' \
              --exclude='venv' \
              --exclude='.venv' \
              --exclude='data' \
              --exclude='logs' \
              --exclude='models' \
              --exclude='chroma_store' \
              --exclude='uploads' \
              --exclude='*.pyc' \
              --exclude='__pycache__' \
              --exclude='.env' \
              -czf /tmp/lawtech_deploy.tar.gz .
          echo "Package size: $(du -sh /tmp/lawtech_deploy.tar.gz | cut -f1)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload package to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/lawtech_deploy.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/lawtech_deploy.tar.gz"

      - name: Deploy and restart on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'ENDSSH'
            set -e

            echo "=== Deploying Lawtech-AI ==="
            APP_DIR=/root/v2_multi_agent
            cd $APP_DIR

            # Extract new code (preserves .env, data/, logs/, models/, chroma_store/)
            tar -xzf /tmp/lawtech_deploy.tar.gz -C $APP_DIR
            rm /tmp/lawtech_deploy.tar.gz

            # Update frontend
            cp frontend.html /var/www/html/v2test.html
            sed -i 's|value="http://localhost:5000"|value="https://tool.lawttorney.com"|g' /var/www/html/v2test.html
            sed -i 's|/pyapi/|/pyapiv2/|g' /var/www/html/v2test.html

            # Install any new Python dependencies
            source venv/bin/activate
            pip install -q -r requirements.txt

            # Full restart required because preload_app=True means HUP only
            # respawns workers with the SAME preloaded code — new .py files
            # on disk are never re-imported. Stop → start ensures fresh import.
            MASTER_PID=$(pgrep -f 'gunicorn.*core.gateway:app' -o 2>/dev/null || echo "0")
            if [ "$MASTER_PID" -gt "0" ] 2>/dev/null; then
              echo "Stopping gunicorn master (PID $MASTER_PID)..."
              kill -TERM "$MASTER_PID"
              # Wait for master to exit (max 10s)
              for j in $(seq 1 10); do
                kill -0 "$MASTER_PID" 2>/dev/null || break
                sleep 1
              done
              echo "Gunicorn stopped"
            fi
            # Start fresh — new master loads updated code from disk
            nohup /root/v2_multi_agent/venv/bin/gunicorn -c gunicorn.conf.py core.gateway:app > /dev/null 2>&1 &
            echo "Gunicorn started fresh (new PID: $(pgrep -f 'gunicorn.*core.gateway:app' -o 2>/dev/null))"

            # Wait for ALL workers to settle, not just the first to respond.
            # /health on localhost bypasses nginx, so a single 200/503 only
            # proves ONE worker is up. Integration tests hit nginx, which
            # round-robins across all 16 workers. If a worker is still in
            # FastAPI lifespan startup (PG pool + graph compile), that
            # request will TLS-handshake-timeout. Require 3 CONSECUTIVE
            # healthy polls (≈10s of stable readiness) before declaring
            # the deploy done.
            CONSECUTIVE_OK=0
            NEEDED=3
            for i in $(seq 1 24); do
              sleep 5
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/pyapi/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
                CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
                if [ "$CONSECUTIVE_OK" -ge "$NEEDED" ]; then
                  echo "Stable health: $NEEDED consecutive checks at HTTP $STATUS"
                  # Final settle period for any remaining workers to finish
                  # their lifespan startup before external traffic arrives.
                  sleep 10
                  exit 0
                fi
                echo "Healthy (HTTP $STATUS), $CONSECUTIVE_OK/$NEEDED consecutive..."
              else
                CONSECUTIVE_OK=0
                echo "Waiting... attempt $i/24 (HTTP $STATUS)"
              fi
            done

            echo "ERROR: did not see $NEEDED consecutive healthy checks within 120s"
            tail -50 /root/v2_multi_agent/logs/error.log
            exit 1
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
