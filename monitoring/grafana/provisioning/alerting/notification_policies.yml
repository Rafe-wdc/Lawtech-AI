apiVersion: 1

policies:
  - orgId: 1
    receiver: lawtech-oncall
    group_by: [alertname, severity]
    group_wait: 30s       # wait before sending first alert in a group
    group_interval: 5m    # how often to send updates for an ongoing alert
    repeat_interval: 4h   # re-notify if still firing after 4 hours
    routes:
      # Critical alerts fire immediately, repeat every hour
      - receiver: lawtech-oncall
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
