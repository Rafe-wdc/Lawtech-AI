name: Prod CORS — add origin to ALLOWED_ORIGINS

# One-off workflow_dispatch. SSHes into prod, idempotently adds
# https://lawttorney.ai to ALLOWED_ORIGINS in /root/Lawtech-AI/.env,
# backs the file up, restarts lawttorney-v2 to pick up the new env,
# and runs an OPTIONS preflight to confirm CORS is permissive.

on:
  workflow_dispatch:
    inputs:
      new_origin:
        description: "Origin to add (e.g. https://lawttorney.ai)"
        required: true
        default: "https://lawttorney.ai"

jobs:
  add_origin:
    name: Add CORS origin on prod
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.lawttorney.com/pyapi/health

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_PROD }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Edit .env, restart service, verify CORS
        env:
          NEW_ORIGIN: ${{ github.event.inputs.new_origin }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${{ secrets.SERVER_USER_PROD }}@${{ secrets.SERVER_HOST_PROD }}" \
              "NEW_ORIGIN='$NEW_ORIGIN' bash -s" << 'ENDSSH'
          set -euo pipefail

          ENV_FILE=/root/Lawtech-AI/.env
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE not found"
            exit 1
          fi

          echo "=========================================================="
          echo " 1. Current ALLOWED_ORIGINS line"
          echo "=========================================================="
          sudo grep -n "^ALLOWED_ORIGINS=" "$ENV_FILE" || echo "  (no ALLOWED_ORIGINS line — will append)"
          echo

          echo "=========================================================="
          echo " 2. Backup .env"
          echo "=========================================================="
          BACKUP="/root/Lawtech-AI/.env.backup-$(date +%s)"
          sudo cp "$ENV_FILE" "$BACKUP"
          echo "Backup: $BACKUP"
          echo

          echo "=========================================================="
          echo " 3. Add '$NEW_ORIGIN' if not already present"
          echo "=========================================================="
          if sudo grep -q "^ALLOWED_ORIGINS=" "$ENV_FILE"; then
            # ALLOWED_ORIGINS exists — append the new origin if missing.
            CURRENT=$(sudo grep "^ALLOWED_ORIGINS=" "$ENV_FILE" | head -1 | sed 's/^ALLOWED_ORIGINS=//')
            echo "Existing value: $CURRENT"
            if echo ",$CURRENT," | grep -q ",$NEW_ORIGIN,"; then
              echo "  '$NEW_ORIGIN' already present — no change"
              NEW_LINE="ALLOWED_ORIGINS=$CURRENT"
            else
              # Strip trailing comma, append new origin
              CURRENT_TRIM=$(echo "$CURRENT" | sed 's/,*$//')
              NEW_LINE="ALLOWED_ORIGINS=${CURRENT_TRIM},${NEW_ORIGIN}"
              echo "New value: $NEW_LINE"
              sudo sed -i "s|^ALLOWED_ORIGINS=.*|$NEW_LINE|" "$ENV_FILE"
            fi
          else
            # No ALLOWED_ORIGINS line yet — append one.
            NEW_LINE="ALLOWED_ORIGINS=$NEW_ORIGIN"
            echo "Appending new line: $NEW_LINE"
            echo "$NEW_LINE" | sudo tee -a "$ENV_FILE" >/dev/null
          fi
          echo

          echo "=========================================================="
          echo " 4. Verify updated .env line"
          echo "=========================================================="
          sudo grep "^ALLOWED_ORIGINS=" "$ENV_FILE"
          echo

          echo "=========================================================="
          echo " 5. Restart lawttorney-v2 to pick up new env"
          echo "=========================================================="
          sudo systemctl restart lawttorney-v2
          echo "Waiting for healthy..."
          for i in $(seq 1 12); do
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:5001/pyapi/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  Healthy after $((i * 3))s"
              break
            fi
            echo "  Waiting... attempt $i/12 (HTTP $STATUS)"
            if [ "$i" = "12" ]; then
              echo "ERROR: service didn't come back. Rolling back."
              sudo cp "$BACKUP" "$ENV_FILE"
              sudo systemctl restart lawttorney-v2
              exit 1
            fi
          done
          echo

          echo "=========================================================="
          echo " 6. Verify CORS via OPTIONS preflight"
          echo "=========================================================="
          # Send a preflight from the new origin against the actual chat
          # endpoint nginx proxies to.
          RESP=$(curl -s -i -X OPTIONS \
            -H "Origin: $NEW_ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,x-api-key" \
            --max-time 10 \
            http://localhost:5001/pyapi/chat 2>&1 || true)
          echo "$RESP" | grep -iE "^HTTP|access-control-allow-origin|access-control-allow-methods|access-control-allow-headers" | head -10
          echo
          if echo "$RESP" | grep -qi "Access-Control-Allow-Origin"; then
            ACAO=$(echo "$RESP" | grep -i "Access-Control-Allow-Origin" | head -1)
            if echo "$ACAO" | grep -qiE "$NEW_ORIGIN|\\*"; then
              echo "  ✓ CORS header confirms '$NEW_ORIGIN' is allowed"
            else
              echo "  ⚠ ACAO returned but does not match '$NEW_ORIGIN' — inspect:"
              echo "  $ACAO"
            fi
          else
            echo "  ⚠ No Access-Control-Allow-Origin header in response"
          fi
          echo

          echo "=========================================================="
          echo " DONE — backup at $BACKUP (delete after verifying)"
          echo "=========================================================="
          ENDSSH

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
