name: ci-case-workspace

# Runs the case-workspace test suites against a real PostgreSQL service.
# tests/test_case_store_pg.py fails (does not skip) when CI=true and
# TEST_POSTGRES_URL is missing, so this job can never go green without the SQL
# being exercised. Only the dependencies these suites import are installed:
# pulling requirements.txt (torch, sentence-transformers) would add ~10 minutes
# for code paths the case tests never touch.

on:
  pull_request:
    paths:
      - "core/case_*.py"
      - "core/jwt_auth.py"
      - "config/case_types.py"
      - "workers/**"
      - "tests/test_case_*.py"
      - "tests/case_support.py"
      - "scripts/case_bucket_smoke.py"
      - "requirements-ci-case.txt"
      - ".github/workflows/ci-case-workspace.yml"
  push:
    branches: ["dev", "feat/case-workspace"]

jobs:
  case-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lawtech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lawtech_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/lawtech_test
      EMBEDDING_SERVICE_URL: http://127.0.0.1:9
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-case.txt
      - run: pip install -r requirements-ci-case.txt
      - run: python -m pytest tests/test_case_jwt_auth.py tests/test_case_auth.py tests/test_case_routes.py tests/test_case_health.py tests/test_case_sniff.py tests/test_case_s3.py tests/test_case_documents.py tests/test_case_store_pg.py tests/test_case_store_pg_docs.py -q -p no:cacheprovider
