# nginx site config for api.lawttorney.com → Lawtech-AI v2 backend.
#
# Install:
#   sudo cp deploy/nginx/api.lawttorney.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/api.lawttorney.com.conf \
#               /etc/nginx/sites-enabled/api.lawttorney.com.conf
#   sudo rm /etc/nginx/sites-enabled/default     # drop the welcome page
#   sudo nginx -t && sudo systemctl reload nginx
#
# After DNS A-record resolves to this box:
#   sudo certbot --nginx -d api.lawttorney.com
# Certbot will edit this file in-place to add the 443 server block and
# the http→https redirect. Re-issued cert will auto-renew via systemd timer.

server {
    listen 80;
    listen [::]:80;
    server_name api.lawttorney.com;

    # Certbot ACME challenge — keep this above any catch-all so HTTP-01 works.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── v2 API at /pyapi/* (backend's native prefix) ─────────────────────
    location ^~ /pyapi/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Real client IP for the app — pairs with TRUSTED_PROXY_IPS=127.0.0.1
        # in .env so Phase 4's ProxyHeadersMiddleware honours these.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming requires NO buffering — without this, /pyapi/search/stream
        # tokens buffer indefinitely and clients see one big chunk at the end.
        proxy_buffering    off;
        proxy_cache        off;
        # Keep upstream connection alive long enough for slow drafting calls
        # (p95 ~140 s under load). Match gunicorn timeout=300.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Pass the streaming connection close cleanly.
        proxy_set_header Connection "";
    }

    # ── Legacy /pyapiv2/* — rewrite to /pyapi/* on the backend ───────────
    # The backend exposes /pyapi/* routes natively; the /pyapiv2/ prefix
    # exists only for backward compat with the public URL that existed
    # before this cutover. Frontend can migrate to /pyapi/ on its own
    # schedule.
    location ^~ /pyapiv2/ {
        rewrite ^/pyapiv2/(.*)$ /pyapi/$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        proxy_set_header Connection "";
    }

    # Anything else — small identity page so wrong URLs don't show the
    # welcome page. Useful when debugging DNS.
    location / {
        default_type text/plain;
        return 200 "Lawttorney API host — try /pyapi/health\n";
    }
}
