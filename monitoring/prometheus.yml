global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "lawtech-ai"
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: "/pyapi/metrics"
    # Prometheus sends this as: Authorization: Bearer <token>
    # core/auth.py accepts both X-API-Key and Bearer token for admin endpoints.
    # Replace "your-admin-key-here" with your actual ADMIN_API_KEY value.
    authorization:
      type: "Bearer"
      credentials: "your-admin-key-here"
